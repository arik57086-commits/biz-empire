const TR_ATTR=['placeholder','title','aria-label'];

    const done=v=>{ d.innerHTML=''; res(v); };
    document.getElementById('dOk').onclick=()=>done(true);
    document.getElementById('dNo').onclick=()=>done(false);
  });
}
function askText(title,value='',o={}){
  return new Promise(res=>{

}

  const s=await FB.db.collection('users').doc(uid).get();
  if(!s.exists) return null;
  const a=s.data(); a.login=uid; migrate(a); DB.accounts[uid]=a; return a;
}
async function loadFriends(){ const u=me(); if(!u) return; await Promise.all((u.friends||[]).map(f=>loadUser(f).catch(()=>null))); }

// шанс каждого предмета в кейсе/наборе: шанс его редкости, поделённый поровну между предметами этой редкости
function contentsOf(box){
  const list=box.pool.map(item), present=RAR_ALL.filter(r=>box.odds[r]>0&&list.some(x=>x.r===r));
  const tot=present.reduce((s,r)=>s+box.odds[r],0);
  return list.map(x=>({x,chance:present.includes(x.r)?box.odds[x.r]/tot/list.filter(y=>y.r===x.r).length:0})).filter(e=>e.chance>0);
}
function pickFrom(box){ const c=contentsOf(box); let r=Math.random(); for(const e of c){ r-=e.chance; if(r<=0) return e.x; } return c[c.length-1].x; }

const DROP_TABLE=[['none',80],['card0',10],['box',5],['card1',4],['card2',0.8],['card3',0.16],['card4',0.03],['card5',0.01]];
function rollDrop(guaranteed){
  const tab=guaranteed?DROP_TABLE.filter(x=>x[0]!=='none'):DROP_TABLE;
  const tot=tab.reduce((s,x)=>s+x[1],0); let r=Math.random()*tot, k=tab[tab.length-1][0];
  for(const [n,w] of tab){ r-=w; if(r<0){ k=n; break; } }
  if(k==='none') return null;
  if(k==='box'){ if(NY_ON&&Math.random()<0.35) return item('case_snow'); const b=Math.random();
    return b<0.6?item('set_'+randOf(COLL_KEYS)):b<0.8?item('set_start'):b<0.9?item('set_elite'):item(randOf(['case_emp','case_lux','case_coll'])); }
  return randOf(CARDS.filter(x=>x.r===+k.slice(4)));
}

function cleanSlots(a){

    if(!x||x.type!=='card'||!c||x.coll!==collOf(c)) delete a.slots[k]; }
  return a.slots;
}

function ensureTasks(a){
  const day=today();
  if(a.tasks&&a.tasks.day===day&&a.tasks.v===TASKS_V&&(a.tasks.ny||false)===NY_ON) return a.tasks;
  let h=0; for(const ch of day) h=(h*31+ch.charCodeAt(0))&0x7fffffff;
  const rnd=()=>(h=(h*1103515245+12345)&0x7fffffff)/0x7fffffff;
  const can=t=>!t.mode||!modeLock(t.mode,a);

  const modeT=mix(TASK_POOL.filter(t=>t.mode&&can(t)));

  const pickM=[]; for(const t of modeT) if(pickM.length<2&&!pickM.some(p=>p.mode===t.mode)) pickM.push(t);
  const pool=NY_ON?[...pickM.slice(0,1),mix(TASK_POOL.filter(t=>t.ny))[0],...mix(TASK_POOL.filter(t=>!t.mode&&!t.ny))].slice(0,4):[...pickM,...mix(TASK_POOL.filter(t=>!t.mode&&!t.ny))].slice(0,4);
  const old=a.tasks&&a.tasks.day===day?a.tasks.list:[];
  a.tasks={day,v:TASKS_V,ny:NY_ON,list:pool.map(t=>old.find(o=>o.id===t.id)||{id:t.id,prog:0,done:false})};
  return a.tasks;
}

function glideTokens(was){
  G.players.forEach((p,k)=>{
    const el=document.querySelector(`#c${p.pos} .tok[data-pid="${p.id}"]`);
    if(!el||p.out) return;
    const to=el.getBoundingClientRect(), fly=GLIDE[p.id];
    const from=fly?fly.getBoundingClientRect():TOKR[p.id];
    if(fly){ fly.remove(); delete GLIDE[p.id]; }
    if(p.pos===was.pos[k]||!from||!to.width) return;
    const dx=from.left-to.left, dy=from.top-to.top, dist=Math.hypot(dx,dy); if(dist<2) return;

    const c=el.cloneNode(true); c.classList.add('tglide');
    c.style.cssText+=`;position:fixed;left:${to.left}px;top:${to.top}px;width:${to.width}px;height:${to.height}px;margin:0;z-index:60;pointer-events:none;transform:translate(${dx}px,${dy}px);transition:transform ${ms}ms cubic-bezier(.45,.05,.35,1)`;
    document.body.appendChild(c); el.style.visibility='hidden'; GLIDE[p.id]=c;
    requestAnimationFrame(()=>requestAnimationFrame(()=>{ c.style.transform='translate(0,0)'; }));
    setTimeout(()=>{ if(GLIDE[p.id]===c){ c.remove(); delete GLIDE[p.id]; const r=document.querySelector(`#c${p.pos} .tok[data-pid="${p.id}"]`); if(r) r.style.visibility=''; } },ms+30);

// ====== СМЕНА ВЕДУЩЕГО: если создатель комнаты пропал на 2,5 минуты, партию подхватывает другой игрок ======
const HOST_GONE_MS=150000;
setInterval(()=>{ // ведущий отмечается, что жив
  if(NET.role==='host'&&G&&G.online&&!G.over&&FB) roomRef(G.rid).update({hostSeen:Date.now()}).catch(()=>{});
  // комната ещё ждёт игроков — создатель отмечается, что он на месте (иначе комнату спрячут из лобби)
  else if(FB&&NET.rid&&NET.room&&NET.room.status==='waiting'&&NET.room.host===DB.session) roomRef(NET.rid).update({hostSeen:Date.now()}).catch(()=>{});
},30000);
setInterval(async()=>{ // гости проверяют ведущего
  const r=NET.room; if(NET.role!=='guest'||NET.spec||!r||r.status!=='playing'||!G||G.over||!FB) return;
  if(Date.now()-(r.hostSeen||r.created||0)<HOST_GONE_MS) return;
  // подхватывает первый по порядку игрок, который сейчас в сети (кроме пропавшего ведущего)
  const c=G.players.filter(p=>!p.out&&p.uid&&p.uid!==r.host&&isOnlineUid(p.uid));
  if(!c.length||c[0].uid!==DB.session) return;
  try{
    await FB.db.runTransaction(async tx=>{ const ref=roomRef(r.id), s=await tx.get(ref); const d=s.data();
      if(!s.exists||d.status!=='playing'||d.host!==r.host||Date.now()-(d.hostSeen||0)<HOST_GONE_MS) throw 'skip';
      tx.update(ref,{host:DB.session,hostName:(me()||{}).name||'',hostSeen:Date.now(),takenBy:DB.session,takenAt:Date.now()}); });
    toast('🔄 Создатель пропал — партию теперь ведёте вы. Не закрывайте вкладку!');
  }catch(e){ if(e!=='skip') console.error('takeover',e); }
},15000);

// ====== ГРАФИК ПАРТИИ: капитал каждого игрока по кругам ======
function graphSVG(players,hist){
  if(!hist||hist.length<2) return '<p class="muted">График появится, когда партия длится хотя бы 2 круга.</p>';
  const W=480,H=200,P=34, max=Math.max(1,...hist.flat()), n=hist.length;
  const X=k=>P+(W-P-8)*k/(n-1), Y=v=>H-22-(H-34)*v/max;
  const lines=players.map((p,j)=>`<polyline fill="none" stroke="${p.c||p.color}" stroke-width="3" stroke-linejoin="round" points="${hist.map((h,k)=>X(k).toFixed(1)+','+Y(h[j]||0).toFixed(1)).join(' ')}"/>`).join('');
  const grid=[0,0.5,1].map(f=>`<line x1="${P}" x2="${W-8}" y1="${Y(max*f)}" y2="${Y(max*f)}" stroke="#8885" stroke-dasharray="3 4"/><text x="2" y="${Y(max*f)+4}" font-size="10" fill="#8a93a6">${fmtCell(max*f).replace('$','')}</text>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;background:#1e222d;border-radius:8px">${grid}${lines}
    <text x="${P}" y="${H-6}" font-size="10" fill="#8a93a6">круг 1</text><text x="${W-8}" y="${H-6}" font-size="10" fill="#8a93a6" text-anchor="end">круг ${n}</text></svg>
    <div style="margin-top:4px">${players.map(p=>`<span class="badge" style="background:${p.c||p.color};color:#fff">${esc(p.n||p.name)}</span>`).join('')}</div>`;
}

    <div style="text-align:center;margin-top:10px"><button class="sec" id="grx">Закрыть</button></div></div></div>`;

async function surrender(p){

const kickNeed=t=>Math.floor(G.players.filter(x=>!x.out&&x!==t).length/2)+1;
function kickVote(voter,tid){
  const t=G&&G.players[tid]; if(!t||!voter||t.out||voter.out||voter===t||G.over) return;
  if(isOnlineUid(t.uid)){ if(!isRemote(voter)) toast(`${t.name} снова в сети — голосование не нужно`); return; }
  G.kick=G.kick||{}; const v=G.kick[tid]=G.kick[tid]||[]; if(v.includes(voter.id)) return; v.push(voter.id);
  const need=kickNeed(t);
  log(`🗳 ${pn(voter)} голосует за исключение ${pn(t)} (вышел из игры): ${v.length}/${need}`);
  if(v.length>=need){ delete G.kick[tid]; log(`🗳 Большинство за — ${pn(t)} исключён и автоматически сдаётся`); doSurrender(t); }
  render(); netPublishNow();
}
const EARLY_SURRENDER=5; // сдался за первые 5 своих ходов — награды за матч нет
function doSurrender(p){
  if(!G||p.out||G.over) return;
  log(`🏳️ ${pn(p)} сдаётся`);
  if((p.turns||0)<=EARLY_SURRENDER){ p.noReward=true; log(`${pn(p)} сдался в первые ${EARLY_SURRENDER} ходов — награды за этот матч не будет`); }
  bankrupt(p,-1);
  if(endIfLastStanding()) return;
  if(pending&&actor()===p) answer(G.phase==='debt'?'give':'surrender');
}

}

// Третий кубик (режимы с third): появляется, когда кто-то впервые прошёл круг.

const face3=c=>c==='T'?'🚂':c==='W'?'💼':DIE[c-1];

  if(t<0){ for(let k=1;k<40&&t<0;k++){ const j=(p.pos+k)%40, s=G.cells[j]; if(isOwnable(CELLS[j])&&s.owner>=0&&s.owner!==p.id&&!s.mort) t=j; } why='компании соперника'; }
  if(t<0){ log(`💼 ${pn(p)}: ехать некуда — все компании свои или заложены`); return; }
  log(`💼 ${pn(p)} едет к ближайшей ${why}: ${cn(t)}`);
  await sleep(350); await moveTo(p,t); await land(p,G.lastDice);
}
function sendJail(p){ p.pos=10; p.inJail=true; p.jailTries=0; p.dbl=0; log(`${pn(p)} отправляется в тюрьму 🚔`); render(); }

async function land(p,dice){
  const i=p.pos, c=CELLS[i], s=G.cells[i];
  render();
  // встал ровно на Старт — выплата за круг ещё раз (всего вдвое больше)
  if(c.type==='start'&&G.justPassed===p.id){ const sal=salary(); if(sal){ p.money+=sal; log(`🎯 ${pn(p)} встаёт ровно на Старт — ещё ${fmt(sal)} (всего ${fmt(sal*2)})`); SFX.coin&&SFX.coin(); render(); } }
  G.justPassed=null;
  if(isOwnable(c)){
    if(s.owner<0){
      // живой игрок всегда выбирает сам: «Купить» (серая, если не хватает денег — можно заложить/обменяться и купить) или аукцион/отказ
      if(!p.bot||p.money>=c.price){
        let buy=false;
        if(p.bot) buy=false;
        else { for(;;){ const v=await ask('buy',{i}); if(p.out) return; if(v!=='buy') break; if(p.money>=c.price){ buy=true; break; } toast('Не хватает денег — заложите компанию или обменяйтесь'); } }
        if(p.out) return;
        if(buy){ p.money-=c.price; s.owner=p.id; log(`${pn(p)} покупает ${cn(i)} за ${fmt(c.price)}`); track(p,'buy'); }
        else { log(`${pn(p)} ${p.money<c.price?'не покупает (не хватает денег)':'отказывается покупать'} ${cn(i)}`); if(OPT().auction) await auction(i,p); }
      } else { log(`${pn(p)} не хватает денег на ${cn(i)}`); if(OPT().auction) await auction(i,p); }
    } else if(s.owner!==p.id){
      if(OPT().teams&&G.players[s.owner].team===p.team) log(`${pn(p)} попадает на ${cn(i)} напарника — платить не нужно 🤝`);
      else if(s.mort) log(`${pn(p)} попадает на ${cn(i)} — компания заложена, платить не нужно`);
      else { const o=G.players[s.owner], bon=cellBonus(o,i), r=rentDue(i,dice);
        const hasHQ=!!c.g&&groupCells(c.g).some(j=>G.cells[j].hq&&G.cells[j].owner===o.id);
        const notes=[bon?`+${bon}% карточка`:'',evOn('crisis')?'−30% кризис':'',evOn('boom')&&c.g===G.event.g?'+50% бум':'',hasHQ?'+25% 🏛':''].filter(Boolean);
        log(`${pn(p)} платит ${pn(o)} аренду ${fmt(r)} за ${cn(i)}${notes.length?` <span style="color:#ffb627">(${notes.join(', ')})</span>`:''}`); await pay(p,r,o.id);
        let got=r; const sh=rentShare(); if(sh<1&&!p.out){ const cut=r-Math.round(r*sh/10)*10; o.money-=cut; got=r-cut; log(`🏦 ${pn(o)} получает только ${Math.round(sh*100)}% — ${fmt(got)}, остальное ${fmt(cut)} забирает Банк`); render(); }
        track(o,'rent',got); track(o,'rentMax',got);
        if(!p.out) payDividends(i,got); }
    }
  } else if(c.type==='tax'){ if(evOn('taxfree')) log(`🧾 Налоговые каникулы — ${pn(p)} ничего не платит`); else { log(`${pn(p)} платит ${c.name.toLowerCase()} ${fmt(c.amount)}`); await pay(p,c.amount,-1); if(!p.out) toJackpot(c.amount); } }
  else if(c.type==='stock') await stock(p);
  else if(isJpCell(i)) takeJackpot(p);
  else if(isPortal(i)&&!G.noPortal) await portal(p,i);
  else if(c.type==='chance') await chance(p);
  else if(c.type==='casino'){ if(OPT().jackpot&&!isJpCell(JP_CELL)&&G.jackpot>0) takeJackpot(p); await casino(p); }
  else if(c.type==='gojail') sendJail(p);
  render();
}

function toJackpot(a){ if(!OPT().jackpot||!G||!(a>0)) return; G.jackpot=(G.jackpot||0)+a; render(); }
// ====== ПОРТАЛЫ (галочка): две клетки «Шанс» становятся порталами ======
const PORTALS=[7,22];
// верхний портал (клетка 7): при включённом джекпоте здесь клетка «Джекпот», портал остаётся внизу (22)
const JP_CELL=7;
const isJpCell=i=>!!(G&&OPT().jackpot&&i===JP_CELL&&CELLS[i]&&CELLS[i].type==='chance');
const isPortal=i=>!!(G&&OPT().portal&&PORTALS.includes(i)&&CELLS[i]&&CELLS[i].type==='chance'&&!isJpCell(i));
function takeJackpot(p){ if(G.jackpot>0){ p.money+=G.jackpot; log(`💰 ${pn(p)} срывает <b>джекпот ${fmt(G.jackpot)}</b>!`); track(p,'jackpot'); G.jackpot=0; SFX.coin&&SFX.coin(); render(); } else log(`💰 ${pn(p)} встаёт на джекпот, но он пока пуст`); }
// 🌀 ПОРТАЛ: случайные точки на поле; чем больше заплатишь, тем больше точек на выбор
// 1k — 2 случайные точки на выбор, 2k — 3, 3k — 4 (деньги уходят в джекпот)
const PORTAL_TIERS=[[1000,2],[2000,3],[3000,4]];
async function portal(p,i){
  const v=await ask('portal',{tiers:PORTAL_TIERS}); if(p.out) return;
  if(v==='stay'||v==null){ log(`🌀 ${pn(p)} остаётся у портала`); return; }
  const [cost,n]=PORTAL_TIERS[+v]||PORTAL_TIERS[0];
  if(cost>p.money){ log(`🌀 ${pn(p)}: не хватает денег на портал`); return; }
  if(cost){ await pay(p,cost,-1); if(p.out) return; toJackpot(cost); }
  const pool=CELLS.map((c,j)=>j).filter(j=>j!==i&&!['gojail','jail'].includes(CELLS[j].type)&&!PORTALS.includes(j));
  const opts=[]; while(opts.length<n&&pool.length) opts.push(pool.splice(gRnd()*pool.length|0,1)[0]);
  let t=opts[0];
  if(opts.length>1){ const a=await ask('portalpick',{cells:opts}); if(p.out) return; if(opts.includes(+a)) t=+a; }
  log(`🌀 ${pn(p)} проходит через портал${cost?` (за ${fmt(cost)})`:''} и попадает на ${cn(t)}`); SFX.event(); track(p,'portal');
  p.pos=t; render(); await sleep(400);
  await land(p,G.lastDice);
}

// ====== ФОНДОВЫЙ РЫНОК: акции компаний соперников ======
const STOCK_CUT=0.1, STOCK_MAX=2;
const stockPrice=i=>Math.round(CELLS[i].price*0.5/10)*10;
const stockOpts=p=>CELLS.map((c,i)=>i).filter(i=>{ const s=G.cells[i]; return isOwnable(CELLS[i])&&s.owner>=0&&s.owner!==p.id&&!s.mort&&!(s.sh||[]).includes(p.id)&&(s.sh||[]).length<STOCK_MAX; })
  .sort((a,b)=>calcRent(b,7)-calcRent(a,7)).slice(0,6);
async function stock(p){
  const opts=stockOpts(p).filter(i=>p.money>=stockPrice(i));
  if(!opts.length){ log(`📊 ${pn(p)} на фондовом рынке, но купить нечего`); return; }
  let pick=null;
  if(p.bot){ const i=opts[0]; if(p.money-stockPrice(i)>=4000&&gRnd()<0.6) pick=i; await sleep(400); }
  else { const v=await ask('stock',{opts}); if(p.out) return; if(opts.includes(+v)) pick=+v; }
  if(pick===null){ log(`📊 ${pn(p)} не покупает акции`); return; }
  const s=G.cells[pick]; p.money-=stockPrice(pick); s.sh=[...(s.sh||[]),p.id];
  log(`📊 ${pn(p)} покупает акцию ${cn(pick)} за ${fmt(stockPrice(pick))} — теперь ${STOCK_CUT*100}% её аренды идёт ${pn(p)}`);
  render();
}
// владелец получил аренду r за клетку i — акционеры получают свою долю
function payDividends(i,r){
  const s=G.cells[i], o=G.players[s.owner]; if(!s.sh||!o) return;
  for(const k of s.sh){ const h=G.players[k]; if(!h||h.out||h===o) continue;
    const cut=Math.min(o.money,Math.round(r*STOCK_CUT/10)*10); if(cut<=0) continue;
    o.money-=cut; h.money+=cut; log(`📊 ${pn(h)} получает дивиденды ${fmt(cut)} с ${cn(i)}`); }
  render();
}
// компания ушла Банку — штаб-квартира и акции пропадают

// ====== АУКЦИОН ======
// Аукцион виден всем: G.auc = {i, price, leader, all:[ids], active:[ids], cur, next} — рисуется панелью в центре поля
async function auction(i,decliner){
  const c=CELLS[i], s=G.cells[i];
  let price=c.price, leader=null;
  let active=G.players.filter(p=>!p.out&&p!==decliner&&p.money>=price);
  if(!active.length){ log(`🔨 Аукцион за ${cn(i)} не состоялся — ни у кого нет ${fmt(price)}`); return; }
  log(`🔨 Аукцион за ${cn(i)}! Стартовая цена ${fmt(price)}`);
  const all=active.map(p=>p.id);
  const step=()=>Math.max(100,Math.round(price*0.1/100)*100);
  const setAuc=(cur,next)=>{ G.auc={i,price,leader:leader?leader.id:null,all,active:active.map(p=>p.id),cur:cur?cur.id:null,next}; render(); netPublishNow(); };
  try{
    while(true){
      const others=active.filter(p=>p!==leader);
      if(!others.length) break;
      for(const p of others){
        if(active.length===1&&active[0]===leader) break;
        const next=leader?price+step():price;
        setAuc(p,next);
        const yes=p.money>=next&&(p.bot?false:await askBid(p,i,next,leader,price));
        if(yes){ leader=p; price=next; log(`🔨 ${pn(p)} ставит ${fmt(price)}`); }
        else { active=active.filter(x=>x!==p); log(`🔨 ${pn(p)} пасует`); }
        setAuc(null,null);
      }
    }
  } finally { if(G) G.auc=null; }
  if(leader){ leader.money-=price; s.owner=leader.id; log(`🔨 ${pn(leader)} выигрывает аукцион и покупает ${cn(i)} за ${fmt(price)}`); track(leader,'buy'); track(leader,'aucwin'); }
  else log(`🔨 Никто не купил ${cn(i)}`);
  render(); netPublishNow();
}
// Вопрос конкретному игроку: если он играет по сети с другого компьютера — спрашиваем через базу

  if(isRemote(p)) return askRemote(p,'bid',{i,next,leader:leader?leader.id:null,cur},false).then(v=>!!v);
  return askBidUI(p,i,next,leader,cur);
}

const CASINO_MULT={1:5,2:2.5,3:1.6};
function casinoModal(p){
  if(!G||G.over) return new Promise(()=>{});
  if(isRemote(p)) return askRemote(p,'casino',{},null);
  return casinoModalUI(p);
}
function casinoModalUI(p){
  return new Promise(res=>{
    let bet=1000, nums=[];
    const draw=()=>{
      const win=nums.length?Math.round(bet*CASINO_MULT[nums.length]/100)*100:0;
      $('#modal').innerHTML=`<div class="ov"><div class="box" style="width:440px;text-align:center">
        <h2>🎰 Казино</h2><p class="muted">Выберите ставку и от 1 до 3 чисел. Бросаем кубик — если выпадет ваше число, вы выигрываете!</p>
        <div>${[500,1000,2000].map(b=>`<button class="${b===bet?'':'sec'}" data-bet="${b}" ${p.money<b?'disabled':''}>${fmt(b)}</button>`).join('')}</div>

        <p>${nums.length?`Возможный выигрыш: <b>${fmt(win)}</b> (×${CASINO_MULT[nums.length]})`:'Выберите числа'}</p>
        <button id="cPlay" ${nums.length&&p.money>=bet?'':'disabled'}>Играть</button><button class="sec" id="cNo">Не играть</button></div></div>`;
      document.querySelectorAll('[data-bet]').forEach(b=>b.onclick=()=>{ bet=+b.dataset.bet; draw(); });
      document.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{ const n=+b.dataset.n; nums=nums.includes(n)?nums.filter(x=>x!==n):nums.length<3?[...nums,n]:nums; draw(); });
      $('#cPlay').onclick=()=>{ closeModal(); res({amt:bet,nums}); };

async function casino(p){
  if(p.money<500){ log(`🎰 ${pn(p)} заходит в казино, но на ставку денег нет`); return; }
  let bet=null;
  if(p.bot){ if(p.money>6000&&Math.random()<0.4){ const a=1+(Math.random()*6|0); bet={amt:1000,nums:[a,a%6+1]}; } }
  else bet=await casinoModal(p);
  if(!bet){ log(`🎰 ${pn(p)} не стал играть в казино`); return; }
  p.money-=bet.amt; log(`🎰 ${pn(p)} ставит ${fmt(bet.amt)} на ${bet.nums.join(', ')}`); render();
  const F='⚀⚁⚂⚃⚄⚅';
  for(let k=0;k<8;k++){ $('#dice').textContent='🎰'+F[Math.random()*6|0]; await sleep(80); }
  const r=1+(Math.random()*6|0); $('#dice').innerHTML=G.diceHtml='🎰'+F[r-1];
  if(bet.nums.includes(r)){ const win=Math.round(bet.amt*CASINO_MULT[bet.nums.length]*(evOn('jackpot')?2:1)/100)*100; p.money+=win; log(`🎉 Выпало ${r}! ${pn(p)} выигрывает в казино ${fmt(win)}${evOn('jackpot')?' (джекпот ×2!)':''}`); track(p,'casino'); }
  else log(`🎰 Выпало ${r}. Ставка ${pn(p)} проиграна`);
  render();
}

// ====== КРЕДИТ БАНКА И СРОК ЗАЛОГА ======
const OPT=()=>(G&&G.opt)||{};
// Кредит Банка: 5,000k, вернуть 6,000k за CREDIT_TURNS своих ходов; после возврата новый — через CREDIT_CD ходов
const CREDIT=5000, CREDIT_BACK=6000, CREDIT_TURNS=10, CREDIT_CD=3, MORT_ROUNDS=15;
const creditLeft=p=>p.credit?Math.max(0,(p.credit.dueT!=null?p.credit.dueT:(p.turns||0)+CREDIT_TURNS)-(p.turns||0)):0;
const creditWait=p=>Math.max(0,(p.creditCd||0)-(p.turns||0)); // сколько ходов ждать до нового кредита
const canTakeCredit=p=>!!OPT().credit&&!p.credit&&!creditWait(p);
function takeCredit(p){ if(!canTakeCredit(p)) return; p.money+=CREDIT; p.credit={dueT:(p.turns||0)+CREDIT_TURNS}; log(`🏦 ${pn(p)} берёт у Банка в кредит ${fmt(CREDIT)} — вернуть ${fmt(CREDIT_BACK)} за ${CREDIT_TURNS} своих ходов`); render(); }
function repayCredit(p){ if(!p.credit||p.money<CREDIT_BACK) return; p.money-=CREDIT_BACK; p.credit=null; p.creditCd=(p.turns||0)+CREDIT_CD; log(`🏦 ${pn(p)} возвращает кредит Банку. Новый можно взять через ${CREDIT_CD} хода`); track(p,'repay'); render(); }
function checkMortgages(){
  if(!OPT().mortLimit) return;
  G.cells.forEach((s,i)=>{ if(s.mort&&s.owner>=0&&(G.round-(s.mortR||G.round))>=MORT_ROUNDS){
    log(`🔒 Срок залога ${cn(i)} истёк — компания уходит Банку`); s.owner=-1; s.mort=false; s.level=0; resetCell(s); } });
}
const mortLeft=s=>OPT().mortLimit?Math.max(0,MORT_ROUNDS-((G.round||1)-(s.mortR||G.round||1))):'';
async function chance(p){
  const k=CHANCE[gRnd()*CHANCE.length|0];
  log(`${pn(p)} — «${chanceName()}»: ${k.t}`); if(NY_ON) track(p,'chancegift');
  await sleep(300);
  if(k.money>0) p.money+=k.money;
  if(k.money<0){ await pay(p,-k.money,-1); if(!p.out){ track(p,'chancepay',-k.money); toJackpot(-k.money); } }
  if(k.card) p.jailCards++;
  if(k.jail) sendJail(p);
  if(k.go!==undefined){ const t=CELLS.findIndex(c=>c.name===k.go); await moveTo(p,t); if(t!==0) await land(p,G.lastDice); }
  if(k.back){ p.pos=(p.pos-k.back+40)%40; render(); await land(p,G.lastDice); }
  if(k.each){ for(const o of G.players) if(o!==p&&!o.out&&!p.out) await pay(o,k.each,p.id); }
  if(k.perLevel){ const t=G.cells.reduce((sum,s)=>sum+(s.owner===p.id?s.level:0),0)*k.perLevel; if(t){ log(`${pn(p)} платит за ремонт ${fmt(t)}`); await pay(p,t,-1); if(!p.out){ track(p,'chancepay',t); toJackpot(t); } } }
  render();
}
async function pay(p,amt,to){
  if(p.money<amt){
    if(p.bot) autoLiquidate(p,amt);
    else { G.debt={pid:p.id,amt,to}; const r=await ask('debt'); G.debt=null; if(r!=='pay'){ bankrupt(p,to,amt); return; } }
    if(p.money<amt){ bankrupt(p,to,amt); return; }
  }
  p.money-=amt; if(to>=0) G.players[to].money+=amt; render();
}
function bankrupt(p,to,debt){
  if(p.out) return;
  const cred=to>=0?G.players[to]:null;
  G.cells.forEach((s,i)=>{ if(s.owner===p.id) while(s.level>0) sellBranch(p,i); });
  // кредитор получает долг деньгами: продаются филиалы и закладываются компании; хватило — ровно долг, нет — всё, что собрали
  let paid=0;
  if(cred){ G.cells.forEach((s,i)=>{ if(s.owner===p.id&&!s.mort&&isOwnable(CELLS[i])){ p.money+=CELLS[i].price/2; s.mort=true; } });
    paid=Math.max(0,debt!=null?Math.min(debt,p.money):p.money); cred.money+=paid; track(cred,'kill'); }
  // кредитору — только деньги; компании возвращаются Банку, акции банкрота пропадают
  G.cells.forEach(s=>{ if(s.owner===p.id){ s.owner=-1; s.mort=false; resetCell(s); } if(s.sh&&s.sh.includes(p.id)) s.sh=s.sh.filter(x=>x!==p.id); });
  p.money=0; p.out=true; p.inJail=false; p.credit=null; checkRentStage();
  log(`💥 ${pn(p)} объявляет банкротство${cred?` — ${pn(cred)} получает ${fmt(paid)}${debt!=null&&paid<debt?` из ${fmt(debt)}`:''}, компании возвращаются Банку`:' — компании возвращаются Банку'}`);
  render();
}

// ====== ОБМЕН ======
// t = {from, to, give:[клетки from→to], get:[клетки to→from], mFrom, mTo}
// компании можно менять вместе с филиалами — филиалы переходят к новому владельцу
const canTradeCell=(i,pid)=>isOwnable(CELLS[i])&&G.cells[i].owner===pid;
function tradeText(t){
  const A=G.players[t.from],B=G.players[t.to];
  const side=(cells,m)=>{ const parts=cells.map(i=>`${CELLS[i].ic} ${CELLS[i].name}${G.cells[i].level?' '+'★'.repeat(G.cells[i].level):''}${G.cells[i].mort?' 🔒':''}`); if(m) parts.push('💰 '+fmt(m)); return parts.length?parts.join(', '):'ничего'; };
  return `${pn(A)} отдаёт: ${side(t.give,t.mFrom)}<br>${pn(B)} отдаёт: ${side(t.get,t.mTo)}`;
}
function tradeValid(t){
  const A=G.players[t.from],B=G.players[t.to];
  return !A.out&&!B.out&&t.mFrom<=A.money&&t.mTo<=B.money&&t.give.every(i=>canTradeCell(i,t.from))&&t.get.every(i=>canTradeCell(i,t.to))&&(t.give.length+t.get.length+t.mFrom+t.mTo>0);
}
function execTrade(t){
  const A=G.players[t.from],B=G.players[t.to];
  t.give.forEach(i=>G.cells[i].owner=B.id); t.get.forEach(i=>G.cells[i].owner=A.id);
  A.money+=t.mTo-t.mFrom; B.money+=t.mFrom-t.mTo;
  log(`🤝 Обмен состоялся!<br>${tradeText(t)}`.replace(/отдаёт/g,'отдал(а)'));
  track(A,'trade'); track(B,'trade');
  render();
}
function confirmTrade(t){
  if(!G||G.over) return new Promise(()=>{});
  const B=G.players[t.to];
  if(isRemote(B)) return askRemote(B,'trade',{t},false).then(v=>!!v);
  return confirmTradeUI(t);
}
// ====== ДОГОВОР (обмен) — окно в центре поля; компании выбираются нажатием на клетки ======
let TR=null, tradePartner=null;
const tradeVal=(cells,m)=>m+cells.reduce((s,i)=>s+CELLS[i].price*(G.cells[i].mort?0.5:1)+G.cells[i].level*(CELLS[i].house||0),0);
const av2=p=>`<div class="av2" style="background:${p.color}">${p.skin||avLetter(p)}</div>`;
function tItem(i,rm){ const c=CELLS[i], s=G.cells[i];

// 👁 предпросмотр: поле так, как оно будет после обмена (клетки окрашены в цвет нового владельца)
function tradeAfterOwner(i){ if(!TR) return G.cells[i].owner; if(TR.give.includes(i)) return TR.B; if(TR.get.includes(i)) return TR.A; return G.cells[i].owner; }

function tradePreviewNote(){
  if(!TR) return ''; const out=[];
  for(const g of Object.keys(GROUPS)){ const gc=groupCells(g); if(!gc.length) continue;
    for(const pid of [TR.A,TR.B]){ const before=gc.every(j=>G.cells[j].owner===pid), after=gc.every(j=>tradeAfterOwner(j)===pid);

function markTradeCells(){

function closeTrade(){ if(TR&&TR.res) TR.res(false); const hadPrev=TR&&TR.prev; TR=null; document.querySelectorAll('.cell.tprev').forEach(el=>el.classList.remove('tprev')); if(hadPrev&&G) render(); const b=$('#tradeBox'); if(b){ b.classList.remove('on'); b.innerHTML=''; } markTradeCells(); }
function openTrade(partnerId){
  const A=actor(); if(!canAct()) return;
  const others=G.players.filter(o=>o!==A&&!o.out); if(!others.length) return;
  if(partnerId===undefined||!others.some(o=>o.id===partnerId)) partnerId=others.some(o=>o.id===tradePartner)?tradePartner:others[0].id;
  tradePartner=partnerId; closeModal();
  TR={A:A.id,B:partnerId,give:[],get:[],mFrom:0,mTo:0}; drawTrade();
}
function drawTrade(msg=''){

async function proposeTrade(t){

    try{ ok=await confirmTrade(t); }

function autoLiquidate(p,amt){
  while(p.money<amt){

    if(withLv.length){ const i=withLv[0]; sellBranch(p,i); log(`${pn(p)} продаёт филиал в ${cn(i)}`); continue; }
    const m=cellsOf(p.id).filter(i=>canMortgage(i)).sort((a,b)=>CELLS[a].price-CELLS[b].price);

async function turnInner(){

        if(a===b){ p.inJail=false; log(`${pn(p)} выходит из тюрьмы по дублю`); const mv=await chooseMove(p,a,b,c); if(p.out) break;
          await doMove(p,mv); }

          const mv=await chooseMove(p,a,b,c); if(p.out) break;
          await doMove(p,mv); }
        else log(`${pn(p)} остаётся в тюрьме`);
        break;
      }
    }
    if(p.bot) await sleep(650); else await ask('roll');
    if(p.out) break;
    const [a,b,c]=await rollDice(p);
    if(a===b){ if(++p.dbl>=3){ log(`${pn(p)} выбрасывает третий дубль подряд!`); sendJail(p); break; } again=true; }

function nextPlayer(){

    const a=ch.doc.data(); if((a.at||0)<NET.startedAt-3000) return; // старые действия (до перезагрузки) пропускаем

function hostHandleAction(a){
  if(G&&G.over&&a.kind==='drop'){ setDrop(a.uid,a.drop); return; }
  if(!G||G.over) return;
  const p=G.players.find(x=>x.uid===a.uid);
  if(a.kind==='chat'){ gameChatLog(p,a.name,a.text); return; }
  if(!p) return;
  p.afk=0; // игрок на связи
  if(G.kick&&G.kick[p.id]){ delete G.kick[p.id]; log(`${pn(p)} вернулся — голосование за исключение отменено`); }
  if(a.kind==='cmd'&&a.name==='kick') return kickVote(p,+a.pid);
  if(a.kind==='answer'){ if(pending&&actor()===p&&G.phase===a.phase) answer(a.v); return; }
  if(a.kind==='reply'){ const r=NET.resolvers[a.askId]; if(r&&G.remoteAsk&&G.remoteAsk.id===a.askId&&G.remoteAsk.pid===p.id) r(a.v); return; }
  if(a.kind!=='cmd') return;
  const myTurn=pending&&actor()===p;
  if(a.name==='surrender') return doSurrender(p);
  if(!myTurn) return;
  if(a.name==='credit') takeCredit(p);
  if(a.name==='repay') repayCredit(p);
  if(a.name==='cell'&&['roll','end','debt','jail','buy'].includes(G.phase)&&G.cells[a.i]) { cellAction(p,+a.i,a.m); render(); }
  if(a.name==='trade'&&a.t&&a.t.from===p.id) proposeTrade(a.t);
  if(a.name==='give') giveMoney(p,G.players[a.to],+a.amt);
}

async function joinRoom(rid){
  if(me()&&me().banned) return toast('⛔ Ваш аккаунт заблокирован');
  try{
    await FB.db.runTransaction(async tx=>{
      const ref=roomRef(rid), s=await tx.get(ref); if(!s.exists) throw new Error('Комната уже закрыта');
      const r=s.data(); if(r.status!=='waiting') throw new Error('Игра уже началась');
      if(r.uids.includes(DB.session)) return;
      if(r.only&&!r.only.includes(DB.session)) throw new Error('Это комната турнира — войти могут только участники группы');
      if(r.players.length+(r.bots||0)>=r.max) throw new Error('Мест нет');
      if(MODES[r.mode]&&MODES[r.mode].ranked&&levelInfo(me().xp).lvl<MODES.ranked.needLvl) throw new Error(`Рейтинговая игра — с ${MODES.ranked.needLvl} уровня`);
      tx.update(ref,{players:[...r.players,myEntry()],uids:[...r.uids,DB.session]});
    });
    watchRoom(rid); toast('✔ Вы в комнате — ждём начала игры');
  }catch(e){ toast(e.code==='permission-denied'?'Эта игра только для друзей создателя':(e.message||String(e))); }
}
async function leaveRoom(rid){
  try{
    await FB.db.runTransaction(async tx=>{
      const ref=roomRef(rid), s=await tx.get(ref); if(!s.exists) return; const r=s.data();
      tx.update(ref,{players:r.players.filter(p=>p.uid!==DB.session),uids:r.uids.filter(x=>x!==DB.session)});
    });
  }catch(e){ toast('Ошибка: '+(e.message||e)); }
  leaveNet(false); renderSite();
}

      ${passHTML(u)}

        <p class="muted" style="margin-top:-6px">Победа +3 очка, сыгранный матч +1. Места 1–3 в конце месяца получают значок в профиль и опыт (🥇 +500, 🥈 +300, 🥉 +150 XP). Ваши очки: <b>${lbv(u,seasonKey())||0}</b></p>
        ${(DB.season||[]).length?DB.season.map((a,k)=>`<div class="top" data-uprof="${esc(a.login)}" style="cursor:pointer"><span class="pos">${k<3?SEASON_PRIZE[k][0]:k+1}</span>${avc(a,28)}<span class="n">${esc(a.name)}${a.login===u.login?' <span class="muted">(вы)</span>':''}</span><b>${lbv(a,seasonKey())} очк.</b></div>`).join(''):'<p class="muted">В этом сезоне ещё нет очков — сыграйте матч!</p>'}</div>

      ${gameActive()?`<div class="cardw ch" style="margin-bottom:22px"><div><h3>${NET.spec?'👁 Вы смотрите партию':'Идёт партия'}</h3><span class="muted">${M().ic} ${M().n}</span></div><div><button data-act="back">${NET.spec?'Смотреть дальше':'Вернуться в игру'}</button>${NET.spec?'<button class="sec" data-act="stopWatch">Выйти</button>':''}</div></div>`:''}

  friends:()=>{

    const fans=(DB.fans||[]).filter(a=>!(u.friends||[]).includes(a.login));
    const fcard=(a,btn)=>{ const li=levelInfo(a.xp); return `<div class="fitem">${avc(a,80)}<div><div class="fn">${esc(a.name)}</div>
      <div class="muted">@${esc(a.nick||'')} · ${rankOf(li.lvl)[2]} ${rankOf(li.lvl)[1]} · ур. ${li.lvl} · побед ${a.wins} из ${a.matches}</div>${btn}</div></div>`; };
    return `<div class="page"><div class="cardw">
      <div class="crumbs">${avc(u,48)}<a data-go="profile">${esc(u.name)}</a><span class="gt">›</span>Друзья<span class="cnt">${fr.length}</span></div>
      <p class="muted">Ваш ник: <b>@${esc(u.nick||'')}</b> — скажите его друзьям, чтобы они вас добавили.</p>

        `<div class="empty"><div class="e">👥</div><h3>У вас пока нет друзей</h3><p class="muted">Добавьте друга по нику. Друзья могут заходить в ваши игры с пометкой «Только для друзей».</p></div>`}
      </div>
      ${fr.length?(()=>{ const wk=weekKey(), w=a=>a.wk&&a.wk.id===wk?a.wk:{w:0,m:0};

        return `<div class="cardw"><div class="ch"><h3>🏆 Неделя среди друзей</h3><span class="muted">с понедельника</span></div>
          ${list.map((a,k)=>`<div class="top"><span class="pos">${k===0&&w(a).w?'👑':k+1}</span>${avc(a,32)}<span class="n">${esc(a.name)}${a.login===u.login?' <span class="muted">(вы)</span>':''}</span><span><b>${w(a).w}</b> <span class="muted">побед · ${w(a).m} матчей</span></span></div>`).join('')}</div>`; })():''}
      ${FB?clanHTML(u):""}
      ${FB?clanTopHTML():""}
      ${FB?refHTML(u)+feedHTML():""}
      ${fans.length?`<div class="cardw"><div class="ch"><h3>Добавили вас в друзья</h3></div><div class="flist">${fans.map(a=>fcard(a,`<button class="sm" data-act="addfl" data-l="${esc(a.nick||'')}">+ Добавить в ответ</button>`)).join('')}</div></div>`:''}
    </div>`;
  },

  inventory:()=>{
    const u=me(), groups={};
    (u.items||[]).forEach(x=>(groups[x.id]=groups[x.id]||[]).push(x.uid));
    const ids=['tok_default',...Object.keys(groups).sort((a,b)=>item(b).val-item(a).val)];
    const keys=(groups.key||[]).length;
    return `<div class="page"><div class="crumbs">${avc(u,48)}<a data-go="profile">${esc(u.name)}</a><span class="gt">›</span>Инвентарь<span class="cnt">${(u.items||[]).length}</span><button class="sec sm" data-act="book" style="margin-left:auto">📚 Книга коллекций</button><button class="sec sm" data-act="promo">🎟 Промокод</button></div>
      ${(u.items||[]).some(x=>item(x.id).type==='card')?`<div class="cardw" style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 18px">
        <span style="flex:1;min-width:220px">📌 Надето карточек: <b>${Object.keys(cleanSlots(u)).length}</b>. Бонус к аренде дают только карточки, надетые на компании.</span>
        <button class="btn-o" data-act="autoEquip">⚡ Надеть лучшие автоматически</button>
        <div style="width:100%;font-size:13px;line-height:1.9">🏅 <b>Полные коллекции</b> — карточки на всех компаниях коллекции дают каждой ещё <b>+${SET_BONUS}%</b>:<br>
          ${setProgress(u).map(x=>`<span style="white-space:nowrap;margin-right:12px;${x.on===x.all?'color:#2e9e5b;font-weight:700':''}">${COLLECTIONS[x.k].ic} ${COLLECTIONS[x.k].n} ${x.on}/${x.all}${x.on===x.all?' ✔':''}</span>`).join('')}</div></div>`:''}
      <div style="display:flex;gap:12px;margin-bottom:20px"><input class="inp" id="invQ" placeholder="Поиск предметов…" oninput="filterInv()">
        <select class="inp" id="invR" style="width:220px" onchange="filterInv()"><option value="">Все предметы</option>${Object.entries(TYPE_N).map(([k,n])=>`<option value="${k}">${n}</option>`).join('')}</select></div>
      <div class="tgrid">${ids.map(id=>{ const x=item(id), n=id==='tok_default'?1:groups[id].length;
        let btn='';
        if(x.type==='token') btn=u.eq===id?'<button class="sec sm" disabled>✓ Надето</button>':`<button class="sm" data-act="equip" data-i="${id}">Надеть</button>`;
        if(x.type==='case') btn=`<button class="sm btn-o" data-act="open" data-i="${id}" ${keys?'':'disabled title="Нужен ключ 🔑"'}>Открыть 🔑</button>`;
        if(x.type==='set') btn=`<button class="sm btn-o" data-act="open" data-i="${id}">Открыть</button>`;
        if(x.pool) btn+=`<button class="sm sec" data-act="peek" data-i="${id}">👁 Что внутри</button>`;
        if(x.type==='card') btn+=`<button class="sm" data-act="slotCard" data-i="${id}">📌 Надеть на компанию</button>`;
        if(x.val) btn+=`<button class="sm sec" data-act="gift" data-i="${id}">🎁 Подарить</button>`;
        if(x.type==='card'&&upgradeInfo(x)) btn+=`<button class="sm btn-o" data-act="upgrade" data-i="${id}" ${n>=UPGRADE_N?'':`disabled title="Нужно ${UPGRADE_N} одинаковые карточки"`}>⬆ Улучшить (${Math.min(n,UPGRADE_N)}/${UPGRADE_N})</button>`;
        if(isLotItem(x)) btn+=`<button class="sm btn-o" data-act="listLot" data-i="${id}">💰 Выставить на Маркет</button><button class="sm sec" data-act="sell" data-i="${id}">Банку ${fmtC(bankPrice(x))}</button>`;
        else if(x.val) btn+=`<button class="sm sec" data-act="sell" data-i="${id}">Продать ${fmtC(bankPrice(x))}</button>`;
        return `<div class="tile ${u.eq===id?'eq':''}" data-n="${esc(x.n.toLowerCase())}" data-t="${x.type}" title="${esc(x.desc||'')}">${n>1?`<span class="cntb" style="z-index:2">×${n}</span>`:''}
          <div class="tart">${id==='tok_default'?`<div class="art" style="width:180px;height:150px">${avc({...u,eq:'tok_default'},90)}</div>`:itemArt(x,180,150)}</div>
          <div class="tname" style="background:linear-gradient(120deg,${RAR_GRAD[x.r]})">${esc(x.n)}</div>
          <div class="tinfo"><span style="color:${RAR[x.r][1]};font-weight:600">${RAR[x.r][0]}</span> · ${TYPE_N[x.type]} · ${x.val?fmtC(x.val):'не продаётся'}
            ${x.type==='card'?`<div style="color:#e68a00;font-weight:600;margin-top:3px">${COLLECTIONS[x.coll].ic} ${COLLECTIONS[x.coll].n} · +${x.bonus}% к аренде</div>
              ${(()=>{ const on=slotsOf(u,id); return on.length?`<div style="color:#2e9e5b;font-weight:600;margin-top:3px">📌 Надета: ${on.map(k=>esc(BASE_CELLS[k].name)).join(', ')}</div>`
                :'<div class="muted" style="margin-top:3px">Не надета — бонус не действует</div>'; })()}`:''}
            <div style="margin-top:4px">${btn}</div></div></div>`; }).join('')}</div>
      ${!(u.items||[]).length?`<div class="empty"><div class="e">📦</div><h3>Ваш инвентарь пуст</h3><p class="muted">Предметы выпадают после матчей. Их также можно купить на <a style="color:#3b8fd6;cursor:pointer" data-go="market">Маркете</a>.</p></div>`:''}
    </div>`;
  },

  market:()=>{
    const u=me();
    const tab=(t,n)=>`<button class="${marketTab===t?'':'sec'}" data-act="mtab" data-t="${t}">${n}</button>`;
    const typeOrder={key:0,case:1,set:2,card:3,token:4};
    let body='';
    if(marketTab==='buy'){
      const cat=(t,n)=>`<button class="sm ${marketCat===t?'':'sec'}" data-act="mcat" data-t="${t}">${n}</button>`;
      const shown=ITEMS.filter(x=>x.val&&(marketCat==='boxes'?['case','set','key'].includes(x.type):marketCat==='cards'?x.type==='card'&&(!marketColl||x.coll===marketColl):x.type==='token'&&!x.ny));
      const lots=lotsByItem();
      // карточки, кейсы и наборы продают только игроки: самая дешёвая цена и сколько лотов; нет лотов — «нет в наличии»
      const lotRow=x=>{ const L=lots[x.id]||[], best=L[0], mine=best&&best.seller===DB.session;
        return `<div class="mrow2" data-n="${esc(x.n.toLowerCase())}">${itemArt(x,64,46)}
        <div class="mn2"><span class="mnm">${esc(x.n)}</span>${x.pool?` <a data-act="peek" data-i="${x.id}" style="color:#3b8fd6;cursor:pointer;font-size:13px">👁 что внутри</a>`:''}<br><span class="rtag" style="background:${RAR[x.r][1]}">${RAR[x.r][0]}</span> ${x.type==='card'?`<span class="muted" style="font-size:12px">${COLLECTIONS[x.coll].ic} +${x.bonus}%</span>`
            :`<span class="rtag" style="background:#ffb627;color:#3a2a00">${TYPE_N[x.type]}${x.type==='case'?' · 🔑':''}</span>`}</div>
        <div class="mq">${L.length?L.length+' шт.':''}</div>
        <div class="mp">${best?`<small>от</small> ${fmtC(best.price)}`:'—'}</div>${best?`<button class="sm" data-act="buyLot" data-l="${best.id}" ${mine?'disabled title="Это ваш лот"':u.coins<best.price?'disabled title="Не хватает монет"':''}>${mine?'ВАШ ЛОТ':'КУПИТЬ'}</button>`
          :'<button class="sm sec" disabled>НЕТ В НАЛИЧИИ</button>'}<button class="sm sec ordb" data-act="order" data-i="${x.id}" title="Оставить заявку на покупку${bestOrder(x.id)?' · лучшая '+fmtC(bestOrder(x.id).price):''}">📝</button></div>`; };
      const shopRow=x=>`<div class="mrow2" data-n="${esc(x.n.toLowerCase())}">${itemArt(x,64,46)}
        <div class="mn2"><span class="mnm">${esc(x.n)}</span><br><span class="rtag" style="background:${RAR[x.r][1]}">${RAR[x.r][0]}</span> <span class="rtag" style="background:#ffb627;color:#3a2a00">${TYPE_N[x.type]}</span></div>
        <div class="mq muted" style="font-size:12px">Маркет</div>
        <div class="mp">${fmtC(x.val)}</div><button class="sm" data-act="buyItem" data-i="${x.id}" ${u.coins<x.val?'disabled':''}>КУПИТЬ</button></div>`;
      const cats=`${cat('boxes','🧰 Кейсы и наборы')}${cat('cards','🃏 Карточки')}${cat('tokens','♟ Фишки')}
        <input class="inp" id="mq" placeholder="🔍 Поиск по Маркету" value="${esc(marketQ)}" oninput="marketQ=this.value;filterMarket()" style="width:200px;margin-left:8px;display:inline-block">`;
      const wait=DB.lotsReady?'':' <b>Загружаем лоты…</b>';
      if(marketCat==='cards'){
        const list=shown.slice().sort((a,b)=>(lots[b.id]?1:0)-(lots[a.id]?1:0)||(a.coll||'').localeCompare(b.coll||'')||b.r-a.r);
        body=`<h3 style="font-size:28px;font-weight:400;margin-bottom:8px">Карточки от игроков</h3>
          <div style="margin-bottom:10px">${cats}
          <select class="inp" style="width:auto;margin-left:8px" onchange="marketColl=this.value;renderSite()"><option value="">Все коллекции</option>${Object.entries(COLLECTIONS).map(([k,c])=>`<option value="${k}" ${marketColl===k?'selected':''}>${c.ic} ${c.n}</option>`).join('')}</select></div>
          <p class="muted" style="margin-top:0">Карточки не продаются Маркетом — только игроками, по цене, которую назначил продавец. Получить карточку можно после матча, из набора или кейса — или купить здесь у другого игрока.${wait}</p>`+list.map(lotRow).join('');
      } else if(marketCat==='boxes'){
        const boxes=shown.filter(x=>isLotItem(x)).sort((a,b)=>(lots[b.id]?1:0)-(lots[a.id]?1:0)||typeOrder[a.type]-typeOrder[b.type]||a.val-b.val);
        body=`<h3 style="font-size:28px;font-weight:400;margin-bottom:8px">Кейсы и наборы</h3>
          <div style="margin-bottom:10px">${cats}</div>
          <p class="muted" style="margin-top:0">Кейсы и наборы тоже продают только игроки — их получают после матча. Ключи 🔑 продаёт Маркет.${wait}</p>`+
          shown.filter(x=>x.type==='key').map(shopRow).join('')+boxes.map(lotRow).join('');
      } else
      body=`<h3 style="font-size:28px;font-weight:400;margin-bottom:8px">Фишки</h3><div style="margin-bottom:10px">${cats}</div>`+
        shown.sort((a,b)=>a.val-b.val).map(shopRow).join('');
    } else if(marketTab==='sell'){
      const groups={}; (u.items||[]).forEach(x=>(groups[x.id]=(groups[x.id]||0)+1));

function showSlotModal(id){
  const u=me(), x=item(id); if(!u||x.type!=='card') return;
  cleanSlots(u);
  const cells=BASE_CELLS.map((c,i)=>[c,i]).filter(([c])=>isOwnable(c)&&collOf(c)===x.coll);
  const mine=u.items.filter(it=>it.id===id), on=slotsOf(u,id);
  const rows=cells.map(([c,i])=>{
    const cur=u.slots[i]&&item(u.items.find(it=>it.uid===u.slots[i]).id);
    const here=cur&&cur.id===id;
    return `<div class="crow" style="border-left:5px solid ${c.g?GROUPS[c.g].c:COLLECTIONS[x.coll].c}">
      <span class="ci">${c.ic}</span><span class="cnm"><b>${esc(c.name)}</b><br><small class="muted">${cur?`надета: ${esc(cur.n)} (+${cur.bonus}%)`:'свободно'}</small></span>
      ${here?`<button class="sm sec" data-unslot="${i}">Снять</button>`:`<button class="sm" data-slot="${i}">${cur?'Заменить':'Надеть сюда'}</button>`}</div>`; }).join('');
  $('#modal').innerHTML=`<div class="ov" id="slov" style="z-index:55"><div class="box lt" style="width:520px"><button class="x" id="slx">✕</button>
    <div style="display:flex;gap:14px;align-items:center">${itemArt(x,110,80)}<div><h2 style="margin:0">${esc(x.n)}</h2>
      <div class="muted">+${x.bonus}% к аренде · коллекция «${COLLECTIONS[x.coll].n}» · у вас ${mine.length} шт., надето ${on.length}</div></div></div>
    <p style="line-height:1.5">Выберите компанию на поле. Когда в партии она ваша, за неё платят аренду на <b>+${x.bonus}%</b> больше. На одну компанию — одна карточка.</p>
    <div>${rows}</div></div></div>`;

// открыть кейс/набор: предмет выбирается сразу, а потом лента прокручивается и останавливается на нём
function openBox(id){
  const u=me(), x=item(id); if(!u||!x.pool) return;
  if(srvOn()){ apiTry('open',{id}).then(j=>{ if(!j) return; renderSite(); spinReveal(x,item(j.got)); feedDrop(j.got,'выбивает'); }); return; }
  const k=(u.items||[]).findIndex(it=>it.id===id); if(k<0) return;
  if(x.type==='case'){ const kk=u.items.findIndex(it=>it.id==='key'); if(kk<0) return toast('Нужен ключ 🔑'); u.items.splice(kk,1); }
  u.items.splice(u.items.findIndex(it=>it.id===id),1);
  const got=pickFrom(x); addItem(u,got.id); saveDB(); renderSite(); feedDrop(got.id,'выбивает');
  spinReveal(x,got);
}
function spinReveal(box,got){
  const N=56, WIN=48, W=118; // ширина плитки с отступом
  const strip=Array.from({length:N},(_,i)=>i===WIN?got:pickFrom(box));
  $('#modal').innerHTML=`<div class="ov" id="sov" style="z-index:60"><div class="box lt sbox" style="width:640px;max-width:96vw;text-align:center;overflow:hidden">
    <div class="muted">${box.ic} ${esc(box.n)} — открываем…</div>
    <div class="spin"><div class="spinl" id="spl">${strip.map(s=>`<div class="ctile ${s.r>=5?'myth':''}" style="border-bottom:5px solid ${RAR[s.r][1]}">${itemArt(s,104,70)}<span class="cn" style="background:linear-gradient(120deg,${RAR_GRAD[s.r]})">${esc(s.n)}</span></div>`).join('')}</div><i class="spinm"></i></div>
    <button class="sec" id="sskip">Пропустить ⏩</button></div></div>`;
  const L=$('#spl'), vw=L.parentNode.clientWidth;
  const target=-(WIN*W+W/2)+vw/2+(Math.random()-0.5)*W*0.6;
  let done=false, last=0, raf=0;
  const tick=()=>{ const m=getComputedStyle(L).transform; const tx=m&&m!=='none'?+m.split(',')[4]:0; const n=Math.floor((vw/2-tx)/W);
    if(n!==last){ last=n; if(SND.on) beep(900+Math.random()*200,0.025,'triangle',0.025); } if(!done) raf=requestAnimationFrame(tick); };
  const finish=()=>{ if(done) return; done=true; cancelAnimationFrame(raf); showGot(box,got); };
  requestAnimationFrame(()=>{ L.style.transition='transform 6.5s cubic-bezier(.08,.72,.16,1)'; L.style.transform=`translateX(${target}px)`; raf=requestAnimationFrame(tick); });
  L.addEventListener('transitionend',()=>setTimeout(finish,500),{once:true});
  $('#sskip').onclick=finish;
}
function showGot(box,got){
  if(got.r>=3) SFX.event(); else SFX.buy();
  $('#modal').innerHTML=`<div class="ov" id="gov"><div class="box lt" style="width:360px;text-align:center"><div class="muted">${box.ic} ${esc(box.n)} открыт!</div>
    <div style="display:flex;justify-content:center;margin:10px 0" class="${got.r>=5?'myth':''}">${itemArt(got,220,170)}</div><h2>${esc(got.n)}</h2><span class="rtag" style="background:${RAR[got.r][1]}">${RAR[got.r][0]}</span>

// ====== РЫНОК ИГРОКОВ: карточки продают только игроки, по своей цене ======
// lots/{id}: {seller, sellerName, item, price, status:'open'|'sold', buyer, created, soldAt}
// Выставить: карточка уходит из инвентаря в лот. Купить: лот помечается проданным (транзакция), покупатель
// платит и получает карточку. Продавец забирает выручку сам (правила базы не дают писать в чужой профиль).
//@econ{
const LOT_FEE=0.1, BANK_CARD=0.5, LOT_MAX=20, LOT_PRICE_MAX=100000;
//@econ}
// история сделок аккаунта (последние 100): buy — у игрока, sell — игроку, bank — сдал Банку, shop — купил у Маркета, vip
const DEAL_N={trade:['🤝','Обмен с игроком'],gift:['🎁','Подарено другу'],gifted:['🎁','Подарок от друга'],buy:['🛒','Куплено у игрока'],sell:['💰','Продано игроку'],bank:['🏦','Сдано Банку'],shop:['🏪','Куплено у Маркета'],vip:['👑','Куплен VIP']};
function addDeal(u,d){ u.deals=[{t:Date.now(),...d},...(u.deals||[])].slice(0,100); }
function dealsHTML(u){
  const list=(u.deals||[]).filter(d=>dealFilter==='all'||(dealFilter==='in'?['buy','shop','vip'].includes(d.k):['sell','bank'].includes(d.k)));
  const spent=r2((u.deals||[]).filter(d=>['buy','shop','vip'].includes(d.k)).reduce((s,d)=>s+d.price,0));
  const got=r2((u.deals||[]).filter(d=>['sell','bank'].includes(d.k)).reduce((s,d)=>s+(d.net!=null?d.net:d.price),0));
  const f=(k,n)=>`<button class="sm ${dealFilter===k?'':'sec'}" data-act="dealf" data-t="${k}">${n}</button>`;
  return `<h3 style="font-size:28px;font-weight:400;margin-bottom:8px">🧾 История сделок</h3>
    <div style="display:flex;gap:16px;flex-wrap:wrap;margin-bottom:8px;font-size:14px"><span>Потрачено: <b style="color:#e05252">−${fmtC(spent)}</b></span><span>Получено: <b style="color:#2e9e5b">+${fmtC(got)}</b></span></div>
    <div style="margin-bottom:6px">${f('all','Все')}${f('in','🛒 Покупки')}${f('out','💰 Продажи')}</div>`+
    (list.length?list.map(d=>{ const x=d.item?item(d.item):null, [ic,n]=DEAL_N[d.k]||['•',d.k], plus=['sell','bank'].includes(d.k);
      return `<div class="mrow">${x?itemArt(x,110,80):`<div class="art" style="width:110px;height:80px;font-size:40px">${ic}</div>`}
        <div class="mn2">${x?esc(x.n):`VIP на ${d.days} дней`}<br><span class="muted" style="font-size:13px">${ic} ${n}${d.who?` · ${plus?'покупатель':'продавец'}: ${esc(d.who)}`:''}${d.net!=null?` · комиссия ${fmtC(r2(d.price-d.net))}`:''}</span>
          <br><span class="muted" style="font-size:12px">${new Date(d.t).toLocaleString(LOC,{day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'})}</span></div>
        <div class="mp" style="color:${plus?'#2e9e5b':'#e05252'};font-weight:700">${plus?'+':'−'}${fmtC(d.net!=null?d.net:d.price)}</div></div>`; }).join('')
      :'<div class="empty"><div class="e">🧾</div><p class="muted">Здесь появятся ваши покупки и продажи.</p></div>');
}
let dealFilter='all';
//@econ{
const isLotItem=x=>!!x&&['card','case','set'].includes(x.type); // эти предметы продают только игроки
const bankPrice=x=>r2(x.val*(isLotItem(x)?BANK_CARD:0.9));
const lotNet=p=>r2(p*(1-LOT_FEE));
//@econ}
let lotsUnsub=null, myLotsUnsub=null;
DB.lots=[]; DB.myLots=[];
// открытые лоты по предметам, от дешёвых к дорогим
function lotsByItem(){ const g={}; for(const l of DB.lots||[]) if(l.status==='open') (g[l.item]=g[l.item]||[]).push(l);
  for(const k in g) g[k].sort((a,b)=>a.price-b.price||a.created-b.created); return g; }
// открытые лоты всех игроков нужны только на Маркете и в панели — подписываемся там, уходим — отписываемся (экономим чтения базы)
const LOT_PAGES=['market','admin','inventory'];
function watchOpenLots(){
  if(!FB||!me()) return;
  const need=LOT_PAGES.includes(PAGE)&&!$('#landing').classList.contains('hide');
  if(need&&!lotsUnsub) lotsUnsub=FB.db.collection('lots').where('status','==','open').limit(800).onSnapshot(s=>{
    DB.lots=s.docs.map(d=>({id:d.id,...d.data()})); DB.lotsReady=true; if(PAGE==='market'&&!$('#dlg').innerHTML) renderSite();
  },e=>{ console.error('lots',e); DB.lotsReady=true; });
  if(!need&&lotsUnsub){ lotsUnsub(); lotsUnsub=null; DB.lotsReady=false; }
}
function listenLots(){
  if(!FB||!me()) return;
  watchOpenLots();
  if(!myLotsUnsub) myLotsUnsub=FB.db.collection('lots').where('seller','==',DB.session).onSnapshot(s=>{
    DB.myLots=s.docs.map(d=>({id:d.id,...d.data()}));
    DB.myLots.filter(l=>l.status==='sold').forEach(collectLot);
    if(PAGE==='market'&&!$('#dlg').innerHTML) renderSite();
  },e=>console.error('mylots',e));
}
function stopLots(){ if(lotsUnsub){ lotsUnsub(); lotsUnsub=null; } if(myLotsUnsub){ myLotsUnsub(); myLotsUnsub=null; } DB.lots=[]; DB.myLots=[]; DB.lotsReady=false; }
// продавец: забрать деньги за проданный лот (ровно один раз — лот удаляется в транзакции)
const collecting=new Set();
async function collectLot(l){
  if(collecting.has(l.id)) return; collecting.add(l.id);
  try{
    let got=null;
    await FB.db.runTransaction(async tx=>{ const ref=FB.db.collection('lots').doc(l.id), s=await tx.get(ref);
      got=null; if(!s.exists) return; const d=s.data(); if(d.status!=='sold'||d.seller!==DB.session) return; got=d; tx.delete(ref); });
    const u=me(); if(got&&got.bank) return;
    if(got&&u){ if(!srvOn()) u.coins=r2((u.coins||0)+lotNet(got.price)); let who=""; try{ const b=await loadUser(got.buyer); who=(b&&b.name)||""; }catch(_){} addDeal(u,{k:"sell",item:got.item,price:got.price,net:lotNet(got.price),who}); saveDB(); toast(`💰 Продано: «${item(got.item).n}» за ${fmtC(got.price)} — вам ${fmtC(lotNet(got.price))}`); if(PAGE==='market'||PAGE==='inventory') renderSite(); }
  }catch(e){ console.error('collect',e); collecting.delete(l.id); }
}

const mktPrice=x=>Math.max(1,Math.ceil(x.val*MKT_MULT*2)/2);
//@econ}

DB.offIn=[]; DB.offOut=[]; let offUnsubs=[];
function listenOffers(){
  if(!FB||!me()||offUnsubs.length) return; const col=FB.db.collection('offers');
  offUnsubs=[col.where('to','==',DB.session).onSnapshot(s=>{ const before=DB.offIn.length; DB.offIn=s.docs.map(d=>({id:d.id,...d.data()})).filter(o=>o.status==='open');

    col.where('from','==',DB.session).onSnapshot(s=>{ DB.offOut=s.docs.map(d=>({id:d.id,...d.data()})); DB.offOut.filter(o=>o.status!=='open').forEach(settleOffer); if(PAGE==='market') renderSite(); },e=>console.error('offOut',e))];

const offSettling=new Set();
async function settleOffer(o){
  if(offSettling.has(o.id)) return; offSettling.add(o.id);
  try{ let got=null;
    await FB.db.runTransaction(async tx=>{ const ref=FB.db.collection('offers').doc(o.id), s=await tx.get(ref); got=null; if(!s.exists) return; const d=s.data(); if(d.from!==DB.session||d.status==='open') return; got=d; tx.delete(ref); });
    const u=me(); if(!got||!u) return;
    if(got.status==='accepted'){ if(!srvOn()) (got.get||[]).forEach(id=>addItem(u,id)); addDeal(u,{k:'trade',item:(got.get||[])[0]||(got.give||[])[0],who:got.toName||''}); toast(`🤝 ${got.toName||'Игрок'} принял обмен!`); }
    else { if(!srvOn()){ (got.give||[]).forEach(id=>addItem(u,id)); u.coins=r2((u.coins||0)+(got.coins||0)); } toast(`${got.toName||'Игрок'} отклонил обмен — предметы вернулись`); }
    saveDB();
  }catch(e){ console.error('settle',e); offSettling.delete(o.id); }
}

async function sendOffer(a,sel){
  const u=me(), coins=r2(Math.max(0,+$('#ofc').value||0));
  if(!sel.give.length&&!coins) return toast('Добавьте свои предметы или монеты');
  if(!sel.get.length) return toast('Выберите, что хотите получить');
  if(coins>(u.coins||0)) return toast('Не хватает монет');
  if(u.banned) return toast('⛔ Ваш аккаунт заблокирован');
  if(srvOn()){ const j=await apiTry('offerSend',{to:a.login,give:sel.give,get:sel.get,coins}); if(j){ closeModal(); toast('✔ Предложение отправлено — ответ придёт в «Маркет → Обмены»'); } return; }
  const back=[]; for(const id of sel.give){ if(!takeItem(u,id)){ back.forEach(i=>addItem(u,i)); return toast('Предмета уже нет в инвентаре'); } back.push(id); }
  u.coins=r2((u.coins||0)-coins);
  try{ await saveAccount(u);
    await FB.db.collection('offers').add({from:DB.session,fromName:u.name,to:a.login,toName:a.name,give:sel.give,get:sel.get,coins,status:'open',at:Date.now()});
    closeModal(); toast('✔ Предложение отправлено — ответ придёт в «Маркет → Обмены»'); }
  catch(e){ back.forEach(i=>addItem(u,i)); u.coins=r2(u.coins+coins); saveDB(); toast('Не отправилось: '+(e.code==='permission-denied'?'обмены ещё не включены':e.message||e)); }
}
async function answerOffer(id,ok){
  const u=me(), o=DB.offIn.find(x=>x.id===id); if(!u||!o) return;

    for(const i in need) if(countItem(u,i)<need[i]) return toast(`У вас нет «${item(i).n}» — обмен невозможен`);
    if(!await askConfirm(`Принять обмен от ${esc(o.fromName||'игрока')}?`,'Принять')) return; }
  if(srvOn()){ const j=await apiTry('offerAnswer',{oid:id,ok}); if(j){ if(ok){ addDeal(u,{k:'trade',item:(o.give||[])[0]||(o.get||[])[0],who:o.fromName||''}); saveDB(); toast('🤝 Обмен состоялся!'); } else toast('Предложение отклонено'); renderSite(); } return; }
  try{
    await FB.db.runTransaction(async tx=>{ const ref=FB.db.collection('offers').doc(id), s=await tx.get(ref); if(!s.exists||s.data().status!=='open') throw new Error('Предложение уже неактуально'); tx.update(ref,{status:ok?'accepted':'declined',doneAt:Date.now()}); });
    if(ok){ (o.get||[]).forEach(i=>takeItem(u,i)); (o.give||[]).forEach(i=>addItem(u,i)); u.coins=r2((u.coins||0)+(o.coins||0)); addDeal(u,{k:'trade',item:(o.give||[])[0]||(o.get||[])[0],who:o.fromName||''}); await saveAccount(u); toast('🤝 Обмен состоялся!'); }

}

// ====== ЗАЯВКИ НА ПОКУПКУ (коллекция orders): покупатель заранее отдаёт монеты, продавец продаёт по заявке ======
let ordersUnsub=null, myOrdersUnsub=null; DB.orders=[]; DB.myOrders=[];
function watchOrders(){
  if(!FB||!me()) return;
  const need=['market','inventory'].includes(PAGE)&&!$('#landing').classList.contains('hide');
  if(need&&!ordersUnsub) ordersUnsub=FB.db.collection('orders').where('status','==','open').limit(300).onSnapshot(s=>{ DB.orders=s.docs.map(d=>({id:d.id,...d.data()})); if(PAGE==='market'&&!$('#dlg').innerHTML) renderSite(); },e=>console.error('orders',e));
  if(!need&&ordersUnsub){ ordersUnsub(); ordersUnsub=null; }
  if(!myOrdersUnsub) myOrdersUnsub=FB.db.collection('orders').where('buyer','==',DB.session).onSnapshot(s=>{ DB.myOrders=s.docs.map(d=>({id:d.id,...d.data()})); DB.myOrders.filter(o=>o.status==='filled').forEach(collectOrder); if(PAGE==='market') renderSite(); },e=>console.error('myorders',e));
}
const bestOrder=id=>(DB.orders||[]).filter(o=>o.item===id&&o.status==='open'&&o.buyer!==DB.session).sort((a,b)=>b.price-a.price||a.at-b.at)[0];
async function placeOrder(id){
  const u=me(), x=item(id); if(!u||!FB||!isLotItem(x)) return;
  if((DB.myOrders||[]).filter(o=>o.status==='open').length>=10) return toast('Не больше 10 заявок одновременно');
  const L=lotsByItem()[id], b=bestOrder(id);
  const v=await askText(`📝 Заявка на «${esc(x.n)}»`,String(b?r2(b.price+0.5):r2(x.val)),{num:1,ok:'Оставить заявку',
    note:`Монеты сразу отложатся. Кто-то продаст по вашей цене — предмет придёт сам. ${L?`Сейчас продают от ${fmtC(L[0].price)}.`:'Сейчас никто не продаёт.'}${b?` Лучшая заявка: ${fmtC(b.price)}.`:''}`});
  if(v===null||v===undefined||v==='') return;
  const price=r2(parseFloat(String(v).replace(',','.')));
  if(!(price>=0.01&&price<=LOT_PRICE_MAX)) return toast(`Цена — от 🪙 0.01 до 🪙 ${LOT_PRICE_MAX}`);
  if(price>(u.coins||0)) return toast('Не хватает монет');
  if(L&&L[0].price<=price&&L[0].seller!==DB.session&&await askConfirm(`«${esc(x.n)}» уже продают за ${fmtC(L[0].price)} — дешевле вашей цены. Купить сразу?`,'Купить')) return buyLot(L[0].id);
  if(srvOn()){ const j=await apiTry('orderPlace',{id,price}); if(j) toast(`✔ Заявка оставлена: «${x.n}» за ${fmtC(price)}`); renderSite(); return; }
  u.coins=r2(u.coins-price);
  try{ await saveAccount(u); await FB.db.collection('orders').add({buyer:DB.session,buyerName:u.name,item:id,price,status:'open',at:Date.now()}); toast(`✔ Заявка оставлена: «${x.n}» за ${fmtC(price)}`); }
  catch(e){ u.coins=r2(u.coins+price); saveDB(); toast('Не удалось: '+(e.code==='permission-denied'?'заявки ещё не включены':e.message||e)); }

function fireworks(ms=3500){
  if(document.getElementById('fwc')) return;
  const c=document.createElement('canvas'); c.id='fwc'; c.width=innerWidth; c.height=innerHeight; document.body.appendChild(c);
  const x=c.getContext('2d'), parts=[], cols=['#ff4d6d','#ffd166','#06d6a0','#4cc9f0','#f72585','#ffffff'], end=Date.now()+ms;
  const boom=()=>{ const cx=innerWidth*(.15+Math.random()*.7), cy=innerHeight*(.15+Math.random()*.35), col=cols[Math.random()*cols.length|0];
    for(let k=0;k<46;k++){ const a=Math.PI*2*k/46, s=2+Math.random()*3.5; parts.push({x:cx,y:cy,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:60+Math.random()*25,col}); } if(SND.on) beep(180+Math.random()*80,0.12,'triangle',0.04); };
  let t=0; const step=()=>{ x.clearRect(0,0,c.width,c.height); if(Date.now()<end&&t++%14===0) boom();
    for(const p of parts){ p.x+=p.vx; p.y+=p.vy; p.vy+=0.05; p.vx*=0.985; p.l--; x.globalAlpha=Math.max(0,p.l/80); x.fillStyle=p.col; x.beginPath(); x.arc(p.x,p.y,2.2,0,7); x.fill(); }
    for(let i=parts.length-1;i>=0;i--) if(parts[i].l<=0) parts.splice(i,1);
    if(Date.now()<end||parts.length) requestAnimationFrame(step); else c.remove(); };
  step();
}

  return `<div class="cardw"><div class="ch"><h3>📊 Статистика</h3><button class="sm sec" data-act="statsReload">↻</button></div>
    <div class="gst" style="grid-template-columns:repeat(3,1fr)"><div><b>${s.today??'—'}</b><span>заходили сегодня</span></div><div><b>${s.week??'—'}</b><span>за 7 дней</span></div><div><b>${s.newWeek??'—'}</b><span>новых за 7 дней</span></div></div>
    ${D.length?`<div class="gst" style="grid-template-columns:repeat(4,1fr)"><div><b>${t.matches||0}</b><span>матчей сегодня</span></div><div><b>${sum('matches')}</b><span>матчей за 7 дней</span></div><div><b>${sum('sales')}</b><span>продаж на Маркете (7 дн.)</span></div><div><b>${sum('prem',14)}</b><span>премиумов за 14 дн. · ${sum('stars',14)} ⭐</span></div></div>
    <table class="gtab"><tr><th>День</th><th>Матчи*</th><th>Продажи</th><th>Монеты</th><th>Кейсы</th><th>Промо</th><th>Премиум</th></tr>${D.map(d=>`<tr><td>${d.d.slice(5)}</td><td>${d.matches||0}</td><td>${d.sales||0}</td><td>${r2(d.salesCoins||0)}</td><td>${d.opens||0}</td><td>${d.promos||0}</td><td>${d.prem||0}</td></tr>`).join('')}</table>
    <p class="muted" style="font-size:12px">* матчи считаются по игрокам: партия на 4 человек = 4. Счётчики идут с момента обновления сервера.</p>`:'<p class="muted">Подробные счётчики появятся после обновления сервера.</p>'}</div>`; }

// ====== ЛЕНТА ДРУЗЕЙ: заметные события (редкие предметы, победы в турнирах) ======
function feedPost(text){ const u=me(); if(!u||!FB) return; FB.db.collection('feed').add({uid:DB.session,name:u.name,color:u.color||'#3b8fd6',text:String(text).slice(0,120),at:Date.now()}).catch(()=>{}); }
async function loadFeed(){ const u=me(); if(!u||!FB) return; const fr=(u.friends||[]).slice(0,30); if(!fr.length){ DB.feed=[]; return; }
  try{ const s=await FB.db.collection('feed').where('uid','in',fr).orderBy('at','desc').limit(20).get(); DB.feed=s.docs.map(d=>d.data()); if(PAGE==='friends') renderSite(); }
  catch(e){ try{ const s=await FB.db.collection('feed').where('uid','in',fr).limit(40).get(); DB.feed=s.docs.map(d=>d.data()).sort((a,b)=>b.at-a.at).slice(0,20); if(PAGE==='friends') renderSite(); }catch(e2){ console.error('feed',e2); } } }
function feedHTML(){ const L=DB.feed||[];
  return `<div class="cardw"><h3>📰 Лента друзей</h3>${L.length?L.map(f=>`<div class="top"><span class="n"><b style="color:${esc(f.color)};cursor:pointer" data-uprof="${esc(f.uid)}">${esc(f.name)}</b> <span data-notr>${esc(f.text)}</span></span><span class="muted" style="font-size:11px">${agoText(f.at)}</span></div>`).join('')
    :'<p class="muted">Здесь появятся успехи друзей: редкие предметы, победы в турнирах.</p>'}</div>`; }
// что попадает в ленту: предмет эпический и выше
const feedDrop=(id,how)=>{ const x=item(id); if(x&&x.r>=2) feedPost(`${how} ${x.ic} ${x.n} (${RAR[x.r][0].toLowerCase()})`); };

// ====== СЧАСТЛИВЫЙ ЧАС: двойной опыт за матчи в выбранный день и часы (по Москве) ======
const happyCfg=()=>DB.happy||null;
const happyOn=()=>{ const h=happyCfg(); if(!h||!h.on) return false; const m=mskNow(); return (h.day===7||m.getDay()===h.day)&&m.getHours()>=h.from&&m.getHours()<h.to; };
const DAYS_RU=['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота','каждый день'];
function happyBanner(){ const h=happyCfg(); if(!h||!h.on) return ''; const on=happyOn();
  return `<div class="cardw" style="background:linear-gradient(120deg,#fff6d6,#ffe1f1)!important"><b>⏰ Счастливый час</b> — ${on?'<b style="color:#e53935">сейчас двойной опыт за матчи! 🎉</b>':`двойной опыт за матчи: ${DAYS_RU[h.day]}, ${h.from}:00–${h.to}:00 (мск).`}</div>`; }
function happyAdminHTML(){ const h=happyCfg()||{on:false,day:6,from:18,to:20};
  return `<div class="admrow"><b style="width:auto">⏰ Счастливый час:</b><select class="inp" id="hhDay" style="width:150px">${DAYS_RU.map((d,i)=>`<option value="${i}" ${h.day===i?'selected':''}>${d}</option>`).join('')}</select>
    с <input class="inp" id="hhFrom" type="number" min="0" max="23" value="${h.from}" style="width:60px"> до <input class="inp" id="hhTo" type="number" min="1" max="24" value="${h.to}" style="width:60px">
    <button class="sm ${h.on?'red':'btn-o'}" data-act="happySave" data-on="${h.on?0:1}">${h.on?'Выключить':'Включить'}</button><span class="muted">${h.on?'✅ включён':'выключен'}</span></div>`; }
async function happySave(on){ const h={on:!!on,day:+$('#hhDay').value,from:+$('#hhFrom').value,to:+$('#hhTo').value};
  if(h.to<=h.from) return toast('Конец должен быть позже начала');
  try{ await FB.db.collection('config').doc('site').set({happy:h},{merge:true}); DB.happy=h; toast(h.on?'⏰ Счастливый час включён':'Счастливый час выключен'); renderSite(); }catch(e){ toast('Ошибка: '+(e.message||e)); } }
// ====== ТЕЛЕФОН ======
// на узком экране (телефон вертикально) журнал переезжает под поле, где есть место
const narrowMQ=window.matchMedia('(max-width:820px)'), landMQ=window.matchMedia('(max-height:520px) and (orientation:landscape)');
// журнал всегда внутри поля (на телефоне игроки слева, поле справа — как на компьютере)
function placeLog(){ const log=$('#log'), target=$('#center'); if(log&&target&&log.parentNode!==target) target.appendChild(log); }
[narrowMQ,landMQ].forEach(m=>m.addEventListener?m.addEventListener('change',placeLog):m.addListener(placeLog));
placeLog();
// кнопка «на весь экран» (на iPhone браузер её может не поддерживать — тогда кнопка скрыта)
const fsOK=!!(document.documentElement.requestFullscreen||document.documentElement.webkitRequestFullscreen);
if(!fsOK) $('#fsBtn').style.display='none';
$('#fsBtn').onclick=()=>{
  const d=document, el=d.documentElement;
  if(d.fullscreenElement||d.webkitFullscreenElement) (d.exitFullscreen||d.webkitExitFullscreen).call(d);
  else (el.requestFullscreen||el.webkitRequestFullscreen).call(el).catch?.(()=>{});
};
buildBoard();
showLanding();
</script>
