// ====== ИГРА ПО СЕТИ ======
const ACT_EXTRA={}; // действия лобби — подключаются к ACT ниже
// Комната (rooms/{id}): хозяин ведёт партию у себя и публикует её состояние (поле state),
// гости показывают это состояние и отправляют свои действия в rooms/{id}/actions.
const NET={rid:null,room:null,role:null,started:false,unsub:null,unsubAct:null,seen:new Set(),pubT:null,rev:0,resolvers:{},handledAsk:null,startedAt:0,endShown:false,spec:false};
const isRemote=p=>!!(NET.role==='host'&&G&&G.online&&p&&!p.bot&&p.uid&&p.uid!==DB.session);
const roomRef=id=>FB.db.collection('rooms').doc(id||NET.rid);
function netPublish(){ if(NET.role!=='host'||!G||!G.online||NET.pubT) return; NET.pubT=setTimeout(netPublishNow,700); }
function netPublishNow(){
  clearTimeout(NET.pubT); NET.pubT=null;
  if(NET.role!=='host'||!G||!G.online||!FB) return;
  const snap={...G,log:G.log.slice(-80),awaiting:!!pending,askData:askData||null};
  NET.rev++;
  roomRef(G.rid).update({state:JSON.stringify(snap),rev:NET.rev,status:G.over?'over':'playing',hostSeen:Date.now()}).catch(e=>console.error('publish',e));
}
function netSend(o){ if(!FB||!NET.rid) return; roomRef().collection('actions').add({...o,uid:DB.session,at:Date.now()}).catch(e=>toast('Не отправилось: '+(e.message||e))); }
// спросить игрока на другом компьютере; если не ответит за 40 сек — ответ по умолчанию
function askRemote(p,kind,data,def){
  if(!G||G.over) return new Promise(()=>{});
  const id=Math.random().toString(36).slice(2,10);
  G.remoteAsk={id,pid:p.id,kind,data}; netPublishNow();
  return new Promise(res=>{
    const done=v=>{ if(!NET.resolvers[id]) return; delete NET.resolvers[id]; if(G&&G.remoteAsk&&G.remoteAsk.id===id) G.remoteAsk=null; res(v); };
    NET.resolvers[id]=done; setTimeout(()=>done(def),40000);
  });
}
// хозяин: обработка действий гостей
function listenActions(){
  if(NET.unsubAct) NET.unsubAct();
  NET.startedAt=Date.now();
  NET.unsubAct=roomRef().collection('actions').onSnapshot(s=>s.docChanges().forEach(ch=>{
    if(ch.type!=='added'||NET.seen.has(ch.doc.id)) return; NET.seen.add(ch.doc.id);
    const a=ch.doc.data(); if((a.at||0)<NET.startedAt-3000) return; // старые действия (до перезагрузки) пропускаем
    try{ hostHandleAction(a); }catch(e){ console.error(e); }
  }));
}
function hostHandleAction(a){
  if(!G||G.over) return;
  const p=G.players.find(x=>x.uid===a.uid);
  if(a.kind==='chat'){ gameChatLog(p,a.name,a.text); return; }
  if(!p) return;
  p.afk=0; // игрок на связи
  if(a.kind==='answer'){ if(pending&&actor()===p&&G.phase===a.phase) answer(a.v); return; }
  if(a.kind==='reply'){ const r=NET.resolvers[a.askId]; if(r&&G.remoteAsk&&G.remoteAsk.id===a.askId&&G.remoteAsk.pid===p.id) r(a.v); return; }
  if(a.kind!=='cmd') return;
  const myTurn=pending&&actor()===p;
  if(a.name==='surrender') return doSurrender(p);
  if(!myTurn) return;
  if(a.name==='credit') takeCredit(p);
  if(a.name==='repay') repayCredit(p);
  if(a.name==='cell'&&['roll','end','debt','jail','buy'].includes(G.phase)&&G.cells[a.i]) { cellAction(p,+a.i,a.m); render(); }
  if(a.name==='trade'&&a.t&&a.t.from===p.id) proposeTrade(a.t);
}
// гость: ответить на вопрос хозяина (аукцион, казино, обмен)
async function handleRemoteAsk(ra){
  const p=G.players[ra.pid]; let v=null;
  if(ra.kind==='bid'){ const d=ra.data; v=await askBidUI(p,d.i,d.next,d.leader!=null?G.players[d.leader]:null,d.cur); }
  if(ra.kind==='casino') v=await casinoModalUI(p);
  if(ra.kind==='trade') v=await confirmTradeUI(ra.data.t);
  netSend({kind:'reply',askId:ra.id,v:v===undefined?null:v});
}
// подписаться на свою комнату
function watchRoom(rid){
  if(NET.rid===rid&&NET.unsub) return;
  leaveNet(false);
  NET.rid=rid;
  NET.unsub=roomRef(rid).onSnapshot(s=>{
    if(!s.exists){ const was=NET.started; leaveNet(false); if(was){ toast('Комната закрыта'); showLanding(); } else renderSite(); return; }
    const r={id:s.id,...s.data()}; NET.room=r;
    if(r.status==='waiting'){ if(PAGE==='games') renderSite(); return; }
    if(r.host===DB.session){ if(!NET.started||NET.role!=='host') resumeHost(r); return; }
    if(NET.role==='host'){ // ведение партии забрал другой игрок (нас долго не было) — становимся обычным игроком
      gameId++; pending=null; stopTimer(); if(NET.unsubAct){ NET.unsubAct(); NET.unsubAct=null; } NET.role='guest'; toast('Партию теперь ведёт другой игрок'); }
    applyGuestState(r);
  },e=>{ console.error('room',e); if(NET.spec){ toast('Не удалось открыть игру для просмотра'); leaveNet(false); showLanding(); } });
}
function leaveNet(forget){
  if(TR) closeTrade();
  if(NET.unsub) NET.unsub(); if(NET.unsubAct) NET.unsubAct(); if(reactUnsub){ reactUnsub(); reactUnsub=null; }
  clearTimeout(NET.pubT);
  const wasHost=NET.role==='host', rid=NET.rid;
  Object.assign(NET,{rid:null,room:null,role:null,started:false,unsub:null,unsubAct:null,pubT:null,resolvers:{},handledAsk:null,endShown:false,spec:false});
  if(G&&G.online){ gameId++; stopTimer(); pending=null; G=null; }
  // хозяин после конца игры удаляет комнату (гости уже получили итог)
  if(forget&&wasHost&&rid&&FB) roomRef(rid).delete().catch(()=>{});
}
// хозяин: запуск или продолжение партии (например, после перезагрузки страницы)
function resumeHost(r){
  if(!r.state){ return; }
  gameId++; pending=null; stopTimer();
  G=JSON.parse(r.state); applyLayout(G.layout);
  G.phase='wait'; G.awaiting=false; G.remoteAsk=null; G.askData=null;
  NET.role='host'; NET.started=true; NET.rev=r.rev||0;
  listenActions(); listenReacts(); closeModal(); hideLanding(); renderLog(); render();
  if(G.over){ showWinner(G.players[G.winner],applyMyResult()); return; }
  log(r.takenBy===DB.session&&r.takenAt&&Date.now()-r.takenAt<60000?`🔄 Создатель комнаты пропал — партию теперь ведёт ${pn(G.players.find(p=>p.uid===DB.session)||{name:'игрок',color:'#fff'})}`:'🔄 Ведущий вернулся — продолжаем'); playTurn();
}
// гость: показать состояние партии от хозяина
function applyGuestState(r){
  if(!r.state) return;
  const ng=JSON.parse(r.state);
  const first=!NET.started;
  NET.role='guest'; NET.started=true;
  if(first||!G||JSON.stringify(ng.layout||null)!==JSON.stringify(G.layout||null)) applyLayout(ng.layout);
  G=ng; pending=null;
  if(first){ closeModal(); hideLanding(); listenReacts(); if(NET.spec) toast('👁 Вы смотрите игру как зритель'); }
  renderLog(); render();
  const ra=G.remoteAsk;
  if(ra&&G.players[ra.pid]&&G.players[ra.pid].uid===DB.session&&NET.handledAsk!==ra.id){ NET.handledAsk=ra.id; handleRemoteAsk(ra); }
  if(G.over&&!NET.endShown){ NET.endShown=true; saveMatchLog(); showWinner(G.players[G.winner],applyMyResult()); }
  if(G.over) updateRematch();
}
// хозяин: начать партию в комнате
function startOnlineGame(r){
  pending=null; gameId++; stopTimer();
  const mode=MODES[r.mode]||MODES.classic;
  const layout=mode.shuffle?shuffleLayout():null;
  applyLayout(layout);
  const list=[...r.players.map(pl=>({...pl,bot:false}))];
  G={mode:r.mode,layout,round:1,online:true,rid:r.id,opt:{...r.opt,timer:90},
     players:list.map((pl,k)=>({id:k,name:pl.name,bot:!!pl.bot,uid:pl.uid||null,acc:pl.uid===DB.session?DB.session:null,skin:pl.skin||'',vip:!!pl.vip,bonus:pl.bonus||{},
       color:COLORS[k],money:mode.money||START_MONEY,pos:0,inJail:false,jailTries:0,jailCards:0,dbl:0,out:false})),
     cells:CELLS.map(()=>({owner:-1,level:0,mort:false})),cur:0,phase:'wait',debt:null,log:[],lastDice:7,over:false,turnNo:0,declined:{}};
  NET.role='host'; NET.started=true; NET.rev=0;
  listenActions(); listenReacts(); closeModal(); hideLanding(); renderLog();
  log(`🌐 Игра по сети началась! Режим: ${mode.ic} ${mode.n}. Удачи!`);
  if(mode.deal){ const own=CELLS.map((c,i)=>i).filter(i=>isOwnable(CELLS[i])).sort(()=>Math.random()-0.5); own.forEach((i,k)=>G.cells[i].owner=k%G.players.length); log('🃏 Все компании розданы игрокам!'); }
  netPublishNow();
  playTurn();
}

async function rejoinMyRoom(){

async function joinRoom(rid){
  if(me()&&me().banned) return toast('⛔ Ваш аккаунт заблокирован');
  try{
    await FB.db.runTransaction(async tx=>{
      const ref=roomRef(rid), s=await tx.get(ref); if(!s.exists) throw new Error('Комната уже закрыта');
      const r=s.data(); if(r.status!=='waiting') throw new Error('Игра уже началась');
      if(r.uids.includes(DB.session)) return;
      if(r.players.length+(r.bots||0)>=r.max) throw new Error('Мест нет');
      if(MODES[r.mode]&&MODES[r.mode].ranked&&levelInfo(me().xp).lvl<MODES.ranked.needLvl) throw new Error(`Рейтинговая игра — с ${MODES.ranked.needLvl} уровня`);
      tx.update(ref,{players:[...r.players,myEntry()],uids:[...r.uids,DB.session]});
    });
    watchRoom(rid); toast('✔ Вы в комнате — ждём начала игры');
  }catch(e){ toast(e.code==='permission-denied'?'Эта игра только для друзей создателя':(e.message||String(e))); }
}
async function leaveRoom(rid){
  try{
    await FB.db.runTransaction(async tx=>{
      const ref=roomRef(rid), s=await tx.get(ref); if(!s.exists) return; const r=s.data();
      tx.update(ref,{players:r.players.filter(p=>p.uid!==DB.session),uids:r.uids.filter(x=>x!==DB.session)});
    });
  }catch(e){ toast('Ошибка: '+(e.message||e)); }
  leaveNet(false); renderSite();
}

        <div class="bar" style="margin-top:6px"><i style="width:${li.cur/li.need*100}%"></i></div><div class="muted">${li.need-li.cur} XP до ур. ${li.lvl+1}</div></div></div>
        <div style="display:flex;justify-content:space-between;margin-top:12px;font-size:14px"><span>🏆 Рейтинг: <b>${li.lvl>=10?(u.rating||1000):'с 10 ур.'}</b>${li.lvl>=10?' <a data-act="rankedRoom" style="color:#3b8fd6;cursor:pointer;margin-left:6px">▶ Рейтинговая игра</a>':''}</span><span>${isVip(u)?`<span class="vipb">VIP</span> ещё ${vipLeft(u)}`:'<a data-act="mtabgo" data-t="vip" style="color:#ff8a3d;cursor:pointer">👑 Купить VIP</a>'}</span></div></div>
      <div class="cardw"><div class="ch"><h3>Задания</h3><span class="muted">⏱ обновятся через ${timeLeft()}</span></div>
        ${ts.list.map(t=>{ const d=TASK_POOL.find(x=>x.id===t.id); return `<div class="task ${t.done?'done':''}"><div class="tn">${d.t}</div>
          <div class="tp">${d.money?fmt(t.prog)+' / '+fmt(d.goal):t.prog+' / '+d.goal}${t.done?' ✅':''}</div><div class="bar"><i style="width:${t.prog/d.goal*100}%"></i></div>
          <div class="tr">✔ ${d.xp} XP</div></div>`; }).join('')}</div>
      <div class="cardw"><div class="ch"><h3>🗓 Сезон «${seasonName(seasonKey())}»</h3><span class="muted">ещё ${seasonDaysLeft()} дн.</span></div>
        <p class="muted" style="margin-top:-6px">Победа +3 очка, сыгранный матч +1. Места 1–3 в конце месяца получают значок в профиль и опыт (🥇 +500, 🥈 +300, 🥉 +150 XP). Ваши очки: <b>${u[seasonKey()]||0}</b></p>
        ${(DB.season||[]).length?DB.season.map((a,k)=>`<div class="top" data-uprof="${esc(a.login)}" style="cursor:pointer"><span class="pos">${k<3?SEASON_PRIZE[k][0]:k+1}</span>${avc(a,28)}<span class="n">${esc(a.name)}${a.login===u.login?' <span class="muted">(вы)</span>':''}</span><b>${a[seasonKey()]} очк.</b></div>`).join(''):'<p class="muted">В этом сезоне ещё нет очков — сыграйте матч!</p>'}</div>
      ${FB?weekendHTML(u):""}
      ${logsHTML()}
      <div class="cardw"><div class="ch"><h3>Топ игроков</h3></div>
        ${top.length?top.map((a,k)=>`<div class="top" data-uprof="${esc(a.login)}" style="cursor:pointer"><span class="pos">${k+1}</span>${avc(a,32)}<span class="n">${esc(a.name)}${a.login===u.login?' <span class="muted">(вы)</span>':''}</span><span class="muted">🏆 ${a.rating||1000} · ур. ${levelInfo(a.xp).lvl}</span></div>`).join(''):'<p class="muted">Загрузка…</p>'}</div>
    </div><div>
      ${FB?friendsOnlineHTML(u):""}
      ${FB?gchatHTML():""}
      ${lobbyHTML(u)}
      <div class="cardw banner"><div style="flex:1"><h3>👑 VIP-статус</h3><p>Открывает все режимы игры и даёт дроп с шансом 100% в рейтинговых матчах. 7 дней — 🪙 25, 30 дней — 🪙 100.</p>
        <button class="btn-o" data-act="mtabgo" data-t="vip">${isVip(u)?'Продлить VIP':'Купить VIP'}</button></div><div class="tick">🎟️</div></div>
      ${gameActive()?`<div class="cardw ch" style="margin-bottom:22px"><div><h3>${NET.spec?'👁 Вы смотрите партию':'Идёт партия'}</h3><span class="muted">${M().ic} ${M().n}</span></div><div><button data-act="back">${NET.spec?'Смотреть дальше':'Вернуться в игру'}</button>${NET.spec?'<button class="sec" data-act="stopWatch">Выйти</button>':''}</div></div>`:''}
    </div></div>`;
  },

  friends:()=>{
    const u=me(), fr=(u.friends||[]).map(l=>DB.accounts[l]).filter(Boolean);
    const fans=(DB.fans||[]).filter(a=>!(u.friends||[]).includes(a.login));
    const fcard=(a,btn)=>{ const li=levelInfo(a.xp); return `<div class="fitem">${avc(a,80)}<div><div class="fn">${esc(a.name)}</div>
      <div class="muted">@${esc(a.nick||'')} · ${rankOf(li.lvl)[2]} ${rankOf(li.lvl)[1]} · ур. ${li.lvl} · побед ${a.wins} из ${a.matches}</div>${btn}</div></div>`; };
    return `<div class="page"><div class="cardw">
      <div class="crumbs">${avc(u,48)}<a data-go="profile">${esc(u.name)}</a><span class="gt">›</span>Друзья<span class="cnt">${fr.length}</span></div>
      <p class="muted">Ваш ник: <b>@${esc(u.nick||'')}</b> — скажите его друзьям, чтобы они вас добавили.</p>
      <div class="addf"><input class="inp" id="fLogin" data-enter="addf" placeholder="Ник друга"><button data-act="addf">Добавить</button></div><div class="err" id="fErr"></div>
      ${fr.length?`<div class="flist" style="margin-top:14px">${fr.map(a=>fcard(a,`<button class="sm" data-act="dmTo" data-u="${esc(a.login)}">✉️ Написать</button><button class="sec sm" data-uprof="${esc(a.login)}">Профиль</button><button class="sec sm" data-act="delf" data-l="${esc(a.login)}">Удалить</button>`)).join('')}</div>`:
        `<div class="empty"><div class="e">👥</div><h3>У вас пока нет друзей</h3><p class="muted">Добавьте друга по нику. Друзья могут заходить в ваши игры с пометкой «Только для друзей».</p></div>`}
      </div>
      ${fr.length?(()=>{ const wk=weekKey(), w=a=>a.wk&&a.wk.id===wk?a.wk:{w:0,m:0};
        const list=[u,...fr].sort((a,b)=>w(b).w-w(a).w||w(b).m-w(a).m);
        return `<div class="cardw"><div class="ch"><h3>🏆 Неделя среди друзей</h3><span class="muted">с понедельника</span></div>
          ${list.map((a,k)=>`<div class="top"><span class="pos">${k===0&&w(a).w?'👑':k+1}</span>${avc(a,32)}<span class="n">${esc(a.name)}${a.login===u.login?' <span class="muted">(вы)</span>':''}</span><span><b>${w(a).w}</b> <span class="muted">побед · ${w(a).m} матчей</span></span></div>`).join('')}</div>`; })():''}
      ${fans.length?`<div class="cardw"><div class="ch"><h3>Добавили вас в друзья</h3></div><div class="flist">${fans.map(a=>fcard(a,`<button class="sm" data-act="addfl" data-l="${esc(a.nick||'')}">+ Добавить в ответ</button>`)).join('')}</div></div>`:''}
    </div>`;
  },

  inventory:()=>{
    const u=me(), groups={};
    (u.items||[]).forEach(x=>(groups[x.id]=groups[x.id]||[]).push(x.uid));
    const ids=['tok_default',...Object.keys(groups).sort((a,b)=>item(b).val-item(a).val)];
    const keys=(groups.key||[]).length;
    return `<div class="page"><div class="crumbs">${avc(u,48)}<a data-go="profile">${esc(u.name)}</a><span class="gt">›</span>Инвентарь<span class="cnt">${(u.items||[]).length}</span></div>
      ${(u.items||[]).some(x=>item(x.id).type==='card')?`<div class="cardw" style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 18px">
        <span style="flex:1;min-width:220px">📌 Надето карточек: <b>${Object.keys(cleanSlots(u)).length}</b>. Бонус к аренде дают только карточки, надетые на компании.</span>
        <button class="btn-o" data-act="autoEquip">⚡ Надеть лучшие автоматически</button>
        <div style="width:100%;font-size:13px;line-height:1.9">🏅 <b>Полные коллекции</b> — карточки на всех компаниях коллекции дают каждой ещё <b>+${SET_BONUS}%</b>:<br>
          ${setProgress(u).map(x=>`<span style="white-space:nowrap;margin-right:12px;${x.on===x.all?'color:#2e9e5b;font-weight:700':''}">${COLLECTIONS[x.k].ic} ${COLLECTIONS[x.k].n} ${x.on}/${x.all}${x.on===x.all?' ✔':''}</span>`).join('')}</div></div>`:''}
      <div style="display:flex;gap:12px;margin-bottom:20px"><input class="inp" id="invQ" placeholder="Поиск предметов…" oninput="filterInv()">
        <select class="inp" id="invR" style="width:220px" onchange="filterInv()"><option value="">Все предметы</option>${Object.entries(TYPE_N).map(([k,n])=>`<option value="${k}">${n}</option>`).join('')}</select></div>
      <div class="tgrid">${ids.map(id=>{ const x=item(id), n=id==='tok_default'?1:groups[id].length;
        let btn='';
        if(x.type==='token') btn=u.eq===id?'<button class="sec sm" disabled>✓ Надето</button>':`<button class="sm" data-act="equip" data-i="${id}">Надеть</button>`;
        if(x.type==='case') btn=`<button class="sm btn-o" data-act="open" data-i="${id}" ${keys?'':'disabled title="Нужен ключ 🔑"'}>Открыть 🔑</button>`;
        if(x.type==='set') btn=`<button class="sm btn-o" data-act="open" data-i="${id}">Открыть</button>`;
        if(x.pool) btn+=`<button class="sm sec" data-act="peek" data-i="${id}">👁 Что внутри</button>`;
        if(x.type==='card') btn+=`<button class="sm" data-act="slotCard" data-i="${id}">📌 Надеть на компанию</button>`;
        if(x.type==='card'&&upgradeInfo(x)) btn+=`<button class="sm btn-o" data-act="upgrade" data-i="${id}" ${n>=UPGRADE_N?'':`disabled title="Нужно ${UPGRADE_N} одинаковые карточки"`}>⬆ Улучшить (${Math.min(n,UPGRADE_N)}/${UPGRADE_N})</button>`;
        if(isLotItem(x)) btn+=`<button class="sm btn-o" data-act="listLot" data-i="${id}">💰 Выставить на Маркет</button><button class="sm sec" data-act="sell" data-i="${id}">Банку ${fmtC(bankPrice(x))}</button>`;
        else if(x.val) btn+=`<button class="sm sec" data-act="sell" data-i="${id}">Продать ${fmtC(bankPrice(x))}</button>`;
        return `<div class="tile ${u.eq===id?'eq':''}" data-n="${esc(x.n.toLowerCase())}" data-t="${x.type}" title="${esc(x.desc||'')}">${n>1?`<span class="cntb" style="z-index:2">×${n}</span>`:''}
          <div class="tart">${id==='tok_default'?`<div class="art" style="width:180px;height:150px">${avc({...u,eq:'tok_default'},90)}</div>`:itemArt(x,180,150)}</div>
          <div class="tname" style="background:linear-gradient(120deg,${RAR_GRAD[x.r]})">${esc(x.n)}</div>
          <div class="tinfo"><span style="color:${RAR[x.r][1]};font-weight:600">${RAR[x.r][0]}</span> · ${TYPE_N[x.type]} · ${x.val?fmtC(x.val):'не продаётся'}
            ${x.type==='card'?`<div style="color:#e68a00;font-weight:600;margin-top:3px">${COLLECTIONS[x.coll].ic} ${COLLECTIONS[x.coll].n} · +${x.bonus}% к аренде</div>
              ${(()=>{ const on=slotsOf(u,id); return on.length?`<div style="color:#2e9e5b;font-weight:600;margin-top:3px">📌 Надета: ${on.map(k=>esc(BASE_CELLS[k].name)).join(', ')}</div>`
                :'<div class="muted" style="margin-top:3px">Не надета — бонус не действует</div>'; })()}`:''}
            <div style="margin-top:4px">${btn}</div></div></div>`; }).join('')}</div>
      ${!(u.items||[]).length?`<div class="empty"><div class="e">📦</div><h3>Ваш инвентарь пуст</h3><p class="muted">Предметы выпадают после матчей. Их также можно купить на <a style="color:#3b8fd6;cursor:pointer" data-go="market">Маркете</a>.</p></div>`:''}
    </div>`;
  },

  market:()=>{
    const u=me();
    const tab=(t,n)=>`<button class="${marketTab===t?'':'sec'}" data-act="mtab" data-t="${t}">${n}</button>`;
    const typeOrder={key:0,case:1,set:2,card:3,token:4};
    let body='';
    if(marketTab==='buy'){
      const cat=(t,n)=>`<button class="sm ${marketCat===t?'':'sec'}" data-act="mcat" data-t="${t}">${n}</button>`;
      const shown=ITEMS.filter(x=>x.val&&(marketCat==='boxes'?['case','set','key'].includes(x.type):marketCat==='cards'?x.type==='card'&&(!marketColl||x.coll===marketColl):x.type==='token'));
      const lots=lotsByItem();
      // карточки, кейсы и наборы продают только игроки: самая дешёвая цена и сколько лотов; нет лотов — «нет в наличии»
      const lotRow=x=>{ const L=lots[x.id]||[], best=L[0], mine=best&&best.seller===DB.session;
        return `<div class="mrow">${itemArt(x,110,80)}
        <div class="mn2">${x.n}<br><span class="rtag" style="background:${RAR[x.r][1]}">${RAR[x.r][0]}</span> ${x.type==='card'?`<span class="muted" style="font-size:13px">${COLLECTIONS[x.coll].ic} ${COLLECTIONS[x.coll].n} · <b style="color:#e68a00">+${x.bonus}% к аренде</b></span>`
            :`<span class="rtag" style="background:#ffb627;color:#3a2a00">${TYPE_N[x.type]}${x.type==='case'?' · нужен 🔑':''}</span> <a data-act="peek" data-i="${x.id}" style="color:#3b8fd6;cursor:pointer;font-size:14px">👁 что внутри</a>`}
          <br><span class="muted" style="font-size:12px">${L.length?`Лотов: ${L.length}${L.length>1?` · до ${fmtC(L[L.length-1].price)}`:''} · продавец: ${esc(best.sellerName||'игрок')}`:'Пока никто не продаёт'}</span></div>
        <div class="mp">${best?fmtC(best.price):'—'}</div>${best?`<button data-act="buyLot" data-l="${best.id}" style="width:110px" ${mine?'disabled title="Это ваш лот"':u.coins<best.price?'disabled title="Не хватает монет"':''}>${mine?'ВАШ ЛОТ':'КУПИТЬ'}</button>`
          :'<button class="sec" style="width:110px" disabled>НЕТ В НАЛИЧИИ</button>'}</div>`; };
      const shopRow=x=>`<div class="mrow">${itemArt(x,110,80)}
        <div class="mn2">${x.n}<br><span class="rtag" style="background:${RAR[x.r][1]}">${RAR[x.r][0]}</span> <span class="rtag" style="background:#ffb627;color:#3a2a00">${TYPE_N[x.type]}</span> <span class="muted" style="font-size:12px">продаёт Маркет</span></div>
        <div class="mp">${fmtC(x.val)}</div><button data-act="buyItem" data-i="${x.id}" style="width:110px" ${u.coins<x.val?'disabled':''}>КУПИТЬ</button></div>`;
      const cats=`${cat('boxes','🧰 Кейсы и наборы')}${cat('cards','🃏 Карточки')}${cat('tokens','♟ Фишки')}`;
      const wait=DB.lotsReady?'':' <b>Загружаем лоты…</b>';
      if(marketCat==='cards'){
        const list=shown.slice().sort((a,b)=>(lots[b.id]?1:0)-(lots[a.id]?1:0)||(a.coll||'').localeCompare(b.coll||'')||b.r-a.r);
        body=`<h3 style="font-size:28px;font-weight:400;margin-bottom:8px">Карточки от игроков</h3>
          <div style="margin-bottom:10px">${cats}
          <select class="inp" style="width:auto;margin-left:8px" onchange="marketColl=this.value;renderSite()"><option value="">Все коллекции</option>${Object.entries(COLLECTIONS).map(([k,c])=>`<option value="${k}" ${marketColl===k?'selected':''}>${c.ic} ${c.n}</option>`).join('')}</select></div>
          <p class="muted" style="margin-top:0">Карточки не продаются Маркетом — только игроками, по цене, которую назначил продавец. Получить карточку можно после матча, из набора или кейса — или купить здесь у другого игрока.${wait}</p>`+list.map(lotRow).join('');
      } else if(marketCat==='boxes'){
        const boxes=shown.filter(x=>isLotItem(x)).sort((a,b)=>(lots[b.id]?1:0)-(lots[a.id]?1:0)||typeOrder[a.type]-typeOrder[b.type]||a.val-b.val);
        body=`<h3 style="font-size:28px;font-weight:400;margin-bottom:8px">Кейсы и наборы</h3>
          <div style="margin-bottom:10px">${cats}</div>
          <p class="muted" style="margin-top:0">Кейсы и наборы тоже продают только игроки — их получают после матча. Ключи 🔑 продаёт Маркет.${wait}</p>`+
          shown.filter(x=>x.type==='key').map(shopRow).join('')+boxes.map(lotRow).join('');
      } else
      body=`<h3 style="font-size:28px;font-weight:400;margin-bottom:8px">Фишки</h3><div style="margin-bottom:10px">${cats}</div>`+
        shown.sort((a,b)=>a.val-b.val).map(shopRow).join('');
    } else if(marketTab==='sell'){
      const groups={}; (u.items||[]).forEach(x=>(groups[x.id]=(groups[x.id]||0)+1));
      const ids=Object.keys(groups);
      body=`<h3 style="font-size:28px;font-weight:400;margin-bottom:8px">Продать предметы</h3>
        <p class="muted">🃏 <b>Карточки, кейсы и наборы</b> выставляйте другим игрокам по своей цене (комиссия ${LOT_FEE*100}% с продажи) — или сразу сдайте Банку за ${BANK_CARD*100}% от ориентира. Ключи и фишки Маркет выкупает за 90%.</p>`+(ids.length?ids.map(id=>{ const x=item(id), card=isLotItem(x), L=lotsByItem()[id]; return `<div class="mrow">${itemArt(x,110,80)}
        <div class="mn2">${x.n} ${groups[id]>1?`<span class="muted">×${groups[id]}</span>`:''}<br><span class="rtag" style="background:${RAR[x.r][1]}">${RAR[x.r][0]}</span>
          ${card?`<br><span class="muted" style="font-size:12px">Ориентир ${fmtC(x.val)}${L?` · дешевле всех сейчас: ${fmtC(L[0].price)}`:' · сейчас никто не продаёт'}</span>`:''}</div>
        ${card?`<div style="display:flex;flex-direction:column;gap:2px"><button class="btn-o" data-act="listLot" data-i="${id}" style="width:150px">💰 ВЫСТАВИТЬ</button><button class="sec sm" data-act="sell" data-i="${id}" style="width:150px">Банку за ${fmtC(bankPrice(x))}</button></div>`
          :`<div class="mp">${fmtC(bankPrice(x))}</div><button class="btn-o" data-act="sell" data-i="${id}" style="width:110px">ПРОДАТЬ</button>`}</div>`; }).join(''):'<div class="empty"><div class="e">📦</div><p class="muted">Вам пока нечего продать. Предметы выпадают после матчей.</p></div>');
    } else if(marketTab==='hist'){
      body=dealsHTML(u);
    } else if(marketTab==='lots'){
      const my=(DB.myLots||[]).filter(l=>l.status==='open');
      body=`<h3 style="font-size:28px;font-weight:400;margin-bottom:8px">📋 Мои лоты</h3>
        <p class="muted">Пока предмет выставлен, его нет в инвентаре. Когда его купят, монеты (минус ${LOT_FEE*100}%) придут вам автоматически — даже если вас в это время нет в игре. Снять лот — предмет вернётся.</p>`+
        (my.length?my.map(l=>{ const x=item(l.item); return `<div class="mrow">${itemArt(x,110,80)}<div class="mn2">${x.n}<br><span class="muted" style="font-size:12px">выставлен ${new Date(l.created).toLocaleString('ru',{day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'})} · вы получите ${fmtC(lotNet(l.price))}</span></div>
          <div class="mp">${fmtC(l.price)}</div><button class="sec" data-act="cancelLot" data-l="${l.id}" style="width:110px">СНЯТЬ</button></div>`; }).join('')
          :'<div class="empty"><div class="e">🏷️</div><p class="muted">У вас ничего не выставлено. Выставить — во вкладке «Продать».</p></div>');
    } else {
      body=`<h3 style="font-size:28px;font-weight:400;margin-bottom:8px">👑 VIP-статус</h3>
        <p style="line-height:1.7">✔ Все режимы игры: Быстрая, Расклад, Перестановка, На время, Дуэль<br>✔ Предмет после рейтингового матча с шансом 100%<br>✔ Золотая звезда ★ у имени в игре</p>
        ${isVip(u)?`<p><span class="vipb">VIP</span> активен ещё <b>${vipLeft(u)}</b> Покупка продлит срок.</p>`:''}
        <div class="vipgrid">${VIP_PLANS.map(v=>`<div class="vipc"><div style="font-size:40px">👑</div><b style="font-size:22px">VIP на ${v.days} дней</b><div class="v" style="font-size:28px;margin:10px 0">${fmtC(v.price)}</div>
          <button class="btn-o" data-act="vip" data-d="${v.days}" ${u.coins<v.price?'disabled':''}>Купить</button></div>`).join('')}</div>`;

function showSlotModal(id){
  const u=me(), x=item(id); if(!u||x.type!=='card') return;
  cleanSlots(u);
  const cells=BASE_CELLS.map((c,i)=>[c,i]).filter(([c])=>isOwnable(c)&&collOf(c)===x.coll);
  const mine=u.items.filter(it=>it.id===id), on=slotsOf(u,id);
  const rows=cells.map(([c,i])=>{
    const cur=u.slots[i]&&item(u.items.find(it=>it.uid===u.slots[i]).id);
    const here=cur&&cur.id===id;
    return `<div class="crow" style="border-left:5px solid ${c.g?GROUPS[c.g].c:COLLECTIONS[x.coll].c}">
      <span class="ci">${c.ic}</span><span class="cnm"><b>${esc(c.name)}</b><br><small class="muted">${cur?`надета: ${esc(cur.n)} (+${cur.bonus}%)`:'свободно'}</small></span>
      ${here?`<button class="sm sec" data-unslot="${i}">Снять</button>`:`<button class="sm" data-slot="${i}">${cur?'Заменить':'Надеть сюда'}</button>`}</div>`; }).join('');
  $('#modal').innerHTML=`<div class="ov" id="slov" style="z-index:55"><div class="box lt" style="width:520px"><button class="x" id="slx">✕</button>
    <div style="display:flex;gap:14px;align-items:center">${itemArt(x,110,80)}<div><h2 style="margin:0">${esc(x.n)}</h2>
      <div class="muted">+${x.bonus}% к аренде · коллекция «${COLLECTIONS[x.coll].n}» · у вас ${mine.length} шт., надето ${on.length}</div></div></div>
    <p style="line-height:1.5">Выберите компанию на поле. Когда в партии она ваша, за неё платят аренду на <b>+${x.bonus}%</b> больше. На одну компанию — одна карточка.</p>
    <div>${rows}</div></div></div>`;
  $('#slov').onclick=e=>{
    if(e.target.id==='slov'||e.target.id==='slx') return closeModal();
    const s=e.target.closest('[data-slot]'), us=e.target.closest('[data-unslot]');
    if(us){ delete u.slots[us.dataset.unslot]; saveDB(); renderSite(); showSlotModal(id); return; }
    if(s){ const cell=+s.dataset.slot;
      // свободный экземпляр этой карточки; если все надеты — переносим один с другой компании
      const used=new Set(Object.values(u.slots));
      let inst=mine.find(it=>!used.has(it.uid));
      if(!inst){ inst=mine[0]; for(const k in u.slots) if(u.slots[k]===inst.uid) delete u.slots[k]; }
      u.slots[cell]=inst.uid; saveDB(); toast(`✔ ${x.n} надета на ${BASE_CELLS[cell].name}`); renderSite(); showSlotModal(id); }
  };
}

function showContents(id){

  const pct=v=>(v*100<1?(v*100).toFixed(2):(v*100).toFixed(1)).replace(/\.0+$/,'')+'%';
  $('#modal').innerHTML=`<div class="ov" id="cov" style="z-index:55"><div class="box lt" style="width:560px">
    <button class="x" id="cx">✕</button>
    <div style="display:flex;gap:14px;align-items:center">${itemArt(box,110,90)}<div><h2 style="margin:0">${box.n}</h2><div class="muted">${box.desc}</div></div></div>
    <div class="chips" style="margin:14px 0">${[0,1,2,3].filter(r=>box.odds[r]).map(r=>`<span class="chip" style="background:${RAR[r][1]};color:#fff">${RAR[r][0]} — ${box.odds[r]}%</span>`).join('')}</div>
    <div class="bstat"><div><span>Стоимость открытия</span><b>${fmtC(st.cost)}</b><small>${box.type==='case'?`${fmtC(box.val)} кейс + ${fmtC(item('key').val)} ключ`:'цена набора'}</small></div>
      <div><span>В среднем выпадает</span><b>${fmtC(st.ev)}</b><small>${Math.round(st.ev/st.cost*100)}% от стоимости</small></div>
      <div><span>Шанс окупиться</span><b>${pct(st.win)}</b><small>проиграть — ${pct(1-st.win)}</small></div></div>
    <div style="max-height:46vh;overflow:auto;margin-top:12px">${list.map(e=>`<div class="crow" style="border-left:5px solid ${RAR[e.x.r][1]}">
      ${itemArt(e.x,70,48)}<span class="cnm">${e.x.n}<br><small style="color:${RAR[e.x.r][1]}">${RAR[e.x.r][0]}</small></span>
      <span class="cv ${e.x.val>st.cost?'up':''}">${fmtC(e.x.val)}</span><span class="cp">${pct(e.chance)}</span></div>`).join('')}</div>
    <p class="muted" style="margin-bottom:0">Зелёным отмечены предметы дороже стоимости открытия.</p></div></div>`;
  $('#cov').onclick=e=>{ if(e.target.id==='cov'||e.target.id==='cx') closeModal(); };
}

function xpForLevel(L){ let xp=0,need=100; for(let l=1;l<L;l++){ xp+=need; need=100+(l+1)*25; } return xp; }

  else toast('✔ '+msg);

}

// ====== РЫНОК ИГРОКОВ: карточки продают только игроки, по своей цене ======
// lots/{id}: {seller, sellerName, item, price, status:'open'|'sold', buyer, created, soldAt}
// Выставить: карточка уходит из инвентаря в лот. Купить: лот помечается проданным (транзакция), покупатель
// платит и получает карточку. Продавец забирает выручку сам (правила базы не дают писать в чужой профиль).
const LOT_FEE=0.1, BANK_CARD=0.5, LOT_MAX=20, LOT_PRICE_MAX=100000;
// история сделок аккаунта (последние 100): buy — у игрока, sell — игроку, bank — сдал Банку, shop — купил у Маркета, vip
const DEAL_N={buy:['🛒','Куплено у игрока'],sell:['💰','Продано игроку'],bank:['🏦','Сдано Банку'],shop:['🏪','Куплено у Маркета'],vip:['👑','Куплен VIP']};
function addDeal(u,d){ u.deals=[{t:Date.now(),...d},...(u.deals||[])].slice(0,100); }
function dealsHTML(u){
  const list=(u.deals||[]).filter(d=>dealFilter==='all'||(dealFilter==='in'?['buy','shop','vip'].includes(d.k):['sell','bank'].includes(d.k)));
  const spent=r2((u.deals||[]).filter(d=>['buy','shop','vip'].includes(d.k)).reduce((s,d)=>s+d.price,0));
  const got=r2((u.deals||[]).filter(d=>['sell','bank'].includes(d.k)).reduce((s,d)=>s+(d.net!=null?d.net:d.price),0));
  const f=(k,n)=>`<button class="sm ${dealFilter===k?'':'sec'}" data-act="dealf" data-t="${k}">${n}</button>`;
  return `<h3 style="font-size:28px;font-weight:400;margin-bottom:8px">🧾 История сделок</h3>
    <div style="display:flex;gap:16px;flex-wrap:wrap;margin-bottom:8px;font-size:14px"><span>Потрачено: <b style="color:#e05252">−${fmtC(spent)}</b></span><span>Получено: <b style="color:#2e9e5b">+${fmtC(got)}</b></span></div>
    <div style="margin-bottom:6px">${f('all','Все')}${f('in','🛒 Покупки')}${f('out','💰 Продажи')}</div>`+
    (list.length?list.map(d=>{ const x=d.item?item(d.item):null, [ic,n]=DEAL_N[d.k]||['•',d.k], plus=['sell','bank'].includes(d.k);
      return `<div class="mrow">${x?itemArt(x,110,80):`<div class="art" style="width:110px;height:80px;font-size:40px">${ic}</div>`}
        <div class="mn2">${x?esc(x.n):`VIP на ${d.days} дней`}<br><span class="muted" style="font-size:13px">${ic} ${n}${d.who?` · ${plus?'покупатель':'продавец'}: ${esc(d.who)}`:''}${d.net!=null?` · комиссия ${fmtC(r2(d.price-d.net))}`:''}</span>
          <br><span class="muted" style="font-size:12px">${new Date(d.t).toLocaleString('ru',{day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'})}</span></div>
        <div class="mp" style="color:${plus?'#2e9e5b':'#e05252'};font-weight:700">${plus?'+':'−'}${fmtC(d.net!=null?d.net:d.price)}</div></div>`; }).join('')
      :'<div class="empty"><div class="e">🧾</div><p class="muted">Здесь появятся ваши покупки и продажи.</p></div>');
}
let dealFilter='all';
const isLotItem=x=>!!x&&['card','case','set'].includes(x.type); // эти предметы продают только игроки
const bankPrice=x=>r2(x.val*(isLotItem(x)?BANK_CARD:0.9));
const lotNet=p=>r2(p*(1-LOT_FEE));
let lotsUnsub=null, myLotsUnsub=null;
DB.lots=[]; DB.myLots=[];
// открытые лоты по предметам, от дешёвых к дорогим
function lotsByItem(){ const g={}; for(const l of DB.lots||[]) if(l.status==='open') (g[l.item]=g[l.item]||[]).push(l);
  for(const k in g) g[k].sort((a,b)=>a.price-b.price||a.created-b.created); return g; }
function listenLots(){
  if(!FB||!me()) return;
  if(!lotsUnsub) lotsUnsub=FB.db.collection('lots').where('status','==','open').limit(500).onSnapshot(s=>{
    DB.lots=s.docs.map(d=>({id:d.id,...d.data()})); DB.lotsReady=true; if(PAGE==='market'&&!$('#dlg').innerHTML) renderSite();
  },e=>{ console.error('lots',e); DB.lotsReady=true; });
  if(!myLotsUnsub) myLotsUnsub=FB.db.collection('lots').where('seller','==',DB.session).onSnapshot(s=>{
    DB.myLots=s.docs.map(d=>({id:d.id,...d.data()}));
    DB.myLots.filter(l=>l.status==='sold').forEach(collectLot);
    if(PAGE==='market'&&!$('#dlg').innerHTML) renderSite();
  },e=>console.error('mylots',e));
}
function stopLots(){ if(lotsUnsub){ lotsUnsub(); lotsUnsub=null; } if(myLotsUnsub){ myLotsUnsub(); myLotsUnsub=null; } DB.lots=[]; DB.myLots=[]; DB.lotsReady=false; }
// продавец: забрать деньги за проданный лот (ровно один раз — лот удаляется в транзакции)
const collecting=new Set();
async function collectLot(l){
  if(collecting.has(l.id)) return; collecting.add(l.id);
  try{
    let got=null;
    await FB.db.runTransaction(async tx=>{ const ref=FB.db.collection('lots').doc(l.id), s=await tx.get(ref);
      got=null; if(!s.exists) return; const d=s.data(); if(d.status!=='sold'||d.seller!==DB.session) return; got=d; tx.delete(ref); });
    const u=me(); if(got&&u){ u.coins=r2((u.coins||0)+lotNet(got.price)); let who=""; try{ const b=await loadUser(got.buyer); who=(b&&b.name)||""; }catch(_){} addDeal(u,{k:"sell",item:got.item,price:got.price,net:lotNet(got.price),who}); saveDB(); toast(`💰 Продано: «${item(got.item).n}» за ${fmtC(got.price)} — вам ${fmtC(lotNet(got.price))}`); if(PAGE==='market'||PAGE==='inventory') renderSite(); }
  }catch(e){ console.error('collect',e); collecting.delete(l.id); }
}
async function listLot(id){
  const u=me(), x=item(id); if(!u||!FB||!isLotItem(x)) return;
  if((DB.myLots||[]).filter(l=>l.status==='open').length>=LOT_MAX) return toast(`Не больше ${LOT_MAX} лотов одновременно`);
  const L=lotsByItem()[id], hint=L?`Сейчас дешевле всех: ${fmtC(L[0].price)}.`:'Сейчас эту карточку никто не продаёт.';
  const v=await askText(`💰 Выставить «${esc(x.n)}»`,String(L?L[0].price:x.val),{num:1,ok:'Выставить',
    note:`Назначьте цену в монетах 🪙. Ориентир: ${fmtC(x.val)}. ${hint}<br>Вы получите цену минус ${LOT_FEE*100}% комиссии Маркета.`});
  if(v===null||v===undefined||v==='') return;
  const price=r2(parseFloat(String(v).replace(',','.')));
  if(!(price>=0.01&&price<=LOT_PRICE_MAX)) return toast(`Цена — от 🪙 0.01 до 🪙 ${LOT_PRICE_MAX}`);
  // убираем экземпляр из инвентаря (сначала ненадетый)
  const used=new Set(Object.values(cleanSlots(u)));
  let k=u.items.findIndex(it=>it.id===id&&!used.has(it.uid)); if(k<0) k=u.items.findIndex(it=>it.id===id); if(k<0) return;
  const [it]=u.items.splice(k,1); cleanSlots(u);
  try{
    await saveAccount(u);
    await FB.db.collection('lots').add({seller:DB.session,sellerName:u.name,item:id,price,status:'open',created:Date.now()});
    toast(`✔ Выставлено: «${x.n}» за ${fmtC(price)}`);
  }catch(e){ u.items.push(it); saveDB(); toast('Не удалось выставить: '+(e.message||e)); }
  renderSite();
}
async function buyLot(lid){
  const u=me(), l=(DB.lots||[]).find(x=>x.id===lid); if(!u||!FB) return;
  if(!l||l.status!=='open') return toast('Этот лот уже купили — обновляем список');
  if(l.seller===DB.session) return;
  const x=item(l.item);
  if((u.coins||0)<l.price) return toast('Не хватает монет');
  if(!await askConfirm(`Купить ${x.ic} «${esc(x.n)}» у ${esc(l.sellerName||'игрока')} за ${fmtC(l.price)}?`,'Купить')) return;
  if((u.coins||0)<l.price) return;
  try{
    await FB.db.runTransaction(async tx=>{ const ref=FB.db.collection('lots').doc(lid), s=await tx.get(ref);
      if(!s.exists||s.data().status!=='open') throw new Error('Этот лот уже купили');
      tx.update(ref,{status:'sold',buyer:DB.session,soldAt:Date.now()}); });
    u.coins=r2(u.coins-l.price); addItem(u,l.item); addDeal(u,{k:"buy",item:l.item,price:l.price,who:l.sellerName||""}); await saveAccount(u);
    toast(`✔ Куплено: «${x.n}» за ${fmtC(l.price)}`); renderSite();
  }catch(e){ toast(e.message||String(e)); }
}
async function cancelLot(lid){
  const u=me(); if(!u||!FB) return;
  let got=null;
  try{
    await FB.db.runTransaction(async tx=>{ const ref=FB.db.collection('lots').doc(lid), s=await tx.get(ref);
      got=null; if(!s.exists) return; const d=s.data(); if(d.seller!==DB.session||d.status!=='open') return; got=d; tx.delete(ref); });
    if(got){ addItem(u,got.item); saveDB(); toast('Лот снят — предмет вернулся в инвентарь'); }
    else toast('Лот уже продан — монеты придут автоматически');
    renderSite();
  }catch(e){ toast('Ошибка: '+(e.message||e)); }
}
// таблицы лидеров сезона и задачи дня (одиночные поля сортируются без отдельных индексов)
const seasonDaysLeft=()=>{ const n=new Date(), e=new Date(n.getFullYear(),n.getMonth()+1,1); return Math.max(1,Math.ceil((e-n)/86400000)); };
async function loadBoards(){ if(!FB||!me()) return;
  const q=async k=>(await FB.db.collection('users').orderBy(k,'desc').limit(10).get()).docs.map(d=>{ const a=d.data(); a.login=d.id; return a; }).filter(a=>a[k]>0);
  try{ DB.season=await q(seasonKey()); if(PAGE==='games') renderSite(); }catch(e){ console.error('boards',e); } }
// зритель: смотреть чужую партию
function spectate(rid){ closeModal(); watchRoom(rid); NET.spec=true; }
async function loadFans(){ if(!FB||!me()) return; try{ const s=await FB.db.collection('users').where('friends','array-contains',DB.session).limit(50).get();
  DB.fans=s.docs.map(d=>{ const a=d.data(); a.login=d.id; return a; }); if(PAGE==='friends') renderSite(); }catch(e){ console.error('fans',e); } }
// ====== ВХОД / ВЫХОД ======
let REGISTERING=false;
async function onSignedIn(){
  DB.ready=true;
  await loadFriends().catch(()=>{});
  if(PAGE==='auth'||PAGE==='home') go('games'); else renderSite();
  loadTop(); loadBoards(); loadFans(); if(isAdminUser()) adminLoad(); checkSeasonAward(me());
  listenLobby(); rejoinMyRoom(); listenLots(); listenGlobalChat(); listenDM(); heartbeat(); dailyLogin(me()); checkWeekendAward(me()); joinFromLink();
}
if(FB){
  FB.db.collection('config').doc('site').get().then(s=>{ if(s.exists&&s.data().creatorName){ DB.creatorName=s.data().creatorName; $('#creator').textContent=DB.creatorName; } }).catch(()=>{});
  FB.auth.onAuthStateChanged(async user=>{
    if(!user){ DB.session=null; DB.accounts={}; DB.ready=true; if(AUTH_PAGES.includes(PAGE)) go('auth'); else renderSite(); return; }
    if(REGISTERING) return; // профиль сейчас создаётся в register()
    try{
      const a=await loadUser(user.uid);
      if(!a){ DB.session=null; toast('Профиль не найден — зарегистрируйтесь заново'); await FB.auth.signOut(); return; }
      DB.session=user.uid; setupRows=null; if(checkAch(a).length) saveDB(); onSignedIn();
    }catch(e){ console.error(e); toast('Не удалось загрузить профиль: '+(e.message||e)); }
  });
}
// при переходе на страницы подгружаем свежие данные
const _go=go;
go=function(page){ _go(page); if(PAGE==='games'){ loadTop(); loadBoards(); loadWeekend(); refreshSeen(); } if(PAGE==='friends'){ loadFans(); loadFriends().then(()=>{ if(PAGE==='friends') renderSite(); }).catch(()=>{}); } if(PAGE==='admin') adminLoad(); };
$('#landing').addEventListener('click',e=>{
  if(DD&&!e.target.closest('.dd')&&!e.target.closest('[data-act="dd"]')){ DD=false; renderSite(); }
  // телефон: плитка инвентаря открывается окном с подробностями и кнопками
  const tl=e.target.closest('.tile');
  if(tl&&!e.target.closest('button')&&matchMedia('(max-width:700px) and (hover:hover)').matches&&!document.documentElement.classList.contains('phsite')){
    const info=tl.querySelector('.tinfo'), art=tl.querySelector('.tart'), nm=tl.querySelector('.tname');
    $('#modal').innerHTML=`<div class="ov" id="tlov"><div class="box lt tlbox">${art?art.outerHTML:''}<h3 style="margin:6px 0">${nm?nm.innerHTML:''}</h3>${info?info.outerHTML:''}
      <button class="sec" id="tlx" style="margin-top:8px">Закрыть</button></div></div>`;
    $('#tlov').onclick=ev=>{ if(ev.target.id==='tlov'||ev.target.id==='tlx') return closeModal();
      const a=ev.target.closest('[data-act]'); if(a&&ACT[a.dataset.act]&&!a.disabled){ closeModal(); ACT[a.dataset.act](a); } };
    return;
  }
  const g=e.target.closest('[data-go]'); if(g){ go(g.dataset.go); return; }
  const a=e.target.closest('[data-act]'); if(a&&ACT[a.dataset.act]&&!a.disabled) ACT[a.dataset.act](a);
});
$('#landing').addEventListener('keydown',e=>{ if(e.key==='Enter'&&e.target.dataset.enter) ACT[e.target.dataset.enter](); });
$('#menuBtn').onclick=showLanding;

$('#creator').textContent=DB.creatorName||CREATOR;
// ====== ТЕЛЕФОН ======
// на узком экране (телефон вертикально) журнал переезжает под поле, где есть место
const narrowMQ=window.matchMedia('(max-width:820px)'), landMQ=window.matchMedia('(max-height:520px) and (orientation:landscape)');
// журнал всегда внутри поля (на телефоне игроки слева, поле справа — как на компьютере)
function placeLog(){ const log=$('#log'), target=$('#center'); if(log&&target&&log.parentNode!==target) target.appendChild(log); }
[narrowMQ,landMQ].forEach(m=>m.addEventListener?m.addEventListener('change',placeLog):m.addListener(placeLog));
placeLog();
// кнопка «на весь экран» (на iPhone браузер её может не поддерживать — тогда кнопка скрыта)
const fsOK=!!(document.documentElement.requestFullscreen||document.documentElement.webkitRequestFullscreen);
if(!fsOK) $('#fsBtn').style.display='none';
$('#fsBtn').onclick=()=>{
  const d=document, el=d.documentElement;
  if(d.fullscreenElement||d.webkitFullscreenElement) (d.exitFullscreen||d.webkitExitFullscreen).call(d);
  else (el.requestFullscreen||el.webkitRequestFullscreen).call(el).catch?.(()=>{});
};
buildBoard();
showLanding();
