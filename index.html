<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Бизнес-империя</title>
<!-- Firebase: аккаунты и игра по сети -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",system-ui,Arial,sans-serif;background:#1b1f2a;color:#eee;min-height:100vh}
button{font:inherit;cursor:pointer;border:0;border-radius:8px;padding:9px 16px;background:#2ec4a0;color:#fff;font-weight:600;margin:3px}
button:hover{filter:brightness(1.08)}
button:disabled{opacity:.4;cursor:default;filter:none}
button.sec{background:#4a5163}
button.red{background:#e05252}
button.btn-o{background:#ff8a3d}
button.sm{padding:5px 12px;font-size:13px}
/* ===== Игра ===== */
#app{display:flex;gap:14px;padding:14px;justify-content:center;align-items:flex-start;flex-wrap:wrap}
#players{width:200px;display:flex;flex-direction:column;gap:10px}
.pl{background:#2a2f3d;border-radius:10px;padding:10px;text-align:center;border:2px solid transparent;transition:.2s}
.pl{cursor:pointer}
.pl:hover{filter:brightness(1.12)}
.pl.active{box-shadow:0 0 18px rgba(255,255,255,.18)}
.pl.open{border-radius:10px 10px 0 0}
.pl{position:relative}
.tmr{position:absolute;left:8px;top:8px;background:#0005;border-radius:20px;padding:3px 9px;font-weight:700;font-size:14px}
.pmenu{background:#e9ebf0;color:#262b38;border-radius:0 0 10px 10px;margin-top:-10px;overflow:hidden;font-size:15px}
.pmi{padding:11px 16px;cursor:pointer;display:flex;gap:10px;align-items:center;border-top:1px solid #d9dce5}
.pmi:hover{background:#dde0e8}
.pmi.red{color:#c62828}
.pmi.dis{opacity:.45;cursor:default}
.pprof .stat{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid #ffffff10}
.pl.out{opacity:.35}
.av{width:42px;height:42px;border-radius:50%;margin:0 auto 5px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;color:#fff;border:3px solid #fff3}
.pl .nm{font-weight:600;font-size:14px}
.pl .mn{font-size:21px;margin-top:3px}
.pl .tag{font-size:11px;opacity:.7;margin-top:2px}
#board{--s:min(calc(100vh - 28px),calc(100vw - 250px));width:var(--s);height:var(--s);min-width:620px;min-height:620px;display:grid;grid-template-columns:1.5fr repeat(9,1fr) 1.5fr;grid-template-rows:1.5fr repeat(9,1fr) 1.5fr;gap:2px;background:#11141b;padding:2px;border-radius:8px}
.cell{background:#f4f1ea;color:#222;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:max(9px,calc(var(--s)/105));text-align:center;cursor:pointer;overflow:hidden;border-radius:3px;padding-top:6%}
.cell:hover{outline:2px solid #2ec4a0;z-index:2}
.cell.here{outline:3px solid #ffd54f;z-index:3;box-shadow:0 0 12px #ffd54f99}
.cell .band{position:absolute;left:0;right:0;top:0;height:13%}
.cell .ic{font-size:max(15px,calc(var(--s)/42));line-height:1}
.cell .cn{font-weight:600;padding:0 2px;line-height:1.1;margin-top:2px}
.cell .pr{font-size:.95em;opacity:.7;margin-top:2px;padding:0 4px;border-radius:3px}
.cell .lv{color:#e6a800;font-size:1.1em;line-height:1}
.cell.owned .pr{opacity:1;font-weight:700;color:#fff}
.cell.mort .ic,.cell.mort .cn{opacity:.35}
.cell.corner{background:#e8e3d6}
.cell.corner .ic{font-size:max(26px,calc(var(--s)/22))}
.tokens{position:absolute;bottom:2px;left:0;right:0;display:flex;justify-content:center;gap:1px;flex-wrap:wrap;pointer-events:none}
.tok{width:max(11px,calc(var(--s)/60));height:max(11px,calc(var(--s)/60));border-radius:50%;border:2px solid #fff;box-shadow:0 1px 3px #000a}
.tok.sk{width:max(18px,calc(var(--s)/40));height:max(18px,calc(var(--s)/40));background:#fff;border-width:3px;display:flex;align-items:center;justify-content:center;font-size:max(10px,calc(var(--s)/70))}
#center{grid-column:2/11;grid-row:2/11;background:#262b38;display:flex;flex-direction:column;padding:12px 16px;gap:8px;border-radius:4px;min-height:0}
#top{display:flex;align-items:center;justify-content:space-between;gap:10px}
#title{font-size:22px;font-weight:800;letter-spacing:.5px}
#title span{color:#2ec4a0}
#minfo{font-size:12px;opacity:.7;font-weight:400;letter-spacing:0}
#dice{font-size:48px;line-height:1;letter-spacing:6px;white-space:nowrap}
#dice small{font-size:22px;color:#2ec4a0;letter-spacing:0;vertical-align:middle}
#dice .d3{color:#ffb627;margin-left:4px}
#actions{min-height:60px;text-align:center}
#actions .hint{opacity:.75;font-size:13px;margin:4px}
#actions .q{margin:4px 0;font-size:15px}
#log{flex:1;overflow:auto;background:#1e222d;border-radius:8px;padding:8px 10px;font-size:13px;line-height:1.45;min-height:0}
#log div{border-bottom:1px solid #ffffff0d;padding:2px 0}
.ov{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:50}
.box{background:#2a2f3d;border-radius:14px;padding:22px;min-width:320px;max-width:94vw;max-height:94vh;overflow:auto;box-shadow:0 10px 40px #000a;position:relative}
.box h2{margin:0 0 12px}
.row{display:flex;gap:8px;align-items:center;margin:6px 0}
.row input[type=text]{flex:1;padding:8px;border-radius:6px;border:0;background:#1e222d;color:#eee;font:inherit}
.sw{width:22px;height:22px;border-radius:50%;flex:none}
.card{width:300px}
.card .hd{padding:14px;border-radius:10px 10px 0 0;color:#fff;font-weight:700;font-size:18px;text-align:center;text-shadow:0 1px 2px #0008}
.card table{width:100%;border-collapse:collapse;font-size:14px;margin:8px 0}
.card td{padding:3px 4px;border-bottom:1px solid #ffffff10}
.card td:last-child{text-align:right}
.card tr.cur td{color:#2ec4a0;font-weight:700}
.muted{opacity:.7;font-size:13px}
.tcols{display:flex;gap:14px}
.tcol{flex:1;background:#1e222d;border-radius:10px;padding:10px;min-width:0}
.tcol h3{margin:0 0 8px;font-size:15px}
.tlist{max-height:300px;overflow:auto}
.ti{display:flex;align-items:center;gap:6px;padding:4px 2px;font-size:13px;cursor:pointer;border-radius:6px}
.ti:hover{background:#ffffff0a}
.ti.dis{opacity:.4;cursor:default}
.ti .sw{width:12px;height:12px}
.ti .p{margin-left:auto;opacity:.6}
.tcol input[type=number]{width:100%;padding:7px;border-radius:6px;border:0;background:#2a2f3d;color:#eee;font:inherit;margin-top:4px}
.pbtn{background:#4a5163}.pbtn.sel{outline:2px solid #fff}
#tov .row{flex-wrap:wrap;gap:6px}#tov .pbtn{margin:0;white-space:nowrap}
@media (max-width:820px){#tov .pbtn{padding:6px 10px;font-size:13px}#tov .box h2{font-size:20px}}
#tmsg{min-height:22px;margin:10px 0 4px;text-align:center;font-weight:600}
.tsum{background:#1e222d;border-radius:10px;padding:10px 14px;margin:10px 0;line-height:1.6}
.ingame-menu{position:fixed;left:14px;bottom:14px;z-index:30}

/* ===== Светлое окно выбора режима ===== */
.box.lt{background:#fff;color:#262b38}
.mm{display:flex;padding:0;width:900px;min-height:560px}
.ml{width:290px;background:#f6f7fb;padding:12px;flex:none}
.mi{padding:14px 16px;border-radius:10px;cursor:pointer;margin-bottom:4px}
.mi b{display:block;font-size:19px;font-weight:600}
.mi span{font-size:13px;opacity:.7}
.mi:hover{background:#eceef6}
.mi.sel{background:linear-gradient(120deg,#ff8a3d,#ffb627);color:#fff}
.mi.sel span{opacity:.95}
.mr{flex:1;padding:24px 28px;min-width:0}
.mr h2{font-weight:600}
.mr h3{margin:18px 0 6px;font-size:16px}
.x{position:absolute;right:10px;top:8px;background:none;color:#889;font-size:20px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:#eef1f7;border-radius:20px;padding:4px 12px;font-size:13px}
.inp{padding:9px 12px;border:1px solid #d5d9e3;border-radius:8px;font:inherit;width:100%;background:#fff;color:#262b38}
.box.lt .row .inp{flex:1}
.box.lt .row input[type=text]{background:#fff;color:#262b38;border:1px solid #d5d9e3;padding:9px 12px}
.box.lt .row select.inp{flex:none;width:170px}
.rn{flex:1;display:flex;align-items:center;gap:8px}
.sbtns{margin-top:20px}
button.big{font-size:18px;padding:12px 28px}
.err{color:#e05252;font-size:14px;min-height:20px;margin-top:6px}

/* ===== Сайт ===== */
#landing{position:fixed;inset:0;overflow:auto;z-index:40;background:#eef1f7;color:#262b38}
#landing.hide{display:none}
#landing.home{background:linear-gradient(160deg,#5a3fd6 0%,#3b5bdb 45%,#22b8a5 100%);color:#fff}
.shead{background:#fff;box-shadow:0 1px 0 #0000000f;position:relative;z-index:5}
#landing.home .shead{background:transparent;box-shadow:none}
.lwrap{max-width:1200px;margin:0 auto;padding:0 28px}
.lnav{display:flex;align-items:center;gap:8px;padding:18px 28px;max-width:1200px;margin:0 auto}
.logo{display:flex;align-items:center;gap:10px;font-size:21px;font-weight:800;margin-right:18px;cursor:pointer}
.logo .mk{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#5a3fd6,#22b8a5);display:flex;align-items:center;justify-content:center;font-size:22px;box-shadow:0 4px 14px #0002}
#landing.home .logo .mk{background:#fff}
.lnav a{color:inherit;text-decoration:none;font-weight:600;font-size:16px;padding:10px 14px;border-radius:8px;cursor:pointer;white-space:nowrap}
.lnav a:hover{background:#0000000a}
#landing.home .lnav a:hover{background:#ffffff26}
.lnav a.act{color:#5a3fd6}
.lnav a.pill{background:#5a3fd6;color:#fff;text-transform:uppercase;font-size:14px;letter-spacing:.5px;padding:12px 22px}
#landing.home .lnav a.pill{background:#ffffffe6;color:#3b4bc8}
.lnav .sp{flex:1}
.lnav .login{background:#ffb627;color:#3a2a00;padding:12px 26px;text-transform:uppercase;font-size:14px;letter-spacing:.5px;margin:0}
.badge{background:#22b8a5;color:#fff;border-radius:6px;padding:1px 7px;font-size:12px;margin-left:6px}
.coins{font-weight:700;font-size:16px;margin-right:12px;white-space:nowrap}
.avwrap{position:relative}
.avc{border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;flex:none;box-shadow:0 0 0 3px #ffffff,0 0 0 5px var(--ring,#22b8a5)}
.avwrap .avc{cursor:pointer}
.dd{position:absolute;right:0;top:58px;background:#fff;color:#262b38;border-radius:10px;box-shadow:0 10px 30px #0003;min-width:250px;overflow:hidden;z-index:10}
.dd .ddh{display:flex;gap:12px;align-items:center;padding:16px;border-bottom:1px solid #eef}
.dd a{display:block;padding:11px 18px;border-radius:0;font-weight:400}
.dd a:hover{background:#f3f5fb}
.dd hr{border:0;border-top:1px solid #eef;margin:0}
.page{max-width:1200px;margin:0 auto;padding:28px}
.cardw{background:#fff;border-radius:12px;padding:22px;box-shadow:0 2px 10px #0000000d;margin-bottom:22px}
.cardw h3{margin:0;font-size:22px;font-weight:500}
.ch{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px}
.cols{display:grid;grid-template-columns:380px 1fr;gap:24px}
.task{padding:14px 0;border-bottom:1px solid #eef}
.task:last-child{border:0}
.task .tn{font-size:15px}
.task .tp{font-weight:700;margin:4px 0}
.bar{height:7px;background:#e4e7ef;border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#22b8a5,#3b5bdb);border-radius:4px}
.task .tr{font-size:13px;opacity:.7;margin-top:6px}
.task.done .tn{text-decoration:line-through;opacity:.6}
.banner{background:#262b38;color:#fff;display:flex;gap:20px;align-items:center;padding:26px 30px}
.banner h3{font-size:26px;font-weight:700;margin-bottom:8px}
.banner p{margin:0 0 10px;opacity:.9;line-height:1.5}
.banner .tick{font-size:70px}
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.mode{border-radius:12px;padding:18px;color:#fff;cursor:pointer;min-height:130px;display:flex;flex-direction:column;transition:.15s}
.mode:hover{transform:translateY(-3px);box-shadow:0 8px 20px #0002}
.mode .mic{font-size:32px}
.mode b{font-size:19px;margin-top:6px}
.mode span{font-size:13px;opacity:.9;margin-top:4px}
.top{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #f0f1f6}
.top .n{flex:1}
.top .pos{width:22px;font-weight:700;opacity:.5}
.crumbs{display:flex;align-items:center;gap:14px;font-size:32px;margin-bottom:22px}
.crumbs a{color:#3b8fd6;cursor:pointer;text-decoration:none;border-bottom:1px solid #3b8fd655}
.crumbs .gt{opacity:.4}
.crumbs .cnt{opacity:.4;font-size:26px}
.flist{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:20px}
.fitem{display:flex;gap:16px;align-items:center}
.fitem .fn{font-size:22px;color:#3b8fd6}
.addf{display:flex;gap:8px;max-width:520px;margin-bottom:6px}
.addf .inp{flex:1}
.igrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px}
.itm{background:#fff;border-radius:12px;padding:18px;text-align:center;box-shadow:0 2px 10px #0000000d;border:2px solid transparent}
.itm.eq{border-color:#22b8a5}
.itm .big{font-size:56px;height:70px;display:flex;align-items:center;justify-content:center}
.itm .in{font-weight:600;margin:6px 0}
.rtag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:4px;color:#fff}
.bstat{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.bstat div{background:#f3f5fb;border-radius:10px;padding:10px;text-align:center}
.bstat span{display:block;font-size:12px;opacity:.6}
.bstat b{display:block;font-size:20px;margin:2px 0}
.bstat small{opacity:.6;font-size:11px}
.crow{display:flex;align-items:center;gap:12px;padding:8px 10px;border-bottom:1px solid #eef;border-radius:4px}
.crow .ci{font-size:28px;width:40px;text-align:center}
.crow .cnm{flex:1;font-size:14px}
.crow .cv{width:80px;text-align:right}
.crow .cv.up{color:#2e9e5b;font-weight:700}
.crow .cp{width:64px;text-align:right;font-weight:700}
.lobby .room{border-top:1px solid #eef0f5;padding:16px 0 10px}
.lobby .rh{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:18px}
.lobby .ric{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px}
.lobby .rtagl{font-size:12px;color:#8a93a6;background:#f3f5fb;border-radius:12px;padding:3px 10px}
.lobby .rps{display:flex;gap:22px;flex-wrap:wrap;margin-top:12px}
.lobby .lp{width:96px;text-align:center;font-size:14px}
.lobby .lp .avc{margin:0 auto 6px}
.lobby .lpn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#3b8fd6}
.lobby .lp.join{cursor:pointer;color:#8a93a6}
.lobby .lp.join:hover .plus{color:#22b8a5}
.lobby .plus{width:74px;height:74px;margin:0 auto 6px;display:flex;align-items:center;justify-content:center;font-size:54px;font-weight:200;color:#b8bfcc}
.admrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0}
.admrow b{width:80px;font-weight:600}
.admrow .inp{width:auto}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#262b38;color:#fff;padding:12px 22px;border-radius:10px;z-index:100;box-shadow:0 8px 24px #0004;font-weight:600}
.art{position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;flex:none}
.art .plate{width:78%;height:56%;display:flex;align-items:center;justify-content:center;font-weight:900;text-align:center;line-height:1;padding:4px;border-radius:8px;font-family:"Arial Black","Segoe UI",Arial,sans-serif;letter-spacing:-.5px;word-break:keep-all;overflow-wrap:normal}
.art img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff;padding:10%}
.bx{position:relative;transform:perspective(320px) rotateX(24deg) rotateZ(-7deg);filter:drop-shadow(0 14px 12px #0003)}
.bx .side{position:absolute;left:0;right:0;bottom:-16%;height:30%;background:linear-gradient(#d9dde6,#c3c8d4);border-radius:0 0 8px 8px}
.bx .lid{position:absolute;inset:0;border-radius:8px;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 1px #ffffff80}
.bx .shield{width:1.4em;height:1.4em;border-radius:6px 6px 50% 50%;display:flex;align-items:center;justify-content:center;font-size:.7em;color:#fff;box-shadow:0 2px 6px #0004;border:2px solid #fff}
.tokart{border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 -4px 10px #0001,0 6px 14px #0002}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(196px,1fr));gap:14px}
.tile{background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 2px 10px #0000000d;position:relative;display:flex;flex-direction:column}
.tile.eq{box-shadow:0 0 0 3px #22b8a5}
.tile .tart{display:flex;justify-content:center;background:#fff}
.tile .tname{color:#fff;text-align:center;padding:10px 6px;font-size:15px;font-weight:500}
.tile .tinfo{padding:8px 10px 10px;text-align:center;font-size:12px}
.tile .tinfo button{margin:3px 2px}
.itm{position:relative}
.cntb{position:absolute;right:10px;top:8px;background:#262b38;color:#fff;border-radius:10px;padding:1px 8px;font-size:12px;font-weight:700}
.vipb{background:linear-gradient(135deg,#ffb627,#ff8a3d);color:#3a2a00;font-weight:800;font-size:12px;border-radius:6px;padding:2px 8px;margin-right:8px}
.lockbox{background:#fff4e5;border:1px solid #ffd59e;border-radius:10px;padding:14px 16px;margin:16px 0;line-height:1.6;color:#5a3a00}
.lockbox.vip{background:linear-gradient(120deg,#fdecef,#efe9ff);border-color:#e3c7f5;color:#4a2a6a}
.vipgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-top:16px}
.vipc{background:linear-gradient(135deg,#fff7e6,#f3ecff);border-radius:14px;padding:22px;text-align:center}
.empty{text-align:center;padding:50px 0}
.empty .e{font-size:54px}
.mhero{background:linear-gradient(120deg,#7b6be0,#7fb3e8 60%,#8fe3e0);color:#fff;margin:-28px -28px 28px;padding:40px 28px}
.mhero h1{margin:0 0 6px;font-size:44px}
.mrow{display:flex;align-items:center;gap:18px;padding:16px 4px;border-bottom:1px solid #eef}
.mrow .mi2{font-size:44px;width:70px;text-align:center}
.mrow .mn2{flex:1;font-size:20px}
.mrow .mp{font-size:20px;width:110px;text-align:right}
.bal{text-align:center}
.bal .v{font-size:44px;font-weight:300;margin:8px 0}
.prof{display:flex;gap:40px;align-items:center;margin-bottom:30px}
.prof h1{font-size:56px;font-weight:300;margin:0}
.rank{display:flex;align-items:center;gap:10px;font-size:20px;margin:10px 0 20px}
.rank .ri{font-size:28px}
.stats{display:flex;gap:30px;align-items:center;flex-wrap:wrap}
.stats div b{display:block;font-size:42px;font-weight:300;line-height:1}
.stats div span{opacity:.5}
.favs{display:flex}
.favs .avc{margin-left:-6px;box-shadow:0 0 0 2px #fff}
.achs{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.ach{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;background:#f6f4ff}
.ach.off{opacity:.55;filter:grayscale(1)}
.ach .ai{font-size:28px;position:relative;width:38px;text-align:center}.ach .ai small{position:absolute;right:-6px;bottom:-4px;font-size:15px}
.hist{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #f0f1f6}
.auth{display:grid;grid-template-columns:1fr 60px 1fr;max-width:960px;margin:0 auto;padding:0}
.auth .ap{padding:30px}

// ====== СВОИ ОКНА ПОДТВЕРЖДЕНИЯ (встроенные confirm/prompt браузера работают не везде) ======
function askConfirm(text,okText='Да',danger=false){
  return new Promise(res=>{
    const d=document.getElementById('dlg');
    d.innerHTML=`<div class="ov" style="z-index:60"><div class="box lt" style="width:380px;text-align:center">
      <p style="font-size:17px;line-height:1.5;margin:4px 0 16px">${text}</p>
      <button id="dOk" class="${danger?'red':''}">${okText}</button><button class="sec" id="dNo">Отмена</button></div></div>`;
    const done=v=>{ d.innerHTML=''; res(v); };
    document.getElementById('dOk').onclick=()=>done(true);
    document.getElementById('dNo').onclick=()=>done(false);
  });
}
function askText(title,value=''){
  return new Promise(res=>{
    const d=document.getElementById('dlg');
    d.innerHTML=`<div class="ov" style="z-index:60"><div class="box lt" style="width:380px">
      <h3 style="margin-top:0">${title}</h3><input class="inp" id="dIn" maxlength="16">
      <div style="text-align:center;margin-top:14px"><button id="dOk">Сохранить</button><button class="sec" id="dNo">Отмена</button></div></div></div>`;
    const inp=document.getElementById('dIn'); inp.value=value; inp.focus();
    const done=v=>{ d.innerHTML=''; res(v); };
    document.getElementById('dOk').onclick=()=>done(inp.value);
    document.getElementById('dNo').onclick=()=>done(null);
    inp.onkeydown=e=>{ if(e.key==='Enter') done(inp.value); if(e.key==='Escape') done(null); };
  });
}

function contentsOf(box){
  const list=box.pool.map(item), present=[0,1,2,3].filter(r=>box.odds[r]>0&&list.some(x=>x.r===r));
  const tot=present.reduce((s,r)=>s+box.odds[r],0);
  return list.map(x=>({x,chance:present.includes(x.r)?box.odds[x.r]/tot/list.filter(y=>y.r===x.r).length:0})).filter(e=>e.chance>0);
}

const DROP_TABLE=[['none',80],['card0',10],['box',5],['card1',4],['card2',0.8],['card3',0.2]];
function rollDrop(guaranteed){
  const tab=guaranteed?DROP_TABLE.filter(x=>x[0]!=='none'):DROP_TABLE;
  const tot=tab.reduce((s,x)=>s+x[1],0); let r=Math.random()*tot, k=tab[tab.length-1][0];
  for(const [n,w] of tab){ r-=w; if(r<0){ k=n; break; } }
  if(k==='none') return null;
  if(k==='box'){ const b=Math.random();
    return b<0.6?item('set_'+randOf(COLL_KEYS)):b<0.8?item('set_start'):b<0.9?item('set_elite'):item(randOf(['case_emp','case_lux','case_coll'])); }
  return randOf(CARDS.filter(x=>x.r===+k.slice(4)));
}

function cleanSlots(a){
  a.slots=a.slots||{};
  for(const k in a.slots){ const it=(a.items||[]).find(x=>x.uid===a.slots[k]), x=it&&item(it.id), c=BASE_CELLS[k];
    if(!x||x.type!=='card'||!c||x.coll!==collOf(c)) delete a.slots[k]; }
  return a.slots;
}

function autoEquip(a){
  const slots={};
  const cards=(a.items||[]).map(it=>({it,x:item(it.id)})).filter(c=>c.x.type==='card').sort((p,q)=>q.x.bonus-p.x.bonus);
  for(const k of COLL_KEYS){
    const cells=BASE_CELLS.map((c,i)=>[c,i]).filter(([c])=>['prop','rail','util'].includes(c.type)&&collOf(c)===k).sort((p,q)=>q[0].price-p[0].price);
    const cs=cards.filter(c=>c.x.coll===k);
    cells.forEach(([c,i],n)=>{ if(cs[n]) slots[i]=cs[n].it.uid; });
  }

}

function migrate(a){
  // v3: старые карточки «card_N» стали «card_N_0»
  if(a.v2&&!a.v3){ (a.items||[]).forEach(it=>{ if(/^card_\d+$/.test(it.id)) it.id+='_0'; }); a.v3=true; }

  if(!a.v4){ (a.items||[]).forEach(it=>{ const m=/^card_(\d+)_(\d)$/.exec(it.id); if(!m) return;

      it.id=(cand[0]||CARDS.find(x=>x.coll===k)||CARDS[0]).id; });
    a.v4=true; }
  if(a.v2) return;
  a.items=(a.inv||[]).filter(id=>id!=='tok_default').map(id=>({uid:newUid(),id}));

const today=()=>new Date().toLocaleDateString('sv');
function ensureTasks(a){
  const day=today();
  if(a.tasks&&a.tasks.day===day) return a.tasks;
  let h=0; for(const ch of day) h=(h*31+ch.charCodeAt(0))&0x7fffffff;
  const rnd=()=>(h=(h*1103515245+12345)&0x7fffffff)/0x7fffffff;
  const pool=TASK_POOL.slice().sort(()=>rnd()-0.5).slice(0,4);
  a.tasks={day,list:pool.map(t=>({id:t.id,prog:0,done:false}))};
  return a.tasks;
}

function track(p,id,amount=1){

  if(G&&G.online&&p.uid&&p.uid!==DB.session){ G.tp=G.tp||{}; const t=(G.tp[p.uid]=G.tp[p.uid]||{}); t[id]=(t[id]||0)+amount; return; }
  if(!p.acc||p.acc!==DB.session) return; const a=DB.accounts[p.acc]; if(!a) return; // задания считаются только своему аккаунту
  a.life=a.life||{}; a.life[id]=(a.life[id]||0)+amount; checkAch(a);
  const ts=ensureTasks(a), t=ts.list.find(x=>x.id===id&&!x.done); if(!t){ saveDB(); return; }
  const def=TASK_POOL.find(x=>x.id===id);
  t.prog=Math.min(def.goal,t.prog+amount);

  saveDB();
}

  switch(G.phase){

$('#actions').onclick=e=>{ const b=e.target.closest('button[data-a]'); if(!b||b.disabled) return; const x=b.dataset.a;
  if(NET.role==='guest'){ if(x==='credit'||x==='repay') netSend({kind:'cmd',name:x}); else answer(x); return; }
  if(x==='trade') openTrade(); else if(x==='credit') takeCredit(actor()); else if(x==='repay') repayCredit(actor()); else answer(x); };
function ask(phase,data){ G.phase=phase; askData=data||null; G.askData=askData; G.awaiting=true; return new Promise(r=>{ pending=r; startTimer(); render(); netPublishNow(); }); }
function answer(v){
  if(NET.role==='guest'){ // гость не ведёт игру — он отправляет свой выбор хозяину комнаты
    if(!canAct()) return; G.awaiting=false; netSend({kind:'answer',phase:G.phase,v:String(v)}); renderActions(); return;
  }
  stopTimer(); const r=pending; pending=null; G.phase='wait'; G.awaiting=false; G.askData=null; renderActions(); r&&r(v);
}

// ====== ТАЙМЕР ХОДА ======
// Срок хода хранится как время (G.tmDeadline), чтобы все игроки по сети видели одинаковый отсчёт.
let tmInt=null;
const tmRemain=()=>G&&G.tmDeadline?Math.max(0,Math.ceil((G.tmDeadline-Date.now())/1000)):0;
function stopTimer(){ if(tmInt){ clearInterval(tmInt); tmInt=null; } if(G) G.tmDeadline=0; }
function startTimer(){
  stopTimer();
  const t=OPT().timer; if(!t||!G||actor().bot) return;
  G.tmDeadline=Date.now()+t*1000;
  tmInt=setInterval(()=>{ if(G&&G.tmDeadline&&Date.now()>=G.tmDeadline){ stopTimer(); onTimeout(); } },500);
}
setInterval(()=>{ const el=document.getElementById('tmv'); if(el) el.textContent=tmRemain(); },500);
function onTimeout(){
  if(!pending||!G) return;
  const a=actor(), ad=G.askData||askData;
  log(`⏱ Время ${pn(a)} вышло — ход делается автоматически`);
  if(!isRemote(a)&&($('#tov')||$('#ov')||$('#ppov'))) closeModal();
  const v={roll:'roll',jail:'roll',buy:'skip',end:'end',debt:G.debt&&a.money>=G.debt.amt?'pay':'give',
    move:String(ad&&ad.opts?ad.opts[0]:''),pick:'-1'}[G.phase]||'end';
  answer(v);
}

// ====== КАРТОЧКА КЛЕТКИ ======
function canManage(i){
  if(!canAct()) return false;
  const a=actor(); return G.cells[i].owner===a.id&&['roll','end','debt','jail'].includes(G.phase);
}
// действие с клеткой: build | sell | mort | unmort (общая функция для местного игрока и для команд по сети)
function cellAction(a,i,m){
  const c=CELLS[i], s=G.cells[i]; if(s.owner!==a.id) return;
  if(m==='build'&&canBuild(i)) doBuild(a,i);
  if(m==='sell'&&canSell(i)){ a.money+=c.house/2; s.level--; log(`${pn(a)} продаёт филиал в ${cn(i)}`); }
  if(m==='mort'&&canMortgage(i)){ a.money+=c.price/2; s.mort=true; s.mortR=G.round||1; log(`${pn(a)} закладывает ${cn(i)} и получает ${fmt(c.price/2)}`); }
  if(m==='unmort'&&s.mort&&a.money>=unmortCost(i)){ a.money-=unmortCost(i); s.mort=false; log(`${pn(a)} выкупает ${cn(i)}`); }
}
function canBuild(i){
  const c=CELLS[i],s=G.cells[i],a=actor();
  if(c.type!=='prop'||G.phase==='debt'||s.owner!==a.id||s.mort||s.level>=5||a.money<c.house) return false;
  if(M().noMono) return true;
  if(!ownsGroup(a.id,c.g)) return false;
  const gc=groupCells(c.g); if(gc.some(j=>G.cells[j].mort)) return false;
  return s.level===Math.min(...gc.map(j=>G.cells[j].level));
}
function canSell(i){ const c=CELLS[i],s=G.cells[i]; if(c.type!=='prop'||!s.level) return false; if(M().noMono) return true; return s.level===Math.max(...groupCells(c.g).map(j=>G.cells[j].level)); }
function canMortgage(i){ const c=CELLS[i],s=G.cells[i]; if(s.mort) return false; if(c.type!=='prop') return true; if(M().noMono) return !s.level; return groupCells(c.g).every(j=>!G.cells[j].level); }
function doBuild(p,i){ const c=CELLS[i],s=G.cells[i]; p.money-=c.house; s.level++; log(`${pn(p)} строит филиал в ${cn(i)}${s.level===5?' — теперь это небоскрёб 🏨':''}`); track(p,'build'); }
function openCard(i){

  const col=c.g?GROUPS[c.g].c:'#4a5163';

      <tr><td>Цена</td><td>${fmt(c.price)}</td></tr><tr><td>Залог / выкуп</td><td>${fmt(c.price/2)} / ${fmt(unmortCost(i))}</td></tr></table>`;

      <tr><td>Цена</td><td>${fmt(c.price)}</td></tr><tr><td>Залог / выкуп</td><td>${fmt(c.price/2)} / ${fmt(unmortCost(i))}</td></tr></table>`;
  } else {

function closeModal(){ $('#modal').innerHTML=''; }

// ====== ИГРОВАЯ ЛОГИКА ======
// Третий кубик (режимы с third): появляется, когда кто-то впервые прошёл круг.
// Грани: 1–6 и 🚂 поезд. Возвращает [a,b,c], где c = 0 (кубика ещё нет), 1..6 или 'T' (поезд).
const DIE='⚀⚁⚂⚃⚄⚅';
const face3=c=>c==='T'?'🚂':DIE[c-1];
const roll3=()=>{ const v=Math.random()*7|0; return v===6?'T':v+1; };
async function rollDice(p){
  const third=!!M().third&&!!G.speedOn;
  for(let k=0;k<7;k++){ $('#dice').innerHTML=DIE[Math.random()*6|0]+DIE[Math.random()*6|0]+(third?`<span class="d3">${face3(roll3())}</span>`:''); await sleep(60); }
  const a=1+(Math.random()*6|0), b=1+(Math.random()*6|0), c=third?roll3():0;
  $('#dice').innerHTML=G.diceHtml=DIE[a-1]+DIE[b-1]+(third?`<span class="d3">${face3(c)}</span>`:'');
  G.lastDice=a+b+(c==='T'?0:c);
  log(`${pn(p)} выбрасывает ${a}:${b}${third?' и '+(c==='T'?'🚂 поезд':c):''}${a===b&&b===c?' — ТРОЙКА!':a===b?' — дубль!':''}`);
  if(a===b) track(p,'dbl');
  return [a,b,c];
}
// Куда идти после броска. Возвращает {steps} или {target}.
async function chooseMove(p,a,b,c){
  if(c==='T'){ // поезд: сумма двух кубиков или любой из них
    const opts=[...new Set([a+b,a,b])];
    let steps;
    if(p.bot) steps=botPickSteps(p,opts);
    else steps=+(await ask('move',{opts}));
    if(!opts.includes(steps)) steps=opts[0];
    log(`🚂 ${pn(p)} выбирает идти на ${steps}`);
    return {steps};
  }
  if(c&&a===b&&b===c){ // тройка: любая клетка
    let t;
    if(p.bot) t=botPickCell(p);
    else t=+(await ask('pick'));
    if(!(t>=0&&t<40)) t=(p.pos+a+b+c)%40;
    log(`🎯 ${pn(p)} выбирает клетку ${cn(t)}`);
    return {target:t};
  }
  return {steps:a+b+(c||0)};
}
// бот: клетка, которую выгоднее всего занять/пройти
function cellScore(p,i){
  const c=CELLS[i], s=G.cells[i];
  if(c.type==='gojail') return -1000;
  if(isOwnable(c)){
    if(s.owner<0) return p.money>=c.price?c.price/100+(c.g&&groupCells(c.g).filter(j=>j!==i).every(j=>G.cells[j].owner===p.id)?50:0):1;
    if(s.owner===p.id) return 5;
    return s.mort?4:-calcRent(i,G.lastDice)/50;
  }
  if(c.type==='tax') return -c.amount/100;
  if(c.type==='start') return 10;
  return 2;
}
function botPickSteps(p,opts){ return opts.slice().sort((x,y)=>cellScore(p,(p.pos+y)%40)-cellScore(p,(p.pos+x)%40))[0]; }
function botPickCell(p){ let best=0,bs=-1e9; for(let i=0;i<40;i++){ const sc=cellScore(p,i); if(sc>bs){ bs=sc; best=i; } } return best; }
async function move(p,n){
  for(let k=0;k<n;k++){
    p.pos=(p.pos+1)%40;
    if(p.pos===0){ p.money+=salary(); log(`${pn(p)} проходит Старт и получает ${fmt(salary())}`); track(p,'start');
      if(M().third&&!G.speedOn){ G.speedOn=true; log(`⚡ ${pn(p)} первым прошёл круг — теперь все бросают <b>третий кубик</b> (1–6 или 🚂 поезд)!`); } }
    render(); await sleep(110);
  }
}
async function moveTo(p,t){ await move(p,(t-p.pos+40)%40); }
function sendJail(p){ p.pos=10; p.inJail=true; p.jailTries=0; p.dbl=0; log(`${pn(p)} отправляется в тюрьму 🚔`); render(); }

async function land(p,dice){
  const i=p.pos, c=CELLS[i], s=G.cells[i];
  render();
  if(isOwnable(c)){
    if(s.owner<0){
      if(p.money>=c.price){
        const buy=p.bot?botWantsBuy(p,i):(await ask('buy',{i}))==='buy';
        if(p.out) return;
        if(buy){ p.money-=c.price; s.owner=p.id; log(`${pn(p)} покупает ${cn(i)} за ${fmt(c.price)}`); track(p,'buy'); }
        else { log(`${pn(p)} отказывается покупать ${cn(i)}`); if(OPT().auction) await auction(i,p); }
      } else { log(`${pn(p)} не хватает денег на ${cn(i)}`); if(OPT().auction) await auction(i,p); }
    } else if(s.owner!==p.id){
      if(s.mort) log(`${pn(p)} попадает на ${cn(i)} — компания заложена, платить не нужно`);
      else { const o=G.players[s.owner], bon=cellBonus(o,i), r=Math.round(calcRent(i,dice)*(1+bon/100)/10)*10;
        log(`${pn(p)} платит ${pn(o)} аренду ${fmt(r)} за ${cn(i)}${bon?` <span style="color:#ffb627">(+${bon}% карточка)</span>`:''}`); await pay(p,r,o.id); track(o,'rent',r); }
    }
  } else if(c.type==='tax'){ log(`${pn(p)} платит ${c.name.toLowerCase()} ${fmt(c.amount)}`); await pay(p,c.amount,-1); }
  else if(c.type==='chance') await chance(p);
  else if(c.type==='casino') await casino(p);
  else if(c.type==='gojail') sendJail(p);
  render();
}

// ====== АУКЦИОН ======
async function auction(i,decliner){
  const c=CELLS[i], s=G.cells[i];
  let price=c.price, leader=null;
  let active=G.players.filter(p=>!p.out&&p!==decliner&&p.money>=price);
  if(!active.length){ log(`🔨 Аукцион за ${cn(i)} не состоялся — ни у кого нет ${fmt(price)}`); return; }
  log(`🔨 Аукцион за ${cn(i)}! Стартовая цена ${fmt(price)}`);
  const step=()=>Math.max(100,Math.round(price*0.1/100)*100);
  while(true){
    const others=active.filter(p=>p!==leader);
    if(!others.length) break;
    for(const p of others){
      if(active.length===1&&active[0]===leader) break;
      const next=leader?price+step():price;
      const yes=p.money>=next&&(p.bot?(await sleep(250),botBid(p,i,next)):await askBid(p,i,next,leader,price));
      if(yes){ leader=p; price=next; log(`🔨 ${pn(p)} ставит ${fmt(price)}`); }
      else { active=active.filter(x=>x!==p); log(`🔨 ${pn(p)} пасует`); }
      render();
    }
  }
  if(leader){ leader.money-=price; s.owner=leader.id; log(`🔨 ${pn(leader)} выигрывает аукцион и покупает ${cn(i)} за ${fmt(price)}`); track(leader,'buy'); }
  else log(`🔨 Никто не купил ${cn(i)}`);
  render();
}
function botBid(p,i,next){
  const c=CELLS[i];
  const completes=c.type==='prop'&&groupCells(c.g).filter(j=>j!==i).every(j=>G.cells[j].owner===p.id);
  return next<=c.price*(completes?1.9:1.2)&&p.money-next>=800;
}
// Вопрос конкретному игроку: если он играет по сети с другого компьютера — спрашиваем через базу
function askBid(p,i,next,leader,cur){
  if(isRemote(p)) return askRemote(p,'bid',{i,next,leader:leader?leader.id:null,cur},false).then(v=>!!v);
  return askBidUI(p,i,next,leader,cur);
}
function askBidUI(p,i,next,leader,cur){
  return new Promise(res=>{
    const c=CELLS[i];
    $('#modal').innerHTML=`<div class="ov"><div class="box" style="width:420px;text-align:center">
      <h2>🔨 Аукцион</h2><div style="font-size:40px">${c.ic}</div><h3 style="margin:4px 0">${c.name}</h3>
      <p>${leader?`Сейчас лидирует ${pn(leader)} со ставкой <b>${fmt(cur)}</b>`:`Цена компании: <b>${fmt(c.price)}</b>`}</p>
      <p>${pn(p)}, у вас ${fmt(p.money)}. Ваша ставка?</p>
      <button id="bYes">Поставить ${fmt(next)}</button><button class="sec" id="bNo">Пас</button></div></div>`;
    $('#bYes').onclick=()=>{ closeModal(); res(true); };
    $('#bNo').onclick=()=>{ closeModal(); res(false); };
  });
}

        <button id="cPlay" ${nums.length&&p.money>=bet?'':'disabled'}>Играть</button><button class="sec" id="cNo">Не играть</button></div></div>`;
      document.querySelectorAll('[data-bet]').forEach(b=>b.onclick=()=>{ bet=+b.dataset.bet; draw(); });
      document.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{ const n=+b.dataset.n; nums=nums.includes(n)?nums.filter(x=>x!==n):nums.length<3?[...nums,n]:nums; draw(); });
      $('#cPlay').onclick=()=>{ closeModal(); res({amt:bet,nums}); };
      $('#cNo').onclick=()=>{ closeModal(); res(null); };

}
async function casino(p){

// ====== КРЕДИТ БАНКА И СРОК ЗАЛОГА ======
const OPT=()=>(G&&G.opt)||{};
const CREDIT=5000, CREDIT_BACK=6000, CREDIT_ROUNDS=15, MORT_ROUNDS=15;
const creditLeft=p=>p.credit?Math.max(0,p.credit.due-(G.round||1)):0;
function takeCredit(p){ if(!OPT().credit||p.credit||p.creditUsed) return; p.money+=CREDIT; p.credit={due:(G.round||1)+CREDIT_ROUNDS}; p.creditUsed=true; log(`🏦 ${pn(p)} берёт у Банка в кредит ${fmt(CREDIT)} на ${CREDIT_ROUNDS} кругов (вернуть ${fmt(CREDIT_BACK)})`); render(); }
function repayCredit(p){ if(!p.credit||p.money<CREDIT_BACK) return; p.money-=CREDIT_BACK; p.credit=null; log(`🏦 ${pn(p)} возвращает кредит Банку`); track(p,'repay'); render(); }
function checkMortgages(){
  if(!OPT().mortLimit) return;
  G.cells.forEach((s,i)=>{ if(s.mort&&s.owner>=0&&(G.round-(s.mortR||G.round))>=MORT_ROUNDS){
    log(`🔒 Срок залога ${cn(i)} истёк — компания уходит Банку`); s.owner=-1; s.mort=false; s.level=0; } });
}
const mortLeft=s=>OPT().mortLimit?Math.max(0,MORT_ROUNDS-((G.round||1)-(s.mortR||G.round||1))):'';
async function chance(p){
  const k=CHANCE[Math.random()*CHANCE.length|0];
  log(`${pn(p)} — «Шанс»: ${k.t}`);
  await sleep(300);
  if(k.money>0) p.money+=k.money;
  if(k.money<0){ await pay(p,-k.money,-1); if(!p.out) track(p,'chancepay',-k.money); }
  if(k.card) p.jailCards++;
  if(k.jail) sendJail(p);
  if(k.go!==undefined){ const t=CELLS.findIndex(c=>c.name===k.go); await moveTo(p,t); if(t!==0) await land(p,G.lastDice); }
  if(k.back){ p.pos=(p.pos-k.back+40)%40; render(); await land(p,G.lastDice); }
  if(k.each){ for(const o of G.players) if(o!==p&&!o.out&&!p.out) await pay(o,k.each,p.id); }
  if(k.perLevel){ const t=G.cells.reduce((sum,s)=>sum+(s.owner===p.id?s.level:0),0)*k.perLevel; if(t){ log(`${pn(p)} платит за ремонт ${fmt(t)}`); await pay(p,t,-1); if(!p.out) track(p,'chancepay',t); } }
  render();
}
async function pay(p,amt,to){
  if(p.money<amt){
    if(p.bot) autoLiquidate(p,amt);
    else { G.debt={pid:p.id,amt,to}; const r=await ask('debt'); G.debt=null; if(r!=='pay'){ bankrupt(p,to); return; } }
    if(p.money<amt){ bankrupt(p,to); return; }
  }
  p.money-=amt; if(to>=0) G.players[to].money+=amt; render();
}
function bankrupt(p,to){
  if(p.out) return;
  const cred=to>=0?G.players[to]:null;
  G.cells.forEach((s,i)=>{ if(s.owner===p.id&&s.level){ p.money+=s.level*CELLS[i].house/2; s.level=0; } });
  if(cred) cred.money+=Math.max(0,p.money);
  G.cells.forEach(s=>{ if(s.owner===p.id){ if(cred) s.owner=cred.id; else { s.owner=-1; s.mort=false; } } });
  p.money=0; p.out=true; p.inJail=false; p.credit=null;
  log(`💥 ${pn(p)} объявляет банкротство${cred?' — всё имущество переходит к '+pn(cred):''}`);
  render();
}

// ====== ОБМЕН ======
// t = {from, to, give:[клетки from→to], get:[клетки to→from], mFrom, mTo}
// компании можно менять вместе с филиалами — филиалы переходят к новому владельцу
const canTradeCell=(i,pid)=>isOwnable(CELLS[i])&&G.cells[i].owner===pid;
function tradeText(t){
  const A=G.players[t.from],B=G.players[t.to];
  const side=(cells,m)=>{ const parts=cells.map(i=>`${CELLS[i].ic} ${CELLS[i].name}${G.cells[i].level?' '+'★'.repeat(G.cells[i].level):''}${G.cells[i].mort?' 🔒':''}`); if(m) parts.push('💰 '+fmt(m)); return parts.length?parts.join(', '):'ничего'; };
  return `${pn(A)} отдаёт: ${side(t.give,t.mFrom)}<br>${pn(B)} отдаёт: ${side(t.get,t.mTo)}`;
}
function tradeValid(t){
  const A=G.players[t.from],B=G.players[t.to];
  return !A.out&&!B.out&&t.mFrom<=A.money&&t.mTo<=B.money&&t.give.every(i=>canTradeCell(i,t.from))&&t.get.every(i=>canTradeCell(i,t.to))&&(t.give.length+t.get.length+t.mFrom+t.mTo>0);
}
function execTrade(t){
  const A=G.players[t.from],B=G.players[t.to];
  t.give.forEach(i=>G.cells[i].owner=B.id); t.get.forEach(i=>G.cells[i].owner=A.id);
  A.money+=t.mTo-t.mFrom; B.money+=t.mFrom-t.mTo;
  log(`🤝 Обмен состоялся!<br>${tradeText(t)}`.replace(/отдаёт/g,'отдал(а)'));
  track(A,'trade'); track(B,'trade');
  render();
}
function botScore(pid,t){
  const recvCells=t.to===pid?t.give:t.get, loseCells=t.to===pid?t.get:t.give;
  const recvMoney=t.to===pid?t.mFrom:t.mTo, loseMoney=t.to===pid?t.mTo:t.mFrom;
  const other=t.to===pid?t.from:t.to;
  const after=i=>t.give.includes(i)?t.to:t.get.includes(i)?t.from:G.cells[i].owner;
  const fullAfter=(who,g)=>groupCells(g).every(i=>after(i)===who);
  const val=i=>CELLS[i].price*(G.cells[i].mort?0.45:1)+G.cells[i].level*(CELLS[i].house||0);
  let s=recvMoney-loseMoney;
  for(const i of recvCells){ const c=CELLS[i]; s+=val(i); if(c.g&&fullAfter(pid,c.g)&&!ownsGroup(pid,c.g)) s+=c.price*1.5; }
  for(const i of loseCells){ const c=CELLS[i]; s-=val(i)*1.1; if(c.g&&ownsGroup(pid,c.g)) s-=c.price*2; if(c.g&&fullAfter(other,c.g)&&!ownsGroup(other,c.g)) s-=c.price*1.0; }
  return s;
}
function confirmTrade(t){
  const B=G.players[t.to];
  if(isRemote(B)) return askRemote(B,'trade',{t},false).then(v=>!!v);
  return confirmTradeUI(t);
}
function confirmTradeUI(t){

}
let tradePartner=null;
function openTrade(partnerId){

    </div>

  };
}
// Предложить обмен: бот решает сам, живой игрок — в окне подтверждения (у себя или по сети)
async function proposeTrade(t){
  const A=G.players[t.from], B=G.players[t.to];
  if(!A||!B||!tradeValid(t)) return {ok:false,msg:'Сделка невозможна.'};
  const ok=B.bot?botScore(B.id,t)>0:await confirmTrade(t);
  if(ok&&tradeValid(t)){ execTrade(t); return {ok:true}; }
  log(`${pn(B)} отклоняет предложение обмена от ${pn(A)}`); render();
  return {ok:false,msg:`${pn(B)} отказывается. Предложите больше.`};
}

// ====== БОТЫ ======
async function botTrade(p){
  if(!G.declined) G.declined={};
  for(const g in GROUPS){
    const gc=groupCells(g), mine=gc.filter(i=>G.cells[i].owner===p.id);
    if(mine.length!==gc.length-1) continue;
    const j=gc.find(i=>G.cells[i].owner!==p.id), s=G.cells[j];
    if(s.owner<0||G.players[s.owner].out||!canTradeCell(j,s.owner)) continue;
    const key=p.id+'-'+j; if(G.declined[key]&&G.turnNo-G.declined[key]<12) continue;
    const base=CELLS[j].price*(s.mort?0.5:1);
    const offer=Math.round(base*(p.money>base*3?2.4:1.7)/100)*100;
    if(p.money-offer<1000) continue;
    const t={from:p.id,to:s.owner,give:[],get:[j],mFrom:offer,mTo:0};
    const o=G.players[s.owner];
    const ok=o.bot?botScore(o.id,t)>0:await confirmTrade(t);
    if(ok&&tradeValid(t)) execTrade(t);
    else { G.declined[key]=G.turnNo||0; log(`${pn(o)} отклоняет предложение обмена от ${pn(p)}`); }
    return;
  }
}
function botWantsBuy(p,i){
  const c=CELLS[i];
  const completes=c.type==='prop'&&groupCells(c.g).filter(j=>j!==i).every(j=>G.cells[j].owner===p.id);
  return p.money-c.price>=(completes?300:1500);
}
function autoLiquidate(p,amt){
  while(p.money<amt){
    const withLv=cellsOf(p.id).filter(i=>canSell(i)).sort((a,b)=>G.cells[b].level-G.cells[a].level);
    if(withLv.length){ const i=withLv[0]; G.cells[i].level--; p.money+=CELLS[i].house/2; log(`${pn(p)} продаёт филиал в ${cn(i)}`); continue; }
    const m=cellsOf(p.id).filter(i=>canMortgage(i)).sort((a,b)=>CELLS[a].price-CELLS[b].price);
    if(OPT().credit&&!p.creditUsed){ takeCredit(p); continue; }
    if(m.length){ const i=m[0]; G.cells[i].mort=true; G.cells[i].mortR=G.round||1; p.money+=CELLS[i].price/2; log(`${pn(p)} закладывает ${cn(i)}`); continue; }
    break;
  }
}
async function botManage(p){
  if(p.credit&&p.money>CREDIT_BACK+6000) repayCredit(p);
  if(Math.random()<0.6) await botTrade(p);
  for(const i of cellsOf(p.id).filter(i=>G.cells[i].mort))
    if(p.money-unmortCost(i)>5000){ p.money-=unmortCost(i); G.cells[i].mort=false; log(`${pn(p)} выкупает ${cn(i)}`); }
  let built=true;
  while(built){
    built=false;
    if(M().noMono){
      const i=cellsOf(p.id).filter(i=>CELLS[i].type==='prop'&&!G.cells[i].mort&&G.cells[i].level<5).sort((a,b)=>G.cells[a].level-G.cells[b].level||CELLS[b].price-CELLS[a].price)[0];
      if(i!==undefined&&p.money-CELLS[i].house>=3500){ doBuild(p,i); built=true; }
      continue;
    }
    for(const g in GROUPS){
      if(!ownsGroup(p.id,g)) continue;
      const gc=groupCells(g); if(gc.some(j=>G.cells[j].mort)) continue;
      const i=gc.slice().sort((a,b)=>G.cells[a].level-G.cells[b].level)[0];
      if(G.cells[i].level<5&&p.money-CELLS[i].house>=2500){ doBuild(p,i); built=true; }
    }
  }
  render();
}

// ====== ХОДЫ ======
async function playTurn(){ try{ await turnInner(); }catch(e){ if(e!=='stale') console.error(e); } }
async function turnInner(){
  if(G.over) return;
  const myGame=gameId;
  save();
  const p=curP(); p.dbl=0; G.turnNo=(G.turnNo||0)+1; p.turns=(p.turns||0)+1; // p.turns — сколько своих ходов сделал игрок
  log(`— Ход ${pn(p)} —`);
  render();
  if(p.credit&&creditLeft(p)<=0){
    log(`🏦 Срок кредита ${pn(p)} истёк — Банк списывает ${fmt(CREDIT_BACK)}`);
    p.credit=null; await pay(p,CREDIT_BACK,-1); track(p,'repay');
  }
  let again=true;
  while(again&&!p.out){
    again=false;
    if(p.inJail){
      const choice=p.bot?(await sleep(700),p.jailCards?'card':(p.money>4000?'pay':'roll')):await ask('jail');
      if(p.out) break;
      if(choice==='card'){ p.jailCards--; p.inJail=false; log(`${pn(p)} использует карту 🎫 и выходит из тюрьмы`); }
      else if(choice==='pay'){ log(`${pn(p)} платит ${fmt(JAIL_FINE)} и выходит из тюрьмы`); await pay(p,JAIL_FINE,-1); if(p.out) break; p.inJail=false; }
      else {
        const [a,b,c]=await rollDice(p);
        if(a===b){ p.inJail=false; log(`${pn(p)} выходит из тюрьмы по дублю`); const mv=await chooseMove(p,a,b,c); if(p.out) break;
          if(mv.target!==undefined) await moveTo(p,mv.target); else await move(p,mv.steps); await land(p,G.lastDice); }
        else if(++p.jailTries>=3){ log(`${pn(p)} не смог выбросить дубль за 3 попытки и платит ${fmt(JAIL_FINE)}`); await pay(p,JAIL_FINE,-1); if(p.out) break; p.inJail=false;
          const mv=await chooseMove(p,a,b,c); if(p.out) break;
          if(mv.target!==undefined) await moveTo(p,mv.target); else await move(p,mv.steps); await land(p,G.lastDice); }
        else log(`${pn(p)} остаётся в тюрьме`);
        break;
      }
    }
    if(p.bot) await sleep(650); else await ask('roll');
    if(p.out) break;
    const [a,b,c]=await rollDice(p);
    if(a===b){ if(++p.dbl>=3){ log(`${pn(p)} выбрасывает третий дубль подряд!`); sendJail(p); break; } again=true; }
    const mv=await chooseMove(p,a,b,c);
    if(p.out) break;
    if(mv.target!==undefined) await moveTo(p,mv.target); else await move(p,mv.steps);
    await land(p,G.lastDice);
    if(p.inJail) again=false;
    if(again&&!p.out) log(`${pn(p)} ходит ещё раз (дубль)`);
  }
  if(!p.out){ if(p.bot){ await botManage(p); await sleep(500); } else await ask('end'); }
  if(myGame===gameId) nextPlayer();
}
function nextPlayer(){
  const alive=G.players.filter(p=>!p.out);
  if(alive.length<=1) return finishGame(alive[0]);
  const prev=G.cur;
  do{ G.cur=(G.cur+1)%G.players.length; }while(G.players[G.cur].out);
  if(G.cur<=prev){
    G.round=(G.round||1)+1;
    checkMortgages();
    const lim=M().rounds;
    if(lim){
      if(G.round>lim){ const w=alive.slice().sort((a,b)=>netWorth(b)-netWorth(a))[0]; log(`⏱️ Все ${lim} кругов сыграны! Самый богатый — ${pn(w)} (${fmt(netWorth(w))})`); return finishGame(w); }
      log(`— Круг ${G.round} из ${lim} —`);
    }
  }
  setTimeout(playTurn,50);
}
// Итоги: награды считает тот, кто ведёт игру (офлайн — этот браузер, по сети — хозяин комнаты),
// а начисляет себе каждый игрок сам (applyMyResult) — менять чужие профили правила базы не дают.
function finishGame(w){
  G.over=true; if(!G.online) localStorage.removeItem(SAVE_KEY);
  stopTimer();
  const ranked=!!M().ranked;
  G.winner=w?w.id:-1;
  G.results=G.players.filter(p=>p.uid||p.acc).map(p=>{
    const win=p===w, a=p.acc&&DB.accounts[p.acc];
    const vip=a?isVip(a):!!p.vip;
    const rd=ranked?(win?25:-15):0;
    if(p.noReward) return {uid:p.uid||p.acc,pid:p.id,win:false,xp:0,rd,drop:null,tp:null,noReward:true};
    // VIP в рейтинговой игре получает предмет гарантированно, остальные — по таблице выпадения
    const it=rollDrop(vip&&ranked);
    return {uid:p.uid||p.acc,pid:p.id,win,xp:50+(win?150:0),rd,drop:it?it.id:null,tp:(G.tp&&p.uid&&G.tp[p.uid])||null};
  });
  render(); netPublishNow();
  showWinner(w,applyMyResult());
}
// начислить себе свою награду (один раз) и вернуть строки итогов для окна победителя
function applyMyResult(){
  const lines=(G.results||[]).map(r=>{ const p=G.players[r.pid]; const it=r.drop&&item(r.drop);
    if(r.noReward) return `${pn(p)}: 🏳️ сдался в первые ${EARLY_SURRENDER} ходов — без награды${r.rd?` · рейтинг ${r.rd}`:''}`;
    return `${pn(p)}: +${r.xp} XP${r.rd?` · рейтинг ${r.rd>0?'+':''}${r.rd}`:''}<br>${it?`🎁 Выпало: ${it.ic} <b>${esc(it.n)}</b> <span style="color:${RAR[it.r][1]}">${RAR[it.r][0]}</span> · ${fmtC(it.val)}`:'<span class="muted">Предмет в этот раз не выпал</span>'}`; });
  const r=(G.results||[]).find(x=>x.uid===DB.session), a=me();
  const key=G.online?G.rid:'local'+G.turnNo+'_'+(G.log.length);
  if(r&&a&&a.lastGame!==key){
    a.lastGame=key; a.matches++; if(r.win) a.wins++; a.xp+=r.xp;
    if(r.noReward){ if(r.rd) a.rating=Math.max(0,(a.rating||1000)+r.rd);
      a.history=[{t:Date.now(),mode:G.mode,win:false,n:G.players.length},...(a.history||[])].slice(0,20); checkAch(a); saveDB(); return lines; }
    if(r.rd) a.rating=Math.max(0,(a.rating||1000)+r.rd);
    if(r.drop) addItem(a,r.drop);
    a.history=[{t:Date.now(),mode:G.mode,win:r.win,n:G.players.length},...(a.history||[])].slice(0,20);
    const meP={acc:DB.session};
    const G0=G; G=null; // чтобы track() не писал в журнал партии и не считал это игрой по сети
    if(r.tp) Object.entries(r.tp).forEach(([id,v])=>track(meP,id,v));
    if(r.win) track(meP,'win'); track(meP,'play');
    G=G0; checkAch(a); saveDB();
  }
  return lines;
}

// ====== ИГРА ПО СЕТИ ======
const ACT_EXTRA={}; // действия лобби — подключаются к ACT ниже
// Комната (rooms/{id}): хозяин ведёт партию у себя и публикует её состояние (поле state),
// гости показывают это состояние и отправляют свои действия в rooms/{id}/actions.
const NET={rid:null,room:null,role:null,started:false,unsub:null,unsubAct:null,seen:new Set(),pubT:null,rev:0,resolvers:{},handledAsk:null,startedAt:0,endShown:false};
const isRemote=p=>!!(NET.role==='host'&&G&&G.online&&p&&!p.bot&&p.uid&&p.uid!==DB.session);
const roomRef=id=>FB.db.collection('rooms').doc(id||NET.rid);
function netPublish(){ if(NET.role!=='host'||!G||!G.online||NET.pubT) return; NET.pubT=setTimeout(netPublishNow,700); }
function netPublishNow(){
  clearTimeout(NET.pubT); NET.pubT=null;
  if(NET.role!=='host'||!G||!G.online||!FB) return;
  const snap={...G,log:G.log.slice(-80),awaiting:!!pending,askData:askData||null};
  NET.rev++;
  roomRef(G.rid).update({state:JSON.stringify(snap),rev:NET.rev,status:G.over?'over':'playing'}).catch(e=>console.error('publish',e));
}
function netSend(o){ if(!FB||!NET.rid) return; roomRef().collection('actions').add({...o,uid:DB.session,at:Date.now()}).catch(e=>toast('Не отправилось: '+(e.message||e))); }
// спросить игрока на другом компьютере; если не ответит за 40 сек — ответ по умолчанию
function askRemote(p,kind,data,def){
  const id=Math.random().toString(36).slice(2,10);
  G.remoteAsk={id,pid:p.id,kind,data}; netPublishNow();
  return new Promise(res=>{
    const done=v=>{ if(!NET.resolvers[id]) return; delete NET.resolvers[id]; if(G&&G.remoteAsk&&G.remoteAsk.id===id) G.remoteAsk=null; res(v); };
    NET.resolvers[id]=done; setTimeout(()=>done(def),40000);
  });
}
// хозяин: обработка действий гостей
function listenActions(){
  if(NET.unsubAct) NET.unsubAct();
  NET.startedAt=Date.now();
  NET.unsubAct=roomRef().collection('actions').onSnapshot(s=>s.docChanges().forEach(ch=>{
    if(ch.type!=='added'||NET.seen.has(ch.doc.id)) return; NET.seen.add(ch.doc.id);
    const a=ch.doc.data(); if((a.at||0)<NET.startedAt-3000) return; // старые действия (до перезагрузки) пропускаем
    try{ hostHandleAction(a); }catch(e){ console.error(e); }
  }));
}
function hostHandleAction(a){
  if(!G||G.over) return;
  const p=G.players.find(x=>x.uid===a.uid); if(!p) return;
  if(a.kind==='answer'){ if(pending&&actor()===p&&G.phase===a.phase) answer(a.v); return; }
  if(a.kind==='reply'){ const r=NET.resolvers[a.askId]; if(r&&G.remoteAsk&&G.remoteAsk.id===a.askId&&G.remoteAsk.pid===p.id) r(a.v); return; }
  if(a.kind!=='cmd') return;
  const myTurn=pending&&actor()===p;
  if(a.name==='surrender') return doSurrender(p);
  if(!myTurn) return;
  if(a.name==='credit') takeCredit(p);
  if(a.name==='repay') repayCredit(p);
  if(a.name==='cell'&&['roll','end','debt','jail'].includes(G.phase)&&G.cells[a.i]) { cellAction(p,+a.i,a.m); render(); }
  if(a.name==='trade'&&a.t&&a.t.from===p.id) proposeTrade(a.t);
}
// гость: ответить на вопрос хозяина (аукцион, казино, обмен)
async function handleRemoteAsk(ra){
  const p=G.players[ra.pid]; let v=null;
  if(ra.kind==='bid'){ const d=ra.data; v=await askBidUI(p,d.i,d.next,d.leader!=null?G.players[d.leader]:null,d.cur); }
  if(ra.kind==='casino') v=await casinoModalUI(p);
  if(ra.kind==='trade') v=await confirmTradeUI(ra.data.t);
  netSend({kind:'reply',askId:ra.id,v:v===undefined?null:v});
}
// подписаться на свою комнату
function watchRoom(rid){
  if(NET.rid===rid&&NET.unsub) return;
  leaveNet(false);
  NET.rid=rid;
  NET.unsub=roomRef(rid).onSnapshot(s=>{
    if(!s.exists){ const was=NET.started; leaveNet(false); if(was){ toast('Комната закрыта'); showLanding(); } else renderSite(); return; }
    const r={id:s.id,...s.data()}; NET.room=r;
    if(r.status==='waiting'){ if(PAGE==='games') renderSite(); return; }
    if(r.host===DB.session){ if(!NET.started) resumeHost(r); return; }
    applyGuestState(r);
  },e=>console.error('room',e));
}
function leaveNet(forget){
  if(NET.unsub) NET.unsub(); if(NET.unsubAct) NET.unsubAct();
  clearTimeout(NET.pubT);
  const wasHost=NET.role==='host', rid=NET.rid;
  Object.assign(NET,{rid:null,room:null,role:null,started:false,unsub:null,unsubAct:null,pubT:null,resolvers:{},handledAsk:null,endShown:false});
  if(G&&G.online){ gameId++; stopTimer(); pending=null; G=null; }
  // хозяин после конца игры удаляет комнату (гости уже получили итог)
  if(forget&&wasHost&&rid&&FB) roomRef(rid).delete().catch(()=>{});
}
// хозяин: запуск или продолжение партии (например, после перезагрузки страницы)
function resumeHost(r){
  if(!r.state){ return; }
  gameId++; pending=null; stopTimer();
  G=JSON.parse(r.state); applyLayout(G.layout);
  G.phase='wait'; G.awaiting=false; G.remoteAsk=null; G.askData=null;
  NET.role='host'; NET.started=true; NET.rev=r.rev||0;
  listenActions(); closeModal(); hideLanding(); renderLog(); render();
  if(G.over){ showWinner(G.players[G.winner],applyMyResult()); return; }
  log('🔄 Хозяин комнаты вернулся — продолжаем'); playTurn();
}
// гость: показать состояние партии от хозяина
function applyGuestState(r){
  if(!r.state) return;
  const ng=JSON.parse(r.state);
  const first=!NET.started;
  NET.role='guest'; NET.started=true;
  if(first||!G||JSON.stringify(ng.layout||null)!==JSON.stringify(G.layout||null)) applyLayout(ng.layout);
  G=ng; pending=null;
  if(first){ closeModal(); hideLanding(); }
  renderLog(); render();
  const ra=G.remoteAsk;
  if(ra&&G.players[ra.pid]&&G.players[ra.pid].uid===DB.session&&NET.handledAsk!==ra.id){ NET.handledAsk=ra.id; handleRemoteAsk(ra); }
  if(G.over&&!NET.endShown){ NET.endShown=true; showWinner(G.players[G.winner],applyMyResult()); }
}
// хозяин: начать партию в комнате
function startOnlineGame(r){
  pending=null; gameId++; stopTimer();
  const mode=MODES[r.mode]||MODES.classic;
  const layout=mode.shuffle?shuffleLayout():null;
  applyLayout(layout);
  const list=[...r.players.map(pl=>({...pl,bot:false})),...Array.from({length:r.bots||0},(_,k)=>({name:BOT_NAMES[k],bot:true}))];
  G={mode:r.mode,layout,round:1,online:true,rid:r.id,opt:{...r.opt,timer:90},

async function joinRoom(rid){
  try{
    await FB.db.runTransaction(async tx=>{
      const ref=roomRef(rid), s=await tx.get(ref); if(!s.exists) throw new Error('Комната уже закрыта');
      const r=s.data(); if(r.status!=='waiting') throw new Error('Игра уже началась');
      if(r.uids.includes(DB.session)) return;
      if(r.players.length+(r.bots||0)>=r.max) throw new Error('Мест нет');
      tx.update(ref,{players:[...r.players,myEntry()],uids:[...r.uids,DB.session]});
    });
    watchRoom(rid); toast('✔ Вы в комнате — ждём начала игры');
  }catch(e){ toast(e.code==='permission-denied'?'Эта игра только для друзей создателя':(e.message||String(e))); }
}
async function leaveRoom(rid){
  try{
    await FB.db.runTransaction(async tx=>{
      const ref=roomRef(rid), s=await tx.get(ref); if(!s.exists) return; const r=s.data();
      tx.update(ref,{players:r.players.filter(p=>p.uid!==DB.session),uids:r.uids.filter(x=>x!==DB.session)});
    });
  }catch(e){ toast('Ошибка: '+(e.message||e)); }
  leaveNet(false); renderSite();
}

  const mine=u.items.filter(it=>it.id===id), on=slotsOf(u,id);
  const rows=cells.map(([c,i])=>{
    const cur=u.slots[i]&&item(u.items.find(it=>it.uid===u.slots[i]).id);
    const here=cur&&cur.id===id;
    return `<div class="crow" style="border-left:5px solid ${c.g?GROUPS[c.g].c:COLLECTIONS[x.coll].c}">
      <span class="ci">${c.ic}</span><span class="cnm"><b>${esc(c.name)}</b><br><small class="muted">${cur?`надета: ${esc(cur.n)} (+${cur.bonus}%)`:'свободно'}</small></span>

  $('#modal').innerHTML=`<div class="ov" id="slov" style="z-index:55"><div class="box lt" style="width:520px"><button class="x" id="slx">✕</button>
    <div style="display:flex;gap:14px;align-items:center">${itemArt(x,110,80)}<div><h2 style="margin:0">${esc(x.n)}</h2>
      <div class="muted">+${x.bonus}% к аренде · коллекция «${COLLECTIONS[x.coll].n}» · у вас ${mine.length} шт., надето ${on.length}</div></div></div>
    <p style="line-height:1.5">Выберите компанию на поле. Когда в партии она ваша, за неё платят аренду на <b>+${x.bonus}%</b> больше. На одну компанию — одна карточка.</p>
    <div>${rows}</div></div></div>`;
  $('#slov').onclick=e=>{
    if(e.target.id==='slov'||e.target.id==='slx') return closeModal();
    const s=e.target.closest('[data-slot]'), us=e.target.closest('[data-unslot]');
    if(us){ delete u.slots[us.dataset.unslot]; saveDB(); renderSite(); showSlotModal(id); return; }
    if(s){ const cell=+s.dataset.slot;
      // свободный экземпляр этой карточки; если все надеты — переносим один с другой компании
      const used=new Set(Object.values(u.slots));
      let inst=mine.find(it=>!used.has(it.uid));
      if(!inst){ inst=mine[0]; for(const k in u.slots) if(u.slots[k]===inst.uid) delete u.slots[k]; }
      u.slots[cell]=inst.uid; saveDB(); toast(`✔ ${x.n} надета на ${BASE_CELLS[cell].name}`); renderSite(); showSlotModal(id); }
  };
}

      <div><span>В среднем выпадает</span><b>${fmtC(st.ev)}</b><small>${Math.round(st.ev/st.cost*100)}% от стоимости</small></div>
      <div><span>Шанс окупиться</span><b>${pct(st.win)}</b><small>проиграть — ${pct(1-st.win)}</small></div></div>
    <div style="max-height:46vh;overflow:auto;margin-top:12px">${list.map(e=>`<div class="crow" style="border-left:5px solid ${RAR[e.x.r][1]}">

function toast(msg){ const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),1800); }
function xpForLevel(L){ let xp=0,need=100; for(let l=1;l<L;l++){ xp+=need; need=100+(l+1)*25; } return xp; }
function admAcc(el){ if(!isAdminUser()) return null; const c=el.closest('.adm'); if(!c) return null; const a=(DB.allUsers||[]).find(x=>x.login===c.dataset.l); return a?{a,c}:null; }

function admDone(msg,a){

  else toast('✔ '+msg);

}

async function addFriend(nick){
  const u=me(), err=$('#fErr'); if(!u||!FB||!nick) return;
  if(nick===u.nick){ if(err) err.textContent='Нельзя добавить себя.'; return; }
  try{
    const s=await FB.db.collection('nicks').doc(nick).get();
    if(!s.exists){ if(err) err.textContent='Игрок с ником @'+nick+' не найден.'; return; }
    const uid=s.data().uid; await loadUser(uid);
    u.friends=u.friends||[]; if(!u.friends.includes(uid)) u.friends.push(uid);
    checkAch(u); saveDB(); toast('✔ Друг добавлен'); renderSite();
  }catch(e){ if(err) err.textContent='Ошибка: '+(e.message||e); }
}

// кнопка «на весь экран» (на iPhone браузер её может не поддерживать — тогда кнопка скрыта)
const fsOK=!!(document.documentElement.requestFullscreen||document.documentElement.webkitRequestFullscreen);
if(!fsOK) $('#fsBtn').style.display='none';
$('#fsBtn').onclick=()=>{
  const d=document, el=d.documentElement;
  if(d.fullscreenElement||d.webkitFullscreenElement) (d.exitFullscreen||d.webkitExitFullscreen).call(d);
  else (el.requestFullscreen||el.webkitRequestFullscreen).call(el).catch?.(()=>{});
};
buildBoard();
showLanding();
</script>
