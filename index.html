<style>
*{box-sizing:border-box}
:root{--bg:#1b1f2a;--fg:#eee;--pl:#2a2f3d;--ctr:#262b38;--bd:#11141b;--cell:#f4f1ea;--cellfg:#222;--corner:#e8e3d6;--logbg:#1e222d}
body{margin:0;font-family:"Segoe UI",system-ui,Arial,sans-serif;background:var(--bg);color:#eee;min-height:100vh}
#app{color:var(--fg)}
button{font:inherit;cursor:pointer;border:0;border-radius:8px;padding:9px 16px;background:#2ec4a0;color:#fff;font-weight:600;margin:3px}
button:hover{filter:brightness(1.08)}
button:disabled{opacity:.4;cursor:default;filter:none}
button.sec{background:#4a5163}
button.red{background:#e05252}
button.btn-o{background:#ff8a3d}
button.sm{padding:5px 12px;font-size:13px}
/* ===== Игра ===== */
#app{display:flex;gap:14px;padding:14px;justify-content:center;align-items:flex-start;flex-wrap:wrap}
#players{width:200px;display:flex;flex-direction:column;gap:10px}
.pl{background:var(--pl);border-radius:10px;padding:10px;text-align:center;border:2px solid transparent;transition:.2s}
.pl{cursor:pointer}
.pl:hover{filter:brightness(1.12)}
.pl.active{box-shadow:0 0 18px rgba(255,255,255,.18)}
.pl.open{border-radius:10px 10px 0 0}
.pl{position:relative}
.tmr{position:absolute;left:8px;top:8px;background:#0005;border-radius:20px;padding:3px 9px;font-weight:700;font-size:14px}
.pmenu{background:#e9ebf0;color:#262b38;border-radius:0 0 10px 10px;margin-top:-10px;overflow:hidden;font-size:15px}
.pmi{padding:11px 16px;cursor:pointer;display:flex;gap:10px;align-items:center;border-top:1px solid #d9dce5}
.pmi:hover{background:#dde0e8}
.pmi.red{color:#c62828}
.pmi.dis{opacity:.45;cursor:default}
.pprof .stat{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid #ffffff10}
.pl.out{opacity:.35}
.av{width:42px;height:42px;border-radius:50%;margin:0 auto 5px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;color:#fff;border:3px solid #fff3}
.pl .nm{font-weight:600;font-size:14px}
.pl .mn{font-size:21px;margin-top:3px}
.pl .tag{font-size:11px;opacity:.7;margin-top:2px}
#board{--s:min(calc(100vh - 28px),calc(100vw - 250px));width:var(--s);height:var(--s);min-width:620px;min-height:620px;display:grid;grid-template-columns:.5fr 1.5fr repeat(9,1fr) 1.5fr .5fr;grid-template-rows:.5fr 1.5fr repeat(9,1fr) 1.5fr .5fr;gap:2px;background:var(--bd);padding:2px;border-radius:8px}
.cell{background:var(--cell);color:var(--cellfg);position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:max(9px,calc(var(--s)/105));text-align:center;cursor:pointer;overflow:hidden;border-radius:3px;padding-top:6%}
.cell:hover{outline:2px solid #2ec4a0;z-index:2}
.cell.here{outline:3px solid #ffd54f;z-index:3;box-shadow:0 0 12px #ffd54f99}
.cell .band{position:absolute;left:0;right:0;top:0;height:13%}
.cell .ic{font-size:max(15px,calc(var(--s)/42));line-height:1}
.cell .cn{font-weight:600;padding:0 2px;line-height:1.1;margin-top:2px}
.cell .pr{font-size:.95em;opacity:.7;margin-top:2px;padding:0 4px;border-radius:3px}
.cell .lv{color:#e6a800;font-size:1.1em;line-height:1}
.cell.owned .pr{opacity:1;font-weight:700;color:#fff}
.cell.mort .ic,.cell.mort .cn{opacity:.35}
.cell.corner{background:var(--corner)}
.cell.corner .ic{font-size:max(26px,calc(var(--s)/22))}
.tokens{position:absolute;bottom:2px;left:0;right:0;display:flex;justify-content:center;gap:1px;flex-wrap:wrap;pointer-events:none}
.tok{width:max(11px,calc(var(--s)/60));height:max(11px,calc(var(--s)/60));border-radius:50%;border:2px solid #fff;box-shadow:0 1px 3px #000a}
.tok.sk{width:max(18px,calc(var(--s)/40));height:max(18px,calc(var(--s)/40));background:#fff;border-width:3px;display:flex;align-items:center;justify-content:center;font-size:max(10px,calc(var(--s)/70))}
#center{grid-column:3/12;grid-row:3/12;background:var(--ctr);display:flex;flex-direction:column;padding:12px 16px;gap:8px;border-radius:4px;min-height:0}
/* ценники снаружи поля: цвет группы, цена (или аренда, если компания куплена) */
.lab{display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:max(9px,calc(var(--s)/95));border-radius:3px;white-space:nowrap;overflow:hidden;text-shadow:0 1px 2px #0005;cursor:pointer;line-height:1}
.lab.v{writing-mode:vertical-rl}
.lab.vl{writing-mode:vertical-rl;transform:rotate(180deg)}
.lab.mort{opacity:.6}
/* купленная клетка — цветом владельца */
.cell.own .cn,.cell.own .lv{color:#fff;text-shadow:0 1px 2px #0006}
.cell.own .ic{filter:drop-shadow(0 1px 2px #0004)}
.cell.own.mort{filter:grayscale(.5)}
#top{display:flex;align-items:center;justify-content:space-between;gap:10px}
#title{font-size:22px;font-weight:800;letter-spacing:.5px}
#title span{color:#2ec4a0}
#minfo{font-size:12px;opacity:.7;font-weight:400;letter-spacing:0}
#dice{font-size:48px;line-height:1;letter-spacing:6px;white-space:nowrap}
#dice small{font-size:22px;color:#2ec4a0;letter-spacing:0;vertical-align:middle}
#dice .d3{color:#ffb627;margin-left:4px}
#actions{min-height:60px;text-align:center}
#actions .hint{opacity:.75;font-size:13px;margin:4px}
#actions .q{margin:4px 0;font-size:15px}
#log{flex:1;overflow:auto;background:var(--logbg);border-radius:8px;padding:8px 10px;font-size:13px;line-height:1.45;min-height:0}
#log div{border-bottom:1px solid #ffffff0d;padding:2px 0}
.ov{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:50}
.box{background:#2a2f3d;border-radius:14px;padding:22px;min-width:320px;max-width:94vw;max-height:94vh;overflow:auto;box-shadow:0 10px 40px #000a;position:relative}
.box h2{margin:0 0 12px}
.row{display:flex;gap:8px;align-items:center;margin:6px 0}
.row input[type=text]{flex:1;padding:8px;border-radius:6px;border:0;background:#1e222d;color:#eee;font:inherit}
.sw{width:22px;height:22px;border-radius:50%;flex:none}
.card{width:300px}
.card .hd{padding:14px;border-radius:10px 10px 0 0;color:#fff;font-weight:700;font-size:18px;text-align:center;text-shadow:0 1px 2px #0008}
.card table{width:100%;border-collapse:collapse;font-size:14px;margin:8px 0}
.card td{padding:3px 4px;border-bottom:1px solid #ffffff10}
.card td:last-child{text-align:right}
.card tr.cur td{color:#2ec4a0;font-weight:700}
.muted{opacity:.7;font-size:13px}
.tcols{display:flex;gap:14px}
.tcol{flex:1;background:#1e222d;border-radius:10px;padding:10px;min-width:0}
.tcol h3{margin:0 0 8px;font-size:15px}
.tlist{max-height:300px;overflow:auto}
.ti{display:flex;align-items:center;gap:6px;padding:4px 2px;font-size:13px;cursor:pointer;border-radius:6px}
.ti:hover{background:#ffffff0a}
.ti.dis{opacity:.4;cursor:default}
.ti .sw{width:12px;height:12px}
.ti .p{margin-left:auto;opacity:.6}
.tcol input[type=number]{width:100%;padding:7px;border-radius:6px;border:0;background:#2a2f3d;color:#eee;font:inherit;margin-top:4px}
.pbtn{background:#4a5163}.pbtn.sel{outline:2px solid #fff}
#tov .row{flex-wrap:wrap;gap:6px}#tov .pbtn{margin:0;white-space:nowrap}
@media (max-width:820px){#tov .pbtn{padding:6px 10px;font-size:13px}#tov .box h2{font-size:20px}}
#tmsg{min-height:22px;margin:10px 0 4px;text-align:center;font-weight:600}
.tsum{background:#1e222d;border-radius:10px;padding:10px 14px;margin:10px 0;line-height:1.6}
.ingame-menu{position:fixed;left:14px;bottom:14px;z-index:30}
/* ===== Кубики 3D, карточка хода, договор в центре поля ===== */
#center{position:relative}
#diceFx{position:absolute;inset:0;pointer-events:none;z-index:6;overflow:hidden;perspective:900px}
.dthrow{position:absolute;left:50%;top:46%;transition:transform .95s cubic-bezier(.2,.75,.25,1),opacity .4s}
.d3d{--ds:calc(var(--s)/9);width:var(--ds);height:var(--ds);position:relative;transform-style:preserve-3d;transition:transform .95s cubic-bezier(.2,.75,.25,1)}
.d3d .f{position:absolute;inset:0;border-radius:18%;background:var(--dc,#fff);box-shadow:inset 0 0 0 1px #0002,inset 0 -6px 12px #0001;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:12%;box-sizing:border-box;backface-visibility:hidden}
.d3d .f i{width:66%;height:66%;margin:auto;border-radius:50%;background:var(--dp,#262b38);box-shadow:inset 0 2px 3px #0005}
.d3d .f.tr{display:flex;align-items:center;justify-content:center;font-size:calc(var(--ds)*.55)}
.d3d .f1{transform:translateZ(calc(var(--ds)/2))}
.d3d .f6{transform:rotateY(180deg) translateZ(calc(var(--ds)/2))}
.d3d .f3{transform:rotateY(90deg) translateZ(calc(var(--ds)/2))}
.d3d .f4{transform:rotateY(-90deg) translateZ(calc(var(--ds)/2))}
.d3d .f2{transform:rotateX(90deg) translateZ(calc(var(--ds)/2))}
.d3d .f5{transform:rotateX(-90deg) translateZ(calc(var(--ds)/2))}
/* карточка «Ваш ход!» / «Покупаем?» */
#actions .acard{background:#fff;color:#262b38;border-radius:10px;padding:10px 12px 12px;text-align:left;box-shadow:0 6px 20px #0004}
#actions .acard b.t{display:block;font-size:17px}
#actions .acard small{display:block;color:#8a93a6;font-size:12px;margin:2px 0 8px}
#actions .acard .row2{display:flex;gap:8px}
#actions .acard button{width:100%;margin:0;padding:9px}
#actions .acard .row2 button{flex:1}
#actions .acard button.sec{background:#e9ecf3;color:#4a5163}
#actions .acard button:disabled{background:#c9ced8;color:#fff;opacity:1}
#actions .acard .mvchips{display:flex;gap:4px;flex-wrap:wrap}#actions .acard .mvchips button{width:auto;flex:1;padding:5px 6px;font-size:13px}
/* договор в центре поля */
#tradeBox{display:none;position:absolute;inset:6px;z-index:7;background:#fff;color:#262b38;border-radius:10px;box-shadow:0 10px 30px #0006;flex-direction:column;overflow:hidden}
#tradeBox.on{display:flex}
#tradeBox .th{display:flex;align-items:center;justify-content:center;position:relative;padding:8px;font-weight:700;font-size:16px;border-bottom:1px solid #eef}
#tradeBox .th .x{position:absolute;right:6px;top:4px;background:none;color:#8a93a6;padding:4px 8px;font-size:16px;margin:0}
#tradeBox .tb{flex:1;display:flex;min-height:0}
#tradeBox .tside{flex:1;padding:8px 10px;overflow:auto;min-width:0}
#tradeBox .tside+.tside{border-left:1px solid #eef}
#tradeBox .who{display:flex;gap:6px;align-items:center;margin-bottom:8px}
#tradeBox .who .av2{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;flex:none}
#tradeBox .who b{display:block;font-size:13px;line-height:1.1}#tradeBox .who small{color:#8a93a6;font-size:11px}
#tradeBox .titem{display:flex;gap:6px;align-items:center;font-size:12px;padding:4px 2px;border-radius:6px}
#tradeBox .titem .ic{font-size:18px;width:24px;text-align:center}
#tradeBox .titem small{display:block;color:#8a93a6;font-size:10px}
#tradeBox .titem .rm{margin-left:auto;color:#c33;cursor:pointer;padding:0 4px}
#tradeBox .money{cursor:pointer}
#tradeBox .money .ic{background:#e6f6ec;border-radius:6px}
#tradeBox .tip{color:#8a93a6;font-size:11px;margin-top:6px;line-height:1.3}
#tradeBox .tf{border-top:1px solid #eef;padding:6px 10px 8px;text-align:center}
#tradeBox .sums{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:700;margin-bottom:6px}
#tradeBox .sums span{color:#8a93a6;font-weight:400;font-size:11px}
#tradeBox .tf button{margin:2px;padding:7px 16px}
#tradeBox .tmsg{min-height:16px;font-size:12px;color:#c33}
.cell.tdim{filter:grayscale(.7) brightness(.55)}
.cell.tsel{outline:3px solid #22b8a5!important;z-index:4;filter:none}
.cell.tsel::after{content:'✓';position:absolute;top:1px;left:2px;background:#22b8a5;color:#fff;border-radius:50%;width:1.3em;height:1.3em;font-size:max(9px,calc(var(--s)/80));display:flex;align-items:center;justify-content:center}
.cell.tpulse{animation:tp 1s infinite alternate}
@keyframes tp{from{outline:3px solid #ffb627}to{outline:3px solid #ff8a3d;box-shadow:0 0 14px #ffb627}}
@media (max-width:820px),(max-height:520px) and (orientation:landscape){
  #tradeBox{inset:2px}#tradeBox .th{padding:4px;font-size:13px}
  #tradeBox .tside{padding:4px 5px}#tradeBox .titem{font-size:10px;padding:2px 0}#tradeBox .titem .ic{font-size:14px;width:18px}
  #tradeBox .who b{font-size:11px}#tradeBox .who .av2{width:18px;height:18px;font-size:10px}
  #tradeBox .who{margin-bottom:2px}#tradeBox .who small,#tradeBox .titem small{display:none}#tradeBox .th .x{padding:0 6px;top:2px}
  #tradeBox .titem b{font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}#tradeBox .titem>div{min-width:0}
  #tradeBox .tmsg{min-height:0;font-size:10px}
  #tradeBox .tip{display:none}#tradeBox .tf{padding:3px 5px 4px}#tradeBox .tf button{padding:5px 10px;font-size:12px}#tradeBox .sums{font-size:11px;margin-bottom:2px}
  #actions .acard{padding:6px 8px 8px}#actions .acard b.t{font-size:13px}#actions .acard small{font-size:10px;margin:0 0 4px}#actions .acard button{padding:6px;font-size:12px}
}
/* чат в партии и общий */
#chatBar{display:none;gap:4px;margin:0}
#chatBar.on{display:flex}
#chatBar input{flex:1;min-width:0;background:var(--logbg);border:1px solid #ffffff1a;border-radius:8px;color:inherit;padding:6px 9px;font:inherit;font-size:13px;outline:none}
#chatBar button{margin:0;padding:5px 12px}
.gchat .gcl{height:190px;overflow:auto;font-size:13px;line-height:1.55;padding-right:4px}
.gchat .gcf{display:flex;gap:6px;margin-top:8px}.gchat .gcf .inp{flex:1}.gchat .gcf button{margin:0}
.gchat .gdel{color:#c33;cursor:pointer;font-size:11px;margin-left:4px;text-decoration:none}
@media (max-width:820px),(max-height:520px) and (orientation:landscape){
  #chatBar input{font-size:10px;padding:3px 6px}#chatBar button{padding:2px 8px;font-size:11px;width:auto}
}
/* аукцион — карточка в центре поля, видна всем */
#aucBox{display:none;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(92%,340px);z-index:8;background:#fff;color:#262b38;border-radius:12px;box-shadow:0 12px 34px #0007;overflow:hidden;text-align:center}
#aucBox.on{display:block;animation:aucIn .25s ease-out}
@keyframes aucIn{from{transform:translate(-50%,-50%) scale(.85);opacity:0}}
#aucBox .ah{color:#fff;font-weight:800;padding:7px;font-size:16px;text-shadow:0 1px 2px #0004}
#aucBox .ab{display:flex;gap:10px;align-items:center;justify-content:center;padding:8px 10px 2px;text-align:left}
#aucBox .aic{font-size:34px}#aucBox .ab b{display:block;font-size:15px}#aucBox .ab small{color:#8a93a6}
#aucBox .abid{font-size:15px;padding:4px 10px}
#aucBox .apl{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;padding:4px 8px}
#aucBox .apl span{border:2px solid var(--c);color:var(--c);border-radius:12px;padding:1px 8px;font-size:12px;font-weight:700}
#aucBox .apl span.now{background:var(--c);color:#fff}
#aucBox .apl span.pass{opacity:.4;text-decoration:line-through}
#aucBox .abtn{display:flex;gap:6px;padding:8px 10px 2px}#aucBox .abtn button{flex:1;margin:0;padding:10px 6px;font-size:15px}
#aucBox .abtn button.sec{background:#e9ecf3;color:#4a5163}
#aucBox .amy{display:block;color:#8a93a6;font-size:11px;padding-bottom:8px}
#aucBox .await{padding:8px 10px 10px;font-size:14px}
@media (max-width:820px),(max-height:520px) and (orientation:landscape){
  #aucBox{width:96%;border-radius:8px}#aucBox .ah{font-size:12px;padding:3px}#aucBox .aic{font-size:22px}#aucBox .ab{padding:3px 6px 0;gap:6px}#aucBox .ab b{font-size:11px}#aucBox .ab small{font-size:9px}
  #aucBox .abid{font-size:11px;padding:2px 6px}#aucBox .apl span{font-size:9px;padding:0 5px}#aucBox .abtn{padding:4px 6px 1px}#aucBox .abtn button{padding:6px 4px;font-size:12px;width:auto}#aucBox .amy{font-size:9px;padding-bottom:4px}#aucBox .await{font-size:11px;padding:4px 6px 6px}
}
/* поезд/тройка: клетки, куда можно встать */
.cell.mvopt{outline:3px solid #ffb627!important;z-index:5;animation:mvp .8s infinite alternate;cursor:pointer}
.cell.mvopt::before{content:attr(data-mv);position:absolute;top:2px;right:2px;background:#ffb627;color:#3a2300;border-radius:8px;padding:0 5px;font-weight:800;font-size:max(10px,calc(var(--s)/70));z-index:2}
@keyframes mvp{from{box-shadow:0 0 0 #ffb62700}to{box-shadow:0 0 16px #ffb627}}
.cell.pickopt{outline:2px dashed #ffb627;cursor:pointer}
.grpinfo{font-size:13px;margin:6px 0;line-height:1.5}
.dmb{position:absolute;top:0;right:-2px;background:#e05252;color:#fff;border-radius:10px;font-size:10px;padding:0 5px;line-height:15px}
.dml{flex:1;overflow:auto;min-height:200px;max-height:55vh;display:flex;flex-direction:column;gap:5px;padding:4px}
.dml>div{max-width:80%;align-self:flex-start;background:#eef1f7;border-radius:12px 12px 12px 3px;padding:6px 10px;font-size:14px}
.dml>div.me{align-self:flex-end;background:#d9f5ee;border-radius:12px 12px 3px 12px}
.dml small{display:block;color:#8a93a6;font-size:10px;text-align:right}
.banbox{background:#fdecec;border:1px solid #f5b5b5;color:#8a1f1f;border-radius:10px;padding:10px 14px;margin-bottom:10px}
.mlog{flex:1;overflow:auto;font-size:13px;line-height:1.5;background:#1e222d;border-radius:8px;padding:8px 10px;min-height:120px}
.mlog div{border-bottom:1px solid #ffffff0d;padding:2px 0}
.shbtns{display:flex;flex-direction:column;gap:8px;margin:12px 0}
.shb{display:block;color:#fff;text-decoration:none;font-weight:700;padding:11px;border-radius:10px;cursor:pointer;font-size:15px}
.shb:hover{filter:brightness(1.08)}
.shurl{font-size:12px;color:#8a93a6;word-break:break-all;margin-bottom:10px;user-select:all}
.odot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#9aa1ae;vertical-align:middle;box-shadow:0 0 0 2px #fff3}
.odot.on{background:#3ccf6e;box-shadow:0 0 6px #3ccf6e}
/* ===== Темы оформления ===== */
body.th-light{--bg:#e9edf5;--fg:#262b38;--pl:#fff;--ctr:#fff;--bd:#c9d0de;--logbg:#f1f3f8}
body.th-light #log div{border-bottom-color:#0000000d}
body.bd-mint{--cell:#e3f4ec;--corner:#cfeadd}
body.bd-sky{--cell:#e5eefb;--corner:#d2e0f6}
body.bd-sand{--cell:#f7ead2;--corner:#efd9b0}
body.bd-night{--cell:#343a4c;--corner:#2b3040;--cellfg:#e8eaf0}
body.bd-rose{--cell:#fbe6ec;--corner:#f4cfda}
/* ===== Анимации: прыжок фишки и летящие деньги ===== */
.tok.hop{animation:hop .26s ease-out}
@keyframes hop{0%{transform:none}45%{transform:translateY(-55%) scale(1.3)}100%{transform:none}}
.fmoney{position:fixed;transform:translate(-50%,-50%);font-weight:800;font-size:16px;pointer-events:none;z-index:60;animation:fm 1.4s ease-out forwards;text-shadow:0 1px 3px #000c;white-space:nowrap}
.fmoney.up{color:#5ee08a}.fmoney.dn{color:#ff6b6b}
@keyframes fm{0%{opacity:0;margin-top:0}12%{opacity:1}100%{opacity:0;margin-top:-46px}}
/* значки на клетке: карточка, акции, штаб-квартира */
.cell .cb{position:absolute;top:13%;right:1px;font-size:max(8px,calc(var(--s)/95));line-height:1.1;font-weight:700;color:#c98a00;background:#fff9;border-radius:3px;padding:0 1px;pointer-events:none}
.cell .cb.l{right:auto;left:1px;color:#1e88e5}
/* событие круга */
#evt{display:none;background:linear-gradient(90deg,#ffb627,#ff8a3d);color:#2a1a00;border-radius:8px;padding:5px 10px;font-size:13px;font-weight:700;text-align:center}
#evt.on{display:block}
/* реакции */
#reactBar{position:fixed;left:110px;bottom:14px;z-index:30;display:none;gap:2px;align-items:center}
#reactBar.on{display:flex}
#reactBar button{margin:0;padding:6px 9px;font-size:18px;background:#4a5163}
#reactBar .rl{display:none;gap:2px}#reactBar.open .rl{display:flex}
.rbub{position:fixed;transform:translate(-50%,-50%);font-size:34px;z-index:61;pointer-events:none;animation:rb 2.2s ease-out forwards;text-align:center}
.rbub small{display:block;font-size:11px;font-weight:700;color:#fff;background:#0009;border-radius:6px;padding:1px 5px}
@keyframes rb{0%{opacity:0;transform:translate(-50%,-30%) scale(.5)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-120%) scale(1)}}
/* подсказки для новичков */
.tut{background:#fff6d6;color:#4a3800;border:2px solid #ffb627;border-radius:10px;padding:8px 10px;margin-bottom:6px;font-size:13px;line-height:1.4;text-align:left}
.tut b{color:#4a3800!important}
.tut button{padding:3px 10px;font-size:12px;margin:5px 4px 0 0}
.badge{display:inline-block;background:linear-gradient(135deg,#ffd54f,#ff8a3d);color:#3a2300;border-radius:20px;padding:3px 10px;font-size:13px;font-weight:700;margin:4px 4px 0 0}
.swc{display:inline-block;width:46px;height:46px;border-radius:10px;margin:4px;cursor:pointer;border:3px solid transparent;vertical-align:middle}
.swc.sel{border-color:#2ec4a0}
@media (max-width:820px),(max-height:520px) and (orientation:landscape){
  #reactBar{left:auto;right:74px;bottom:6px}#reactBar button{padding:4px 6px;font-size:15px}
  .cell .cb{font-size:calc(var(--s)/55);top:11%}
  #evt{font-size:10px;padding:2px 6px}
  .tut{font-size:9px;padding:3px 5px;line-height:1.25;margin-bottom:3px}#actions .tut button{padding:2px 7px;font-size:9px;margin:3px 3px 0 0;width:auto}
  #actions{flex:none;max-height:58%;overflow:auto}
}

function askConfirm(text,okText='Да',danger=false){
  return new Promise(res=>{
    const d=document.getElementById('dlg');
    d.innerHTML=`<div class="ov" style="z-index:60"><div class="box lt" style="width:380px;text-align:center">
      <p style="font-size:17px;line-height:1.5;margin:4px 0 16px">${text}</p>
      <button id="dOk" class="${danger?'red':''}">${okText}</button><button class="sec" id="dNo">Отмена</button></div></div>`;
    const done=v=>{ d.innerHTML=''; res(v); };
    document.getElementById('dOk').onclick=()=>done(true);
    document.getElementById('dNo').onclick=()=>done(false);
  });
}
function askText(title,value='',o={}){
  return new Promise(res=>{
    const d=document.getElementById('dlg');
    d.innerHTML=`<div class="ov" style="z-index:60"><div class="box lt" style="width:380px">
      <h3 style="margin-top:0">${title}</h3>${o.note?`<p class="muted" style="margin-top:-6px;line-height:1.5">${o.note}</p>`:''}<input class="inp" id="dIn" maxlength="${o.num?10:16}" ${o.num?'inputmode="decimal"':''}>
      <div style="text-align:center;margin-top:14px"><button id="dOk">${o.ok||'Сохранить'}</button><button class="sec" id="dNo">Отмена</button></div></div></div>`;
    const inp=document.getElementById('dIn'); inp.value=value; inp.focus();
    const done=v=>{ d.innerHTML=''; res(v); };
    document.getElementById('dOk').onclick=()=>done(inp.value);
    document.getElementById('dNo').onclick=()=>done(null);
    inp.onkeydown=e=>{ if(e.key==='Enter') done(inp.value); if(e.key==='Escape') done(null); };
  });
}

const UPGRADE_N=3;
function upgradeInfo(x){
  if(x.type!=='card'||x.r>=3) return null;
  const next=CARDS.filter(c=>c.coll===x.coll&&c.r===x.r+1); if(!next.length) return null;
  const avg=next.reduce((s,c)=>s+c.val,0)/next.length;
  const p=Math.max(0.01,Math.min(0.95,(RETURN_RATE*UPGRADE_N-1)*x.val/(avg-x.val)));
  return {next,p};
}

  for(const k of COLL_KEYS){

}

const TASKS_V=2; // при смене набора заданий — пересоздать задания дня
// 4 задания в день: 2 по режимам (из доступных игроку) и 2 обычных; набор одинаковый для всех с тем же доступом
function ensureTasks(a){
  const day=today();
  if(a.tasks&&a.tasks.day===day&&a.tasks.v===TASKS_V) return a.tasks;
  let h=0; for(const ch of day) h=(h*31+ch.charCodeAt(0))&0x7fffffff;
  const rnd=()=>(h=(h*1103515245+12345)&0x7fffffff)/0x7fffffff;
  const can=t=>!t.mode||!modeLock(t.mode,a);
  const mix=l=>l.map(t=>[rnd(),t]).sort((x,y)=>x[0]-y[0]).map(x=>x[1]);
  const modeT=mix(TASK_POOL.filter(t=>t.mode&&can(t)));
  // одно задание на режим: не «сыграйте Быструю» и «выиграйте Быструю» в один день
  const pickM=[]; for(const t of modeT) if(pickM.length<2&&!pickM.some(p=>p.mode===t.mode)) pickM.push(t);
  const pool=[...pickM,...mix(TASK_POOL.filter(t=>!t.mode))].slice(0,4);
  const old=a.tasks&&a.tasks.day===day?a.tasks.list:[];
  a.tasks={day,v:TASKS_V,list:pool.map(t=>old.find(o=>o.id===t.id)||{id:t.id,prog:0,done:false})};
  return a.tasks;
}

function track(p,id,amount=1){
  if(!p) return;
  // в игре по сети прогресс заданий других игроков копится в партии — каждый применит его себе в конце
  if(G&&G.online&&p.uid&&p.uid!==DB.session){ G.tp=G.tp||{}; const t=(G.tp[p.uid]=G.tp[p.uid]||{}); t[id]=(t[id]||0)+amount; return; }
  if(!p.acc||p.acc!==DB.session) return; const a=DB.accounts[p.acc]; if(!a) return; // задания считаются только своему аккаунту
  a.life=a.life||{}; a.life[id]=(a.life[id]||0)+amount; checkAch(a);
  const ts=ensureTasks(a), t=ts.list.find(x=>x.id===id&&!x.done); if(!t){ saveDB(); return; }
  const def=TASK_POOL.find(x=>x.id===id);
  t.prog=Math.min(def.goal,t.prog+amount);
  if(t.prog>=def.goal){ t.done=true; a.xp+=def.xp; if(G) log(`🎯 ${pn(p)} выполняет задание «${def.t}»: +${def.xp} XP`); }
  saveDB();
}

      const L=document.createElement('div'); L.id='l'+i; L.onclick=click;
      const top=i>0&&i<10, right=i>10&&i<20, bottom=i>20&&i<30;

const SND={on:localStorage.getItem('bizemp_snd')!=='0',ctx:null};
function beep(f,d=0.08,type='sine',vol=0.06,delay=0){
  if(!SND.on) return;
  try{ const c=SND.ctx||(SND.ctx=new (window.AudioContext||window.webkitAudioContext)()); if(c.state==='suspended') c.resume();
    const t=c.currentTime+delay, o=c.createOscillator(), g=c.createGain();
    o.type=type; o.frequency.setValueAtTime(f,t); g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+d+0.03); }catch(e){}
}
const SFX={
  dice:()=>{ for(let k=0;k<4;k++) beep(260+Math.random()*320,0.045,'square',0.03,k*0.05); },
  step:()=>beep(700,0.03,'triangle',0.03),
  coin:()=>{ beep(988,0.08,'square',0.035); beep(1319,0.18,'square',0.035,0.08); },
  pay:()=>{ beep(330,0.12,'sawtooth',0.03); beep(247,0.2,'sawtooth',0.03,0.1); },
  buy:()=>[523,659,784].forEach((f,k)=>beep(f,0.13,'triangle',0.05,k*0.07)),
  turn:()=>{ beep(784,0.12,'sine',0.08); beep(1047,0.22,'sine',0.08,0.12); },
  pop:()=>beep(880,0.07,'sine',0.05),
  event:()=>[440,554,659,880].forEach((f,k)=>beep(f,0.12,'triangle',0.05,k*0.08))

const myPlayer=()=>G&&(G.online?G.players.find(p=>p.uid===DB.session):G.players.find(p=>p.acc&&p.acc===DB.session)||G.players.find(p=>!p.bot));

let FX=null;
function fx(){
  const key=(G.rid||'local')+'|'+G.mode+'|'+G.players.map(p=>p.name).join(',');
  const now={key,money:G.players.map(p=>p.money),pos:G.players.map(p=>p.pos),own:G.cells.map(s=>s.owner),dice:G.diceHtml||'',ev:G.event?G.event.id+G.event.r:'',rollId:G.roll?G.roll.id:0};
  const was=FX; FX=now;
  // гости и зрители: показать бросок, который сделал хозяин
  if(was&&was.key===key&&G.roll&&G.roll.id!==was.rollId&&NET.role==='guest') dice3d(G.roll);
  if(!was||was.key!==key||$('#app').offsetParent===null||!$('#landing').classList.contains('hide')) return;
  let stepped=false;
  G.players.forEach((p,k)=>{ const d=p.money-was.money[k]; if(d) floatMoney(p.id,d);
    if(p.pos!==was.pos[k]){ stepped=true; const t=document.querySelector(`#c${p.pos} .tok[data-pid="${p.id}"]`); if(t) t.classList.add('hop'); } });
  if(stepped) SFX.step();
  const mp=myPlayer(); if(mp){ const d=mp.money-was.money[mp.id]; if(d>0) SFX.coin(); else if(d<0) SFX.pay(); }
  if(now.own.some((o,i)=>o!==was.own[i]&&o>=0)) SFX.buy();

  if(now.ev&&now.ev!==was.ev) SFX.event();
}

const PIPS={1:[5],2:[1,9],3:[1,5,9],4:[1,3,7,9],5:[1,3,5,7,9],6:[1,3,4,6,7,9]};
const FACE_ROT={1:[0,0],6:[0,180],3:[0,-90],4:[0,90],2:[-90,0],5:[90,0]};
function dieHTML(trainFace){
  return [1,2,3,4,5,6].map(n=>n===6&&trainFace?`<div class="f f6 tr">${trainFace}</div>`
    :`<div class="f f${n}">${Array.from({length:9},(_,k)=>PIPS[n].includes(k+1)?'<i></i>':'<span></span>').join('')}</div>`).join('');

function dice3d(r){
  const box=$('#diceFx'); if(!box||!r) return;
  box.innerHTML=''; SFX.dice();
  const p=G&&G.players[r.pid], col=p?p.color:'#5a3fd6';
  const vals=r.v.filter((x,k)=>k<2||x);
  vals.forEach((v,k)=>{
    const train=v==='T'?'🚂':v==='W'?'💼':'', face=train?6:v, [rx,ry]=FACE_ROT[face];
    const w=document.createElement('div'); w.className='dthrow';
    const off=(k-(vals.length-1)/2)*1.25; // кубики рядом
    w.style.transform=`translate(calc(-50% + var(--s)*${-0.35+off*0.11}),calc(-50% + var(--s)*-0.25)) rotate(${-40+k*25}deg)`;
    const d=document.createElement('div'); d.className='d3d'+(k===2?' third':'');
    d.style.setProperty('--dc',k===2?'#ffb627':'#fff'); d.style.setProperty('--dp',k===2?'#3a2300':col);
    d.innerHTML=dieHTML(train);
    d.style.transform=`rotateX(${Math.random()*720}deg) rotateY(${Math.random()*720}deg) rotateZ(${Math.random()*360}deg)`;
    w.appendChild(d); box.appendChild(w);
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      w.style.transform=`translate(calc(-50% + var(--s)*${off*0.11}),-50%) rotate(${(k?8:-6)}deg)`;
      d.style.transform=`rotateX(${rx+720-12}deg) rotateY(${ry+720+14}deg)`;
    }));
  });
  clearTimeout(dice3d.t); dice3d.t=setTimeout(()=>{ box.querySelectorAll('.dthrow').forEach(w=>w.style.opacity='0'); setTimeout(()=>{ if(box) box.innerHTML=''; },450); },1900);
}

// ====== СМЕНА ВЕДУЩЕГО: если создатель комнаты пропал на 2,5 минуты, партию подхватывает другой игрок ======
const HOST_GONE_MS=150000;
setInterval(()=>{ // ведущий отмечается, что жив
  if(NET.role==='host'&&G&&G.online&&!G.over&&FB) roomRef(G.rid).update({hostSeen:Date.now()}).catch(()=>{});
},30000);
setInterval(async()=>{ // гости проверяют ведущего
  const r=NET.room; if(NET.role!=='guest'||NET.spec||!r||r.status!=='playing'||!G||G.over||!FB) return;
  if(Date.now()-(r.hostSeen||r.created||0)<HOST_GONE_MS) return;
  // подхватывает первый по порядку игрок, который сейчас в сети (кроме пропавшего ведущего)
  const c=G.players.filter(p=>!p.out&&p.uid&&p.uid!==r.host&&isOnlineUid(p.uid));
  if(!c.length||c[0].uid!==DB.session) return;
  try{
    await FB.db.runTransaction(async tx=>{ const ref=roomRef(r.id), s=await tx.get(ref); const d=s.data();
      if(!s.exists||d.status!=='playing'||d.host!==r.host||Date.now()-(d.hostSeen||0)<HOST_GONE_MS) throw 'skip';
      tx.update(ref,{host:DB.session,hostName:(me()||{}).name||'',hostSeen:Date.now(),takenBy:DB.session,takenAt:Date.now()}); });
    toast('🔄 Создатель пропал — партию теперь ведёте вы. Не закрывайте вкладку!');
  }catch(e){ if(e!=='skip') console.error('takeover',e); }
},15000);

// ====== ЛИЧНЫЕ СООБЩЕНИЯ (коллекция dm: from, to, name, text, at, read) ======
DB.dmIn=[]; DB.dmOut=[]; let dmUnsubs=[], dmOpen=null;
function listenDM(){
  if(!FB||!me()||dmUnsubs.length) return;
  const col=FB.db.collection('dm');
  dmUnsubs=[col.where('to','==',DB.session).onSnapshot(s=>{ const before=DB.dmIn.length; DB.dmIn=s.docs.map(d=>({id:d.id,...d.data()}));
      if(DB.dmReady&&DB.dmIn.length>before){ const m=DB.dmIn.sort((a,b)=>b.at-a.at)[0]; if(m&&!m.read&&dmOpen!==m.from){ SFX.pop(); toast(`✉️ ${m.name||'Сообщение'}: ${cleanChat(m.text).slice(0,40)}`); } }
      DB.dmReady=true; dmRefresh(); },e=>console.error('dm',e)),
    col.where('from','==',DB.session).onSnapshot(s=>{ DB.dmOut=s.docs.map(d=>({id:d.id,...d.data()})); dmRefresh(); },e=>console.error('dm',e))];
}
function stopDM(){ dmUnsubs.forEach(f=>f()); dmUnsubs=[]; DB.dmIn=[]; DB.dmOut=[]; DB.dmReady=false; }
const dmUnread=()=>(DB.dmIn||[]).filter(m=>!m.read).length;
function dmRefresh(){ const b=document.querySelector('[data-act="dmList"] .cntb'); const n=dmUnread();
  if(dmOpen) drawDM(); else if($('#dmlov')) showDMList(); else if(!$('#landing').classList.contains('hide')&&!$('#modal').innerHTML&&!$('#dlg').innerHTML) $('#nav').innerHTML=navHTML(); }
function dmThreads(){ const t={};
  [...DB.dmIn.map(m=>({...m,other:m.from})),...DB.dmOut.map(m=>({...m,other:m.to}))].forEach(m=>{ (t[m.other]=t[m.other]||[]).push(m); });
  return Object.entries(t).map(([uid,ms])=>({uid,ms:ms.sort((a,b)=>a.at-b.at)})).sort((a,b)=>b.ms[b.ms.length-1].at-a.ms[a.ms.length-1].at); }
function showDMList(){
  dmOpen=null; const th=dmThreads();
  $('#modal').innerHTML=`<div class="ov" id="dmlov"><div class="box lt" style="width:400px"><h2 style="margin-top:0">✉️ Сообщения</h2>
    ${th.length?th.map(x=>{ const a=DB.accounts[x.uid], last=x.ms[x.ms.length-1], un=x.ms.filter(m=>m.to===DB.session&&!m.read).length;
      return `<div class="top" data-dmopen="${esc(x.uid)}" style="cursor:pointer">${a?avc(a,34):''}<span class="n"><b>${esc(a?a.name:(last.from===x.uid?last.name:'Игрок'))}</b>${un?` <span class="badge" style="background:#e05252;color:#fff">${un}</span>`:''}<br><span class="muted" style="font-size:12px">${last.from===DB.session?'Вы: ':''}${esc(cleanChat(last.text)).slice(0,40)}</span></span></div>`; }).join('')
      :'<p class="muted">Сообщений пока нет. Написать можно из профиля игрока (нажмите на его имя) или из списка друзей.</p>'}
    <div style="text-align:center;margin-top:10px"><button class="sec" id="dmx">Закрыть</button></div></div></div>`;
  th.forEach(x=>{ if(!DB.accounts[x.uid]) loadUser(x.uid).then(()=>{ if($('#dmlov')) showDMList(); }).catch(()=>{}); });
  $('#dmlov').onclick=e=>{ if(e.target.id==='dmlov'||e.target.id==='dmx') return closeModal(); const o=e.target.closest('[data-dmopen]'); if(o) showDM(o.dataset.dmopen); };
}
function showDM(uid){ dmOpen=uid; drawDM(true); if(!DB.accounts[uid]) loadUser(uid).then(()=>dmOpen===uid&&drawDM()).catch(()=>{}); }
function drawDM(first){
  const uid=dmOpen, a=DB.accounts[uid]; const th=dmThreads().find(x=>x.uid===uid), ms=th?th.ms:[];
  const keep=$('#dmIn')?$('#dmIn').value:'';

    <div class="dml" id="dml">${ms.map(m=>`<div class="${m.from===DB.session?'me':''}"><span>${esc(cleanChat(m.text))}</span><small>${new Date(m.at).toLocaleTimeString('ru',{hour:'2-digit',minute:'2-digit'})}</small></div>`).join('')||'<p class="muted" style="text-align:center">Напишите первое сообщение</p>'}</div>
    <form id="dmf" class="gcf" autocomplete="off"><input class="inp" id="dmIn" maxlength="300" placeholder="Сообщение…"><button type="submit">➤</button></form></div></div>`;

async function sendDM(uid){

  setTimeout(()=>{ $('#modal').innerHTML=`<div class="ov" id="dlov"><div class="box lt" style="width:340px;text-align:center"><div style="font-size:48px">🎁</div>
    <h2 style="margin:4px 0">Награда за вход</h2><p>День <b>${streak}</b> подряд: <b>+${xp} XP</b>${box?'<br>и 🎁 <b>Набор Prima</b> в инвентарь!':''}</p>
    <div style="display:flex;justify-content:center;gap:4px;margin:8px 0">${[1,2,3,4,5,6,7].map(k=>{ const n=((streak-1)%7)+1; return `<span style="width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;background:${k<=n?'#22b8a5':'#e9ecf3'};color:${k<=n?'#fff':'#8a93a6'}">${k===7?'🎁':k}</span>`; }).join('')}</div>
    <p class="muted" style="font-size:13px">Заходите каждый день — на 7-й день подряд будет набор.</p><button id="dlok">Забрать</button></div></div>`;
    $('#dlok').onclick=closeModal; },900);
}

  if(!FB||!a) return; const d=new Date(); d.setDate(d.getDate()-7); const k=weekendKey(d);

    a.wtDone[k]=true; if(place>=0){ const [ic,xp]=WT_PRIZE[place]; a.badges=[...(a.badges||[]),{ic,t:`${place+1} место · турнир выходных`}]; a.xp+=xp; setTimeout(()=>toast(`${ic} Турнир выходных: ${place+1} место! +${xp} XP`),1500); }
    saveDB(); }catch(e){ console.error('wt',e); }
}

    <div style="margin:8px 0">${r.players.map(p=>`<span class="badge" style="background:${p.c};color:#fff">${esc(p.n)}: ${p.out?'банкрот':fmt(p.m)}</span>`).join('')}</div>

// ====== АВТОЗАВЕРШЕНИЕ ХОДА (настройка): через 3 с, если ничего не нажимали ======
let autoEndT=null, autoEndKey='';
document.addEventListener('pointerdown',()=>{ if(autoEndT){ clearTimeout(autoEndT); autoEndT=null; } },true);
function maybeAutoEnd(){
  if(!THEME.autoEnd||!G||G.phase!=='end'||!canAct()) { if(autoEndT&&(!G||G.phase!=='end')){ clearTimeout(autoEndT); autoEndT=null; } return; }
  const key=(G.turnNo||0)+'_'+G.cur; if(autoEndKey===key) return; autoEndKey=key;
  autoEndT=setTimeout(()=>{ autoEndT=null; if(G&&G.phase==='end'&&canAct()&&!(TR&&!TR.view)&&!$('#modal').innerHTML) answer('end'); },3000);
}

// ====== ЧАТ: в партии по сети и общий на странице «Игры» ======
// грубые слова прячем звёздочками (простой фильтр), ссылки не показываем ссылками
const BAD_RE=/(^|[^а-яёa-z])((?:х[уy][йиеёю]|пизд|[её]б[аеиоуы]|бля|сук|пид[оа]р|муд[аио]|г[ао]вн)[а-яё]*)/gi;
const cleanChat=t=>String(t||'').replace(/\s+/g,' ').trim().slice(0,120).replace(BAD_RE,(m,pre,w)=>pre+w[0]+'*'.repeat(Math.max(2,w.length-1)));
let lastChat=0;
function chatRateOk(){ if(Date.now()-lastChat<2500){ toast('Не так часто 🙂'); return false; } lastChat=Date.now(); return true; }
// сообщение в журнал партии (ведёт хозяин — гости увидят вместе с обновлением партии)
function gameChatLog(p,name,text){
  const t=cleanChat(text); if(!t||!G) return;
  log(`💬 ${p?pn(p):`<b>👁 ${esc(name||'зритель')}</b>`}: ${esc(t)}`);
}
$('#chatBar').onsubmit=e=>{
  e.preventDefault(); const inp=$('#chatIn'), t=cleanChat(inp.value); if(!t||!G||!G.online) return;
  if(!chatRateOk()) return; inp.value='';
  if(NET.role==='host') gameChatLog(myPlayer(),(me()||{}).name,t);
  else netSend({kind:'chat',text:t,name:(me()||{}).name||''});
};
// общий чат (коллекция chat): последние 40 сообщений
let gchatUnsub=null; DB.gchat=[];
function listenGlobalChat(){
  if(!FB||!me()||gchatUnsub) return;
  gchatUnsub=FB.db.collection('chat').orderBy('at','desc').limit(40).onSnapshot(s=>{
    DB.gchat=s.docs.map(d=>({id:d.id,...d.data()})).reverse(); DB.gchatOk=true; drawGlobalChat();
  },e=>{ console.error('chat',e); DB.gchatErr=true; drawGlobalChat(); });
}
function stopGlobalChat(){ if(gchatUnsub){ gchatUnsub(); gchatUnsub=null; } DB.gchat=[]; }
function gchatHTML(){
  const adm=isAdminUser();
  return `<div class="cardw gchat"><div class="ch"><h3>💬 Чат</h3><span class="muted">${DB.gchatErr?'чат недоступен':'общий для всех'}</span></div>
    <div class="gcl" id="gcl">${gchatLines(adm)}</div>
    <form class="gcf" id="gcf" autocomplete="off"><input class="inp" id="gcIn" maxlength="120" placeholder="Введите сообщение и нажмите Enter"><button type="submit">➤</button></form></div>`;
}
function gchatLines(adm){
  return (DB.gchat||[]).map(m=>`<div><span class="muted" style="font-size:11px">${new Date(m.at).toLocaleTimeString('ru',{hour:'2-digit',minute:'2-digit'})}</span> <b style="color:${esc(m.color||'#3b8fd6')};cursor:pointer" data-uprof="${esc(m.uid||"")}">${esc(m.name||'игрок')}</b> — ${esc(cleanChat(m.text))}${adm||m.uid===DB.session?` <a class="gdel" data-gdel="${m.id}" title="Удалить">✕</a>`:''}</div>`).join('')||'<div class="muted">Пока тихо. Напишите первым!</div>';
}
function drawGlobalChat(){ const el=$('#gcl'); if(!el) return; const atBottom=el.scrollHeight-el.scrollTop-el.clientHeight<40; el.innerHTML=gchatLines(isAdminUser()); if(atBottom||!drawGlobalChat.done){ el.scrollTop=el.scrollHeight; drawGlobalChat.done=true; } }
async function sendGlobalChat(){
  const u=me(), inp=$('#gcIn'); if(!u||!FB||!inp) return; const t=cleanChat(inp.value); if(!t) return;
  if(u.banned) return toast('⛔ Вы заблокированы и не можете писать в чат');
  if(!chatRateOk()) return; inp.value='';
  try{ await FB.db.collection('chat').add({uid:DB.session,name:u.name,color:u.color||'#3b8fd6',text:t,at:Date.now()}); }
  catch(e){ toast('Не отправилось: '+(e.code==='permission-denied'?'чат ещё не включён':e.message||e)); }
}
document.addEventListener('submit',e=>{ if(e.target.id==='gcf'){ e.preventDefault(); sendGlobalChat(); } });
document.addEventListener('click',e=>{ const d=e.target.closest('[data-gdel]'); if(!d||!FB) return; FB.db.collection('chat').doc(d.dataset.gdel).delete().catch(err=>toast(err.message)); });
$('#reactBar').onclick=e=>{
  if(e.target.id==='rOpen'){ $('#reactBar').classList.toggle('open'); return; }
  const r=e.target.closest('[data-r]'); if(!r||!G||!G.online) return;
  if(Date.now()-lastReact<1500) return toast('Не так быстро 🙂'); lastReact=Date.now();
  netSend({kind:'react',e:r.dataset.r,name:(me()||{}).name||''}); $('#reactBar').classList.remove('open');

// Может ли ЭТОТ браузер сейчас нажимать кнопки хода.
// Офлайн и у хозяина комнаты — когда игра ждёт ответа от местного игрока; у гостя — когда ход его.
function canAct(){
  if(!G||G.over) return false;
  const a=actor();
  if(NET.role==='guest') return !!G.awaiting&&a.uid===DB.session;
  return !!pending&&!a.bot&&!isRemote(a);
}
// ====== МЕНЮ ИГРОКА (слева) ======
let plMenu=null;
function playerMenu(p){
  const a=actor(), myTurn=canAct();
  let h=`<div class="pmenu"><div class="pmi" data-pm="profile">👤 Профиль</div>`;
  if(myTurn&&p!==a&&!p.out&&!a.out) h+=`<div class="pmi" data-pm="trade">🤝 Обмен</div>`;
  // кредит — в меню своего игрока, когда сейчас ваш ход
  if(myTurn&&p===a&&OPT().credit&&!p.out){
    if(p.credit) h+=`<div class="pmi ${p.money<CREDIT_BACK?'dis':''}" data-pm="repay">🏦 Вернуть кредит ${fmt(CREDIT_BACK)} · осталось ${creditLeft(p)} ход.</div>`;
    else if(creditWait(p)) h+=`<div class="pmi dis">🏦 Новый кредит — через ${creditWait(p)} ход.</div>`;
    else h+=`<div class="pmi" data-pm="credit">🏦 Взять кредит ${fmt(CREDIT)} на ${CREDIT_TURNS} ходов</div>`;
  }
  if(!p.bot&&!p.out&&!G.over&&(!G.online||p.uid===DB.session)) h+=`<div class="pmi red" data-pm="give">✕ Сдаться</div>`;
  return h+'</div>';
}
$('#players').onclick=e=>{
  if(!G) return;
  e.stopPropagation(); // иначе общий обработчик сразу закроет меню
  const m=e.target.closest('[data-pm]');
  if(m){ const p=G.players[plMenu]; plMenu=null; render();
    if(m.dataset.pm==='profile') showPlayerProfile(p);
    if(m.dataset.pm==='trade') openTrade(p.id);
    if(m.dataset.pm==='give') surrender(p);
    if((m.dataset.pm==='credit'||m.dataset.pm==='repay')&&!m.classList.contains('dis')&&canAct()&&actor()===p){
      if(NET.role==='guest') netSend({kind:'cmd',name:m.dataset.pm});
      else if(m.dataset.pm==='credit') takeCredit(p); else repayCredit(p);
    }
    return; }
  const c=e.target.closest('[data-pid]'); if(!c) return;
  const id=+c.dataset.pid; plMenu=plMenu===id?null:id; render();
};
document.addEventListener('click',e=>{ if(plMenu!==null&&!e.target.closest('#players')){ plMenu=null; render(); } });
async function surrender(p){
  if(!G||p.out||G.over) return;
  if(!await askConfirm(`${esc(p.name)}, точно сдаться? Все ваши компании вернутся банку, и вы выбываете из игры.`,'Сдаться',true)) return;
  if(!G||p.out||G.over) return;
  if(NET.role==='guest'){ netSend({kind:'cmd',name:'surrender'}); afterSurrender(); return; }
  doSurrender(p);
  if(G&&!G.over) afterSurrender();
}
// сдавшемуся: партия идёт дальше без него (если игроков было 3+) — можно уйти в меню или смотреть
function afterSurrender(){
  setTimeout(()=>{ if(!G||G.over) return;
    const host=NET.role==='host'&&G.online;
    $('#modal').innerHTML=`<div class="ov" id="sgov"><div class="box" style="width:380px;text-align:center"><div style="font-size:44px">🏳️</div>
      <h2 style="margin:4px 0">Вы сдались</h2><p>Партия продолжается без вас. Итоги матча придут, когда она закончится.</p>
      ${host?'<p class="muted">Вы создатель комнаты: не закрывайте вкладку, пока игра не закончится — иначе она остановится у всех.</p>':''}
      <button id="sgMenu">В меню</button><button class="sec" id="sgWatch">Смотреть дальше</button></div></div>`;
    $('#sgMenu').onclick=()=>{ closeModal(); showLanding(); };
    $('#sgWatch').onclick=closeModal;
  },600);
}
// остался один игрок — партия заканчивается сразу, не дожидаясь конца чужого хода
function endIfLastStanding(){
  if(!G||G.over) return false;
  const alive=G.players.filter(x=>!x.out); if(alive.length>1) return false;
  gameId++; stopTimer(); const r=pending; pending=null; G.awaiting=false; G.askData=null; askData=null;
  if(typeof TR!=='undefined'&&TR) closeTrade();

  closeModal(); finishGame(alive[0]);
  return true;
}
const EARLY_SURRENDER=5; // сдался за первые 5 своих ходов — награды за матч нет
function doSurrender(p){
  if(!G||p.out||G.over) return;
  log(`🏳️ ${pn(p)} сдаётся`);
  if((p.turns||0)<=EARLY_SURRENDER){ p.noReward=true; log(`${pn(p)} сдался в первые ${EARLY_SURRENDER} ходов — награды за этот матч не будет`); }
  bankrupt(p,-1);
  if(endIfLastStanding()) return;
  if(pending&&actor()===p) answer(G.phase==='debt'?'give':'surrender');
}

function renderLog(){ const l=$('#log'); l.innerHTML=G.log.slice().reverse().map(x=>`<div>${x}</div>`).join(''); }

    case 'buy': { const c=CELLS[ad.i]; h=`<div class="acard"><b class="t">Покупаем? ${c.ic} ${c.name}</b><small>${OPT().auction?'Если откажетесь — компания уйдёт на аукцион.':'Если откажетесь, компания останется у Банка.'}</small>
      <div class="row2"><button data-a="buy" ${a.money<c.price?'disabled':''}>Купить за ${fmt(c.price)}</button><button data-a="skip" class="sec">${OPT().auction?'На аукцион':'Не покупать'}</button></div>${a.money<c.price?`<small style="margin:6px 0 0">Не хватает ${fmt(c.price-a.money)}. Нажмите на свою компанию, чтобы заложить её, или на игрока слева — чтобы обменяться. Потом «Купить» станет доступна.</small>`:''}</div>`; break; }

      ad.opts.map(i=>`<button data-a="${i}" ${a.money<stockPrice(i)?'disabled':''}>${CELLS[i].ic} ${CELLS[i].name} (${esc(G.players[G.cells[i].owner].name)}) — ${fmt(stockPrice(i))}</button>`).join('')+

$('#actions').onclick=e=>{
  const tb=e.target.closest('button[data-tut]');
  if(tb){ const s=tutSeen(); s[tb.dataset.tut]=1; try{ localStorage.setItem(TUT_KEY,JSON.stringify(s)); }catch(_){} renderActions(); return; }
  const b=e.target.closest('button[data-a]'); if(!b||b.disabled) return; const x=b.dataset.a;
  if(NET.role==='guest'){ if(x==='credit'||x==='repay') netSend({kind:'cmd',name:x}); else answer(x); return; }
  if(x==='trade') openTrade(); else if(x==='credit') takeCredit(actor()); else if(x==='repay') repayCredit(actor()); else answer(x); };
function ask(phase,data){ if(G&&G.over) return new Promise(()=>{}); G.phase=phase; askData=data||null; G.askData=askData; G.awaiting=true; return new Promise(r=>{ pending=r; startTimer(); render(); netPublishNow(); }); }
function answer(v){
  document.querySelectorAll('.cell.mvopt,.cell.pickopt').forEach(el=>el.classList.remove('mvopt','pickopt'));
  if(NET.role==='guest'){ // гость не ведёт игру — он отправляет свой выбор хозяину комнаты
    if(!canAct()) return; G.awaiting=false; netSend({kind:'answer',phase:G.phase,v:String(v)}); renderActions(); return;
  }
  stopTimer(); const r=pending; pending=null; G.phase='wait'; G.awaiting=false; G.askData=null; renderActions(); r&&r(v);
}

// ====== ТАЙМЕР ХОДА ======
// Срок хода хранится как время (G.tmDeadline), чтобы все игроки по сети видели одинаковый отсчёт.
let tmInt=null;
const tmRemain=()=>G&&G.tmDeadline?Math.max(0,Math.ceil((G.tmDeadline-Date.now())/1000)):0;
function stopTimer(){ if(tmInt){ clearInterval(tmInt); tmInt=null; } if(G) G.tmDeadline=0; }
function startTimer(){
  stopTimer();
  let t=OPT().timer; if(!t||!G||actor().bot) return;
  // игрок по сети не в сети — ждём меньше, чтобы он не тормозил остальных
  if(isRemote(actor())&&!isOnlineUid(actor().uid)) t=Math.min(t,20);
  G.tmDeadline=Date.now()+t*1000;

// ====== ИГРОВАЯ ЛОГИКА ======
// Третий кубик (режимы с third): появляется, когда кто-то впервые прошёл круг.
// Грани: 1–6, 🚂 поезд и 💼 бизнесмен. Возвращает [a,b,c], где c = 0 (кубика ещё нет), 1..6, 'T' (поезд) или 'W' (бизнесмен).
const DIE='⚀⚁⚂⚃⚄⚅';
const face3=c=>c==='T'?'🚂':c==='W'?'💼':DIE[c-1];
const roll3=(rnd=Math.random)=>{ const v=rnd()*8|0; return v===6?'T':v===7?'W':v+1; };
// «Задача дня»: кубики и карточки «Шанс» идут в одном порядке для всех (зерно — дата)
function mulberry(a){ return ()=>{ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
const hashStr=s=>{ let h=2166136261; for(const ch of s){ h^=ch.charCodeAt(0); h=Math.imul(h,16777619); } return h>>>0; };
const gRnd=()=>G&&G.seed!=null?mulberry(G.seed+(G.rc=(G.rc||0)+1)*7919)():Math.random();
async function rollDice(p){
  const third=!!M().third&&!!G.speedOn;
  for(let k=0;k<7;k++){ $('#dice').innerHTML=DIE[Math.random()*6|0]+DIE[Math.random()*6|0]+(third?`<span class="d3">${face3(roll3())}</span>`:''); await sleep(60); }
  const a=1+(gRnd()*6|0), b=1+(gRnd()*6|0), c=third?roll3(gRnd):0;
  G.roll={id:((G.roll&&G.roll.id)||0)+1,v:[a,b,c],pid:p.id}; dice3d(G.roll); FX&&(FX.rollId=G.roll.id);
  await sleep(950); // кубики докатываются
  $('#dice').innerHTML=G.diceHtml=DIE[a-1]+DIE[b-1]+(third?`<span class="d3">${face3(c)}</span>`:'');
  G.lastDice=a+b+(c==='T'||c==='W'?0:c);
  log(`${pn(p)} выбрасывает ${a}:${b}${third?' и '+(c==='T'?'🚂 поезд':c==='W'?'💼 бизнесмен':c):''}${a===b&&b===c?' — ТРОЙКА!':a===b?' — дубль!':''}`);
  if(a===b) track(p,'dbl');
  return [a,b,c];
}
// Куда идти после броска. Возвращает {steps} или {target}.
async function chooseMove(p,a,b,c){
  if(c==='T'){ // поезд: сумма двух кубиков или любой из них
    const opts=[...new Set([a+b,a,b])];
    let steps;
    if(p.bot) steps=botPickSteps(p,opts);
    else steps=+(await ask('move',{opts}));
    if(!opts.includes(steps)) steps=opts[0];
    log(`🚂 ${pn(p)} выбирает идти на ${steps}`);
    return {steps};
  }
  if(c&&a===b&&b===c){ // тройка: любая клетка
    let t;
    if(p.bot) t=botPickCell(p);
    else t=+(await ask('pick'));
    if(!(t>=0&&t<40)) t=(p.pos+a+b+c)%40;
    log(`🎯 ${pn(p)} выбирает клетку ${cn(t)}`);
    return {target:t};
  }
  if(c==='W'){ log(`💼 ${pn(p)}: бизнесмен — после хода едет к первой свободной компании`); return {steps:a+b,boss:true}; }
  return {steps:a+b+(c||0)};
}
// бот: клетка, которую выгоднее всего занять/пройти
function cellScore(p,i){
  const c=CELLS[i], s=G.cells[i];
  if(c.type==='gojail') return -1000;
  if(isOwnable(c)){
    if(s.owner<0) return p.money>=c.price?c.price/100+(c.g&&groupCells(c.g).filter(j=>j!==i).every(j=>G.cells[j].owner===p.id)?50:0):1;
    if(s.owner===p.id) return 5;
    return s.mort?4:-calcRent(i,G.lastDice)/50;
  }
  if(c.type==='tax') return -c.amount/100;
  if(c.type==='start') return 10;
  return 2;
}
function botPickSteps(p,opts){ return opts.slice().sort((x,y)=>cellScore(p,(p.pos+y)%40)-cellScore(p,(p.pos+x)%40))[0]; }
function botPickCell(p){ let best=0,bs=-1e9; for(let i=0;i<40;i++){ const sc=cellScore(p,i); if(sc>bs){ bs=sc; best=i; } } return best; }
async function move(p,n){
  for(let k=0;k<n;k++){
    p.pos=(p.pos+1)%40;
    if(p.pos===0){ p.laps=(p.laps||0)+1; checkRentStage(); const sal=salary(); p.money+=sal; log(sal?`${pn(p)} проходит Старт и получает ${fmt(sal)}`:`${pn(p)} проходит Старт — после ${SALARY_OFF_R}-го круга за круг не платят`); track(p,'start');
      if(M().third&&!G.speedOn){ G.speedOn=true; log(`⚡ ${pn(p)} первым прошёл круг — теперь все бросают <b>третий кубик</b> (1–6, 🚂 поезд или 💼 бизнесмен)!`); } }

  }
}
async function moveTo(p,t){ await move(p,(t-p.pos+40)%40); }
// «Быстрая игра» и «Расклад»: когда ВСЕ оставшиеся игроки прошли 15 / 20 / 25 кругов,
// владелец получает только 75% / 50% / 25% аренды (остальное забирает Банк) — партия быстрее идёт к концу
const RENT_STAGES=[[25,0.25],[20,0.5],[15,0.75]];
const rentCutModes=()=>['fast','deal'].includes(G&&G.mode);
const minLaps=()=>{ const a=G.players.filter(p=>!p.out); return a.length?Math.min(...a.map(p=>p.laps||0)):0; };
function rentShare(){ if(!rentCutModes()) return 1; const l=minLaps(); for(const [n,s] of RENT_STAGES) if(l>=n) return s; return 1; }
function checkRentStage(){
  if(!rentCutModes()) return; const s=rentShare();
  if(s<(G.rentStage||1)){ G.rentStage=s; log(`<span style="color:#ffb627">🏦 Все игроки прошли ${minLaps()} кругов — теперь владельцы получают только <b>${Math.round(s*100)}%</b> аренды</span>`); }
}
// сделать ход по результату броска и обработать клетку; 💼 бизнесмен — затем ехать дальше
async function doMove(p,mv){

// 💼: вперёд до первой свободной компании; если свободных нет — до ближайшей компании соперника
async function bossJump(p){

  let why='свободной компании';

function sendJail(p){ p.pos=10; p.inJail=true; p.jailTries=0; p.dbl=0; log(`${pn(p)} отправляется в тюрьму 🚔`); render(); }

async function land(p,dice){

  .sort((a,b)=>calcRent(b,7)-calcRent(a,7)).slice(0,6);
async function stock(p){
  const opts=stockOpts(p).filter(i=>p.money>=stockPrice(i));
  if(!opts.length){ log(`📊 ${pn(p)} на фондовом рынке, но купить нечего`); return; }
  let pick=null;
  if(p.bot){ const i=opts[0]; if(p.money-stockPrice(i)>=4000&&gRnd()<0.6) pick=i; await sleep(400); }
  else { const v=await ask('stock',{opts}); if(p.out) return; if(opts.includes(+v)) pick=+v; }
  if(pick===null){ log(`📊 ${pn(p)} не покупает акции`); return; }
  const s=G.cells[pick]; p.money-=stockPrice(pick); s.sh=[...(s.sh||[]),p.id];

}
// владелец получил аренду r за клетку i — акционеры получают свою долю
function payDividends(i,r){
  const s=G.cells[i], o=G.players[s.owner]; if(!s.sh||!o) return;
  for(const k of s.sh){ const h=G.players[k]; if(!h||h.out||h===o) continue;

// Аукцион виден всем: G.auc = {i, price, leader, all:[ids], active:[ids], cur, next} — рисуется панелью в центре поля
async function auction(i,decliner){
  const c=CELLS[i], s=G.cells[i];
  let price=c.price, leader=null;
  let active=G.players.filter(p=>!p.out&&p!==decliner&&p.money>=price);
  if(!active.length){ log(`🔨 Аукцион за ${cn(i)} не состоялся — ни у кого нет ${fmt(price)}`); return; }
  log(`🔨 Аукцион за ${cn(i)}! Стартовая цена ${fmt(price)}`);
  const all=active.map(p=>p.id);
  const step=()=>Math.max(100,Math.round(price*0.1/100)*100);
  const setAuc=(cur,next)=>{ G.auc={i,price,leader:leader?leader.id:null,all,active:active.map(p=>p.id),cur:cur?cur.id:null,next}; render(); netPublishNow(); };
  try{
    while(true){
      const others=active.filter(p=>p!==leader);
      if(!others.length) break;
      for(const p of others){
        if(active.length===1&&active[0]===leader) break;
        const next=leader?price+step():price;
        setAuc(p,next);
        const yes=p.money>=next&&(p.bot?(await sleep(500),botBid(p,i,next)):await askBid(p,i,next,leader,price));
        if(yes){ leader=p; price=next; log(`🔨 ${pn(p)} ставит ${fmt(price)}`); }
        else { active=active.filter(x=>x!==p); log(`🔨 ${pn(p)} пасует`); }
        setAuc(null,null);
      }
    }
  } finally { if(G) G.auc=null; }
  if(leader){ leader.money-=price; s.owner=leader.id; log(`🔨 ${pn(leader)} выигрывает аукцион и покупает ${cn(i)} за ${fmt(price)}`); track(leader,'buy'); }
  else log(`🔨 Никто не купил ${cn(i)}`);
  render(); netPublishNow();
}
function botBid(p,i,next){
  const c=CELLS[i];
  const completes=c.type==='prop'&&groupCells(c.g).filter(j=>j!==i).every(j=>G.cells[j].owner===p.id);
  return next<=c.price*(completes?1.9:1.2)&&p.money-next>=800;
}
// Вопрос конкретному игроку: если он играет по сети с другого компьютера — спрашиваем через базу

  if(isRemote(p)) return askRemote(p,'bid',{i,next,leader:leader?leader.id:null,cur},false).then(v=>!!v);

}

}

// ====== КРЕДИТ БАНКА И СРОК ЗАЛОГА ======
const OPT=()=>(G&&G.opt)||{};
// Кредит Банка: 5,000k, вернуть 6,000k за CREDIT_TURNS своих ходов; после возврата новый — через CREDIT_CD ходов
const CREDIT=5000, CREDIT_BACK=6000, CREDIT_TURNS=10, CREDIT_CD=3, MORT_ROUNDS=15;
const creditLeft=p=>p.credit?Math.max(0,(p.credit.dueT!=null?p.credit.dueT:(p.turns||0)+CREDIT_TURNS)-(p.turns||0)):0;
const creditWait=p=>Math.max(0,(p.creditCd||0)-(p.turns||0)); // сколько ходов ждать до нового кредита
const canTakeCredit=p=>!!OPT().credit&&!p.credit&&!creditWait(p);
function takeCredit(p){ if(!canTakeCredit(p)) return; p.money+=CREDIT; p.credit={dueT:(p.turns||0)+CREDIT_TURNS}; log(`🏦 ${pn(p)} берёт у Банка в кредит ${fmt(CREDIT)} — вернуть ${fmt(CREDIT_BACK)} за ${CREDIT_TURNS} своих ходов`); render(); }
function repayCredit(p){ if(!p.credit||p.money<CREDIT_BACK) return; p.money-=CREDIT_BACK; p.credit=null; p.creditCd=(p.turns||0)+CREDIT_CD; log(`🏦 ${pn(p)} возвращает кредит Банку. Новый можно взять через ${CREDIT_CD} хода`); track(p,'repay'); render(); }
function checkMortgages(){
  if(!OPT().mortLimit) return;
  G.cells.forEach((s,i)=>{ if(s.mort&&s.owner>=0&&(G.round-(s.mortR||G.round))>=MORT_ROUNDS){
    log(`🔒 Срок залога ${cn(i)} истёк — компания уходит Банку`); s.owner=-1; s.mort=false; s.level=0; resetCell(s); } });
}
const mortLeft=s=>OPT().mortLimit?Math.max(0,MORT_ROUNDS-((G.round||1)-(s.mortR||G.round||1))):'';
async function chance(p){
  const k=CHANCE[gRnd()*CHANCE.length|0];
  log(`${pn(p)} — «Шанс»: ${k.t}`);
  await sleep(300);
  if(k.money>0) p.money+=k.money;
  if(k.money<0){ await pay(p,-k.money,-1); if(!p.out) track(p,'chancepay',-k.money); }
  if(k.card) p.jailCards++;
  if(k.jail) sendJail(p);
  if(k.go!==undefined){ const t=CELLS.findIndex(c=>c.name===k.go); await moveTo(p,t); if(t!==0) await land(p,G.lastDice); }
  if(k.back){ p.pos=(p.pos-k.back+40)%40; render(); await land(p,G.lastDice); }
  if(k.each){ for(const o of G.players) if(o!==p&&!o.out&&!p.out) await pay(o,k.each,p.id); }
  if(k.perLevel){ const t=G.cells.reduce((sum,s)=>sum+(s.owner===p.id?s.level:0),0)*k.perLevel; if(t){ log(`${pn(p)} платит за ремонт ${fmt(t)}`); await pay(p,t,-1); if(!p.out) track(p,'chancepay',t); } }
  render();
}
async function pay(p,amt,to){
  if(p.money<amt){
    if(p.bot) autoLiquidate(p,amt);
    else { G.debt={pid:p.id,amt,to}; const r=await ask('debt'); G.debt=null; if(r!=='pay'){ bankrupt(p,to); return; } }
    if(p.money<amt){ bankrupt(p,to); return; }
  }
  p.money-=amt; if(to>=0) G.players[to].money+=amt; render();
}
function bankrupt(p,to){
  if(p.out) return;
  const cred=to>=0?G.players[to]:null;
  G.cells.forEach((s,i)=>{ if(s.owner===p.id&&s.level){ p.money+=s.level*CELLS[i].house/2; s.level=0; } });
  if(cred) cred.money+=Math.max(0,p.money);
  G.cells.forEach(s=>{ if(s.owner===p.id){ if(cred) s.owner=cred.id; else { s.owner=-1; s.mort=false; resetCell(s); } } });
  p.money=0; p.out=true; p.inJail=false; p.credit=null; checkRentStage();
  log(`💥 ${pn(p)} объявляет банкротство${cred?' — всё имущество переходит к '+pn(cred):''}`);
  render();
}

// ====== ОБМЕН ======
// t = {from, to, give:[клетки from→to], get:[клетки to→from], mFrom, mTo}
// компании можно менять вместе с филиалами — филиалы переходят к новому владельцу
const canTradeCell=(i,pid)=>isOwnable(CELLS[i])&&G.cells[i].owner===pid;
function tradeText(t){
  const A=G.players[t.from],B=G.players[t.to];
  const side=(cells,m)=>{ const parts=cells.map(i=>`${CELLS[i].ic} ${CELLS[i].name}${G.cells[i].level?' '+'★'.repeat(G.cells[i].level):''}${G.cells[i].mort?' 🔒':''}`); if(m) parts.push('💰 '+fmt(m)); return parts.length?parts.join(', '):'ничего'; };
  return `${pn(A)} отдаёт: ${side(t.give,t.mFrom)}<br>${pn(B)} отдаёт: ${side(t.get,t.mTo)}`;
}
function tradeValid(t){
  const A=G.players[t.from],B=G.players[t.to];
  return !A.out&&!B.out&&t.mFrom<=A.money&&t.mTo<=B.money&&t.give.every(i=>canTradeCell(i,t.from))&&t.get.every(i=>canTradeCell(i,t.to))&&(t.give.length+t.get.length+t.mFrom+t.mTo>0);
}
function execTrade(t){
  const A=G.players[t.from],B=G.players[t.to];
  t.give.forEach(i=>G.cells[i].owner=B.id); t.get.forEach(i=>G.cells[i].owner=A.id);
  A.money+=t.mTo-t.mFrom; B.money+=t.mFrom-t.mTo;
  log(`🤝 Обмен состоялся!<br>${tradeText(t)}`.replace(/отдаёт/g,'отдал(а)'));
  track(A,'trade'); track(B,'trade');
  render();
}
function botScore(pid,t){
  const recvCells=t.to===pid?t.give:t.get, loseCells=t.to===pid?t.get:t.give;
  const recvMoney=t.to===pid?t.mFrom:t.mTo, loseMoney=t.to===pid?t.mTo:t.mFrom;
  const other=t.to===pid?t.from:t.to;
  const after=i=>t.give.includes(i)?t.to:t.get.includes(i)?t.from:G.cells[i].owner;
  const fullAfter=(who,g)=>groupCells(g).every(i=>after(i)===who);
  const val=i=>CELLS[i].price*(G.cells[i].mort?0.45:1)+G.cells[i].level*(CELLS[i].house||0);
  let s=recvMoney-loseMoney;
  for(const i of recvCells){ const c=CELLS[i]; s+=val(i); if(c.g&&fullAfter(pid,c.g)&&!ownsGroup(pid,c.g)) s+=c.price*1.5; }
  for(const i of loseCells){ const c=CELLS[i]; s-=val(i)*1.1; if(c.g&&ownsGroup(pid,c.g)) s-=c.price*2; if(c.g&&fullAfter(other,c.g)&&!ownsGroup(other,c.g)) s-=c.price*1.0; }
  return s;
}
function confirmTrade(t){
  if(!G||G.over) return new Promise(()=>{});
  const B=G.players[t.to];
  if(isRemote(B)) return askRemote(B,'trade',{t},false).then(v=>!!v);
  return confirmTradeUI(t);
}
// ====== ДОГОВОР (обмен) — окно в центре поля; компании выбираются нажатием на клетки ======
let TR=null, tradePartner=null;
const tradeVal=(cells,m)=>m+cells.reduce((s,i)=>s+CELLS[i].price*(G.cells[i].mort?0.5:1)+G.cells[i].level*(CELLS[i].house||0),0);
const av2=p=>`<div class="av2" style="background:${p.color}">${p.skin||avLetter(p)}</div>`;
function tItem(i,rm){ const c=CELLS[i], s=G.cells[i];

function markTradeCells(){

function closeTrade(){ if(TR&&TR.res) TR.res(false); TR=null; const b=$('#tradeBox'); if(b){ b.classList.remove('on'); b.innerHTML=''; } markTradeCells(); }
function openTrade(partnerId){

    if(v===null||!TR) return; const n=Math.max(0,Math.min(p.money,Math.floor(+String(v).replace(/\s/g,'')||0)));
    if(k==='a') TR.mFrom=n; else TR.mTo=n; return drawTrade(); }
  const b=e.target.closest('[data-tx]'); if(!b) return; const x=b.dataset.tx;
  if(x==='close') return closeTrade();
  if(x==='yes'||x==='no'){ const r=TR.res; TR.res=null; closeTrade(); r&&r(x==='yes'); return; }
  if(x==='send'){
    const t={from:TR.A,to:TR.B,give:TR.give.slice(),get:TR.get.slice(),mFrom:TR.mFrom,mTo:TR.mTo};
    if(!t.give.length&&!t.get.length&&!t.mFrom&&!t.mTo) return drawTrade('Выберите, что меняете: нажмите на компании на поле или ✎ у денег.');
    if(!tradeValid(t)) return drawTrade('Сделка невозможна — проверьте деньги и компании.');
    const B=G.players[t.to];
    if(NET.role==='guest'){ netSend({kind:'cmd',name:'trade',t}); closeTrade(); toast('📨 Предложение отправлено — ответ появится в журнале'); return; }
    closeTrade(); if(isRemote(B)) toast(`📨 Ждём ответа ${B.name}…`);
    const r=await proposeTrade(t); if(!r.ok&&B.bot) toast(r.msg.replace(/<[^>]+>/g,''));
  }
};
// клик по клетке поля, пока открыт договор: добавить/убрать компанию
function tradeCellClick(i){
  if(!TR||TR.view) return false;
  const owner=canTradeCell(i,TR.A)?'give':canTradeCell(i,TR.B)?'get':null;
  if(!owner){ toast('Эту компанию нельзя добавить в договор'); return true; }

// входящее предложение — то же окно, только «Принять / Отклонить»; клетки сделки мигают на поле
function confirmTradeUI(t){

// Предложить обмен: бот решает сам, живой игрок — в окне подтверждения (у себя или по сети)
async function proposeTrade(t){
  const A=G.players[t.from], B=G.players[t.to];
  if(!A||!B||!tradeValid(t)) return {ok:false,msg:'Сделка невозможна.'};
  const ok=B.bot?botScore(B.id,t)>0:await confirmTrade(t);
  if(ok&&tradeValid(t)){ execTrade(t); return {ok:true}; }
  log(`${pn(B)} отклоняет предложение обмена от ${pn(A)}`); render();
  return {ok:false,msg:`${pn(B)} отказывается. Предложите больше.`};
}

// ====== БОТЫ ======
async function botTrade(p){
  if(!G.declined) G.declined={};
  for(const g in GROUPS){
    const gc=groupCells(g), mine=gc.filter(i=>G.cells[i].owner===p.id);
    if(mine.length!==gc.length-1) continue;
    const j=gc.find(i=>G.cells[i].owner!==p.id), s=G.cells[j];
    if(s.owner<0||G.players[s.owner].out||!canTradeCell(j,s.owner)) continue;
    const key=p.id+'-'+j; if(G.declined[key]&&G.turnNo-G.declined[key]<12) continue;
    const base=CELLS[j].price*(s.mort?0.5:1);
    const offer=Math.round(base*(p.money>base*3?2.4:1.7)/100)*100;
    if(p.money-offer<1000) continue;
    const t={from:p.id,to:s.owner,give:[],get:[j],mFrom:offer,mTo:0};
    const o=G.players[s.owner];
    const ok=o.bot?botScore(o.id,t)>0:await confirmTrade(t);
    if(ok&&tradeValid(t)) execTrade(t);
    else { G.declined[key]=G.turnNo||0; log(`${pn(o)} отклоняет предложение обмена от ${pn(p)}`); }
    return;
  }
}
function botWantsBuy(p,i){
  const c=CELLS[i];
  const completes=c.type==='prop'&&groupCells(c.g).filter(j=>j!==i).every(j=>G.cells[j].owner===p.id);
  return p.money-c.price>=(completes?300:1500);
}
function autoLiquidate(p,amt){
  while(p.money<amt){
    const withLv=cellsOf(p.id).filter(i=>canSell(i)).sort((a,b)=>G.cells[b].level-G.cells[a].level);
    if(withLv.length){ const i=withLv[0]; G.cells[i].level--; p.money+=CELLS[i].house/2; log(`${pn(p)} продаёт филиал в ${cn(i)}`); continue; }
    const m=cellsOf(p.id).filter(i=>canMortgage(i)).sort((a,b)=>CELLS[a].price-CELLS[b].price);
    if(canTakeCredit(p)){ takeCredit(p); continue; }
    if(m.length){ const i=m[0]; G.cells[i].mort=true; G.cells[i].mortR=G.round||1; p.money+=CELLS[i].price/2; log(`${pn(p)} закладывает ${cn(i)}`); continue; }
    break;
  }
}
async function botManage(p){
  if(p.credit&&p.money>CREDIT_BACK+6000) repayCredit(p);
  if(Math.random()<0.6) await botTrade(p);
  for(const i of cellsOf(p.id).filter(i=>G.cells[i].mort))
    if(p.money-unmortCost(i)>5000){ p.money-=unmortCost(i); G.cells[i].mort=false; log(`${pn(p)} выкупает ${cn(i)}`); }
  let built=true;
  while(built){
    built=false;
    if(M().noMono){
      const i=cellsOf(p.id).filter(i=>CELLS[i].type==='prop'&&!G.cells[i].mort&&G.cells[i].level<5).sort((a,b)=>G.cells[a].level-G.cells[b].level||CELLS[b].price-CELLS[a].price)[0];
      if(i!==undefined&&p.money-CELLS[i].house>=3500){ doBuild(p,i); built=true; }
      continue;
    }
    for(const g in GROUPS){
      if(!ownsGroup(p.id,g)) continue;
      const gc=groupCells(g); if(gc.some(j=>G.cells[j].mort)) continue;
      const i=gc.slice().sort((a,b)=>G.cells[a].level-G.cells[b].level)[0];
      if(G.cells[i].level<5&&p.money-houseCost(i)>=2500){ doBuild(p,i); built=true; }
    }
  }
  // штаб-квартира — на самую дорогую компанию группы, если хватает с запасом
  for(const i of cellsOf(p.id)) if(canHQ(i)&&p.money-hqCost(i)>=4000&&groupCells(CELLS[i].g).every(j=>CELLS[j].price<=CELLS[i].price)) cellAction(p,i,'hq');
  render();
}

// ====== ХОДЫ ======
async function playTurn(){ try{ await turnInner(); }catch(e){ if(e!=='stale') console.error(e); } }
async function turnInner(){
  if(G.over) return;
  const myGame=gameId;
  save();
  const p=curP(); p.dbl=0; G.turnNo=(G.turnNo||0)+1; p.turns=(p.turns||0)+1; // p.turns — сколько своих ходов сделал игрок
  log(`— Ход ${pn(p)} —`);
  render();
  if(p.credit&&creditLeft(p)<=0){
    log(`🏦 Срок кредита ${pn(p)} истёк — Банк списывает ${fmt(CREDIT_BACK)}`);
    p.credit=null; p.creditCd=p.turns+CREDIT_CD; await pay(p,CREDIT_BACK,-1); track(p,'repay');
  }
  let again=true;
  while(again&&!p.out){
    again=false;
    if(p.inJail){
      const choice=p.bot?(await sleep(700),p.jailCards?'card':(p.money>4000?'pay':'roll')):await ask('jail');
      if(p.out) break;
      if(choice==='card'){ p.jailCards--; p.inJail=false; log(`${pn(p)} использует карту 🎫 и выходит из тюрьмы`); }
      else if(choice==='pay'){ log(`${pn(p)} платит ${fmt(JAIL_FINE)} и выходит из тюрьмы`); await pay(p,JAIL_FINE,-1); if(p.out) break; p.inJail=false; }
      else {
        const [a,b,c]=await rollDice(p);
        if(a===b){ p.inJail=false; log(`${pn(p)} выходит из тюрьмы по дублю`); const mv=await chooseMove(p,a,b,c); if(p.out) break;
          await doMove(p,mv); }
        else if(++p.jailTries>=3){ log(`${pn(p)} не смог выбросить дубль за 3 попытки и платит ${fmt(JAIL_FINE)}`); await pay(p,JAIL_FINE,-1); if(p.out) break; p.inJail=false;
          const mv=await chooseMove(p,a,b,c); if(p.out) break;
          await doMove(p,mv); }
        else log(`${pn(p)} остаётся в тюрьме`);
        break;
      }
    }
    if(p.bot) await sleep(650); else await ask('roll');
    if(p.out) break;
    const [a,b,c]=await rollDice(p);
    if(a===b){ if(++p.dbl>=3){ log(`${pn(p)} выбрасывает третий дубль подряд!`); sendJail(p); break; } again=true; }
    const mv=await chooseMove(p,a,b,c);
    if(p.out) break;
    await doMove(p,mv);
    if(p.inJail) again=false;
    if(again&&!p.out) log(`${pn(p)} ходит ещё раз (дубль)`);
  }
  if(!p.out){ if(p.bot){ await botManage(p); await sleep(500); } else await ask('end'); }
  if(myGame===gameId) nextPlayer();
}
function nextPlayer(){
  const alive=G.players.filter(p=>!p.out);
  if(alive.length<=1) return finishGame(alive[0]);
  const prev=G.cur;
  do{ G.cur=(G.cur+1)%G.players.length; }while(G.players[G.cur].out);
  if(G.cur<=prev){
    G.round=(G.round||1)+1;
    checkMortgages();
    if(G.event){ log(`Событие «${(EVENTS.find(v=>v.id===G.event.id)||{}).n}» закончилось`); G.event=null; }
    if(G.round%5===0) startEvent();
    if(G.round===SALARY_LOW_R+1) log(`💸 Начался ${G.round}-й круг: за проход Старта теперь платят только ${fmt(SALARY_LOW)}`);
    if(G.round===SALARY_OFF_R+1) log(`💸 Начался ${G.round}-й круг: за проход Старта больше не платят`);
    const lim=M().rounds;
    if(lim){
      if(G.round>lim){ const w=alive.slice().sort((a,b)=>netWorth(b)-netWorth(a))[0]; log(`⏱️ Все ${lim} кругов сыграны! Самый богатый — ${pn(w)} (${fmt(netWorth(w))})`); return finishGame(w); }
      log(`— Круг ${G.round} из ${lim} —`);
    }
  }
  setTimeout(playTurn,50);
}
// Итоги: награды считает тот, кто ведёт игру (офлайн — этот браузер, по сети — хозяин комнаты),
// а начисляет себе каждый игрок сам (applyMyResult) — менять чужие профили правила базы не дают.
function finishGame(w){
  G.over=true; if(!G.online) localStorage.removeItem(SAVE_KEY);
  stopTimer();
  const ranked=!!M().ranked;
  G.winner=w?w.id:-1;
  G.results=G.players.filter(p=>p.uid||p.acc).map(p=>{
    const win=p===w, a=p.acc&&DB.accounts[p.acc];
    const vip=a?isVip(a):!!p.vip;
    const rd=ranked?(win?25:-15):0;
    const score=M().daily?Math.round(netWorth(p)):null;
    if(p.noReward) return {uid:p.uid||p.acc,pid:p.id,win:false,xp:0,rd,drop:null,tp:null,noReward:true,score};
    // VIP в рейтинговой игре получает предмет гарантированно, остальные — по таблице выпадения
    const it=rollDrop(vip&&ranked);
    return {uid:p.uid||p.acc,pid:p.id,win,xp:50+(win?150:0),rd,drop:it?it.id:null,tp:(G.tp&&p.uid&&G.tp[p.uid])||null,score};
  });
  render(); netPublishNow();
  saveMatchLog(); showWinner(w,applyMyResult());
}
// начислить себе свою награду (один раз) и вернуть строки итогов для окна победителя
function applyMyResult(){
  const lines=(G.results||[]).map(r=>{ const p=G.players[r.pid]; const it=r.drop&&item(r.drop);
    if(r.noReward) return `${pn(p)}: 🏳️ сдался в первые ${EARLY_SURRENDER} ходов — без награды${r.rd?` · рейтинг ${r.rd}`:''}`;
    return `${pn(p)}: +${r.xp} XP${r.rd?` · рейтинг ${r.rd>0?'+':''}${r.rd}`:''}${r.score!=null?` · 🧩 капитал <b>${fmt(r.score)}</b>`:''}<br>${it?`🎁 Выпало: ${it.ic} <b>${esc(it.n)}</b> <span style="color:${RAR[it.r][1]}">${RAR[it.r][0]}</span> · ${fmtC(it.val)}`:'<span class="muted">Предмет в этот раз не выпал</span>'}`; });
  const r=(G.results||[]).find(x=>x.uid===DB.session), a=me();
  const key=G.online?G.rid:'local'+G.turnNo+'_'+(G.log.length);
  if(r&&a&&a.lastGame!==key){
    a.lastGame=key; a.matches++; if(r.win) a.wins++; a.xp+=r.xp;
    if(r.noReward){ if(r.rd) a.rating=Math.max(0,(a.rating||1000)+r.rd);
      a.history=[{t:Date.now(),mode:G.mode,win:false,n:G.players.length},...(a.history||[])].slice(0,20); addLeagues(a,r); checkAch(a); saveDB(); return lines; }
    if(r.rd) a.rating=Math.max(0,(a.rating||1000)+r.rd);
    if(r.drop) addItem(a,r.drop);
    a.history=[{t:Date.now(),mode:G.mode,win:r.win,n:G.players.length},...(a.history||[])].slice(0,20);
    const meP={acc:DB.session};
    const G0=G; G=null; // чтобы track() не писал в журнал партии и не считал это игрой по сети
    if(r.tp) Object.entries(r.tp).forEach(([id,v])=>track(meP,id,v));
    if(r.win){ track(meP,'win'); track(meP,'win_'+G0.mode); } track(meP,'play'); track(meP,'play_'+G0.mode);
    G=G0; addLeagues(a,r); checkAch(a); saveDB();
  }
  return lines;
}
// сезон (месяц): победа +3 очка, матч +1 · неделя среди друзей · лучший результат задачи дня
function addLeagues(a,r){
  const sk=seasonKey(); a[sk]=(a[sk]||0)+(r.noReward?0:(r.win?3:1));
  if(G&&G.online&&isWeekend()&&!r.noReward){ const wk2=weekendKey(); a[wk2]=(a[wk2]||0)+(r.win?3:1); }
  const wk=weekKey(); if(!a.wk||a.wk.id!==wk) a.wk={id:wk,w:0,m:0}; a.wk.m++; if(r.win&&!r.noReward) a.wk.w++;
  if(r.score!=null){ const dk=dailyKey(); if(r.score>(a[dk]||0)){ a[dk]=r.score; setTimeout(()=>toast(`🧩 Новый лучший результат дня: ${fmt(r.score)}`),600); } }
}

const OPT_LIST=[['timer','⏱ Таймер хода — 90 секунд','Если не успели, ход делается автоматически'],['auction','🔨 Аукцион','Если игрок отказался от покупки, компания уходит с молотка'],['credit','🏦 Кредит Банка','5,000k — вернуть 6,000k за 10 своих ходов. Новый можно взять через 3 хода после возврата'],['mortLimit','🔒 Срок залога — 15 кругов','Не выкупили вовремя — компания уходит Банку']];
function defaultRows(){ const u=me(); return [{type:u?'me':'guest',name:u?u.name:'Вы'},{type:'bot',name:'Бот Алиса'},{type:'bot',name:'Бот Борис'},{type:'bot',name:'Бот Вика'}]; }
// режимы с заданным составом: рейтинговая — вы и 3 бота, задача дня — вы и 2 бота
const fixedRows=m=>m.ranked?defaultRows():m.daily?defaultRows().slice(0,3):null;
// ключи сезона (месяц), недели и дня — для таблиц лидеров
const pad2=n=>String(n).padStart(2,'0');
const seasonKey=(d=new Date())=>`sp_${d.getFullYear()}_${pad2(d.getMonth()+1)}`;
const prevSeasonKey=()=>{ const d=new Date(); d.setDate(1); d.setMonth(d.getMonth()-1); return seasonKey(d); };
const seasonName=k=>{ const [,y,m]=k.split('_'); return ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'][+m-1]+' '+y; };
const weekKey=(d=new Date())=>{ const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())); const day=t.getUTCDay()||7; t.setUTCDate(t.getUTCDate()+4-day);
  const y0=new Date(Date.UTC(t.getUTCFullYear(),0,1)); return t.getUTCFullYear()+'-'+Math.ceil(((t-y0)/86400000+1)/7); };
const dailyKey=()=>'dl_'+today().replace(/-/g,'');
const dailyLeft=u=>!u?0:Math.max(0,MODES.daily.tries-((u.dTry&&u.dTry.day===today())?u.dTry.n:0));
// рамка аватара по уровню: 🥉 с 3, серебро с 8, золото с 15, бриллиант с 25
const FRAME=[[25,'#6fe3ff'],[15,'#ffc83d'],[8,'#c3cad6'],[3,'#cd8a4a']];
const ringOf=a=>{ const l=a.xp!=null?levelInfo(a.xp).lvl:(a.lvl||0); const f=FRAME.find(x=>l>=x[0]); return f?f[1]:a.color; };
function avc(a,size=44){ const ic=item(a.eq).ic; return `<div class="avc" style="width:${size}px;height:${size}px;background:${a.color};font-size:${size*0.45}px;--ring:${ringOf(a)}">${ic||esc((a.name[0]||'?').toUpperCase())}</div>`; }
// почему режим закрыт: 'vip' | 'lvl' | 'guest' | null
function modeLock(id,u){
  const m=MODES[id];
  if(m.daily) return !u?'guest':dailyLeft(u)?null:'daily';
  if(m.ranked) return !u?'guest':levelInfo(u.xp).lvl<m.needLvl?'lvl':null;
  if(m.vip) return !u?'guest':isVip(u)?null:'vip';
  return null;
}

  $('#rows').onchange=e=>{ const k=e.target.dataset.t; if(k===undefined) return; const v=e.target.value, r=setupRows[k];

    else if(v==='bot'&&!r.name.startsWith('Бот')) r.name=BOT_NAMES.find(n=>!setupRows.some(x=>x.name===n))||'Бот';

     }),

  if(mode.deal){
